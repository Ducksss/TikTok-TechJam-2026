slate(80 842)"><line x1="0" x2="1276" y1="0" y2="0" stroke="#28415b"/><text x="0" y="35" class="small">NEXT</text><text x="52" y="35" class="body">Softmax converts each expert’s two logits to P(fake); the ensemble averages the four probabilities.</text><text x="1276" y="35" class="small" text-anchor="end">Source: released infer/model.py</text></g></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>