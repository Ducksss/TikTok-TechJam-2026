<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag four-expert model architecture</title><desc id="desc">Two CLIP ViT-L/14 experts take 224 pixel inputs and use 768-dimensional image embeddings. Two SigLIP So400M Patch14-384 experts take 384 pixel inputs and use 1152-dimensional pooled features. Each expert has a linear, ReLU, dropout 0.3, linear classifier head that outputs two logits.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#7a92ad" stroke-opacity=".07" d="M40 0H0V40"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#f4f8ff" flood-opacity=".45" stdDeviation="16"/></filter><marker id="blue" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#60a5fa" d="M0 0L10 5L0 10Z"/></marker><marker id="amber" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#fbbf24" d="M0 0L10 5L0 10Z"/></marker><marker id="lime" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a3e635" d="M0 0L10 5L0 10Z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#65e6d2}.headline{font-size:46px;font-weight:740;letter-spacing:-1.3px;fill:#f5f9ff}.subtitle{font-size:19px;fill:#aabbd0}.group{font-size:13px;font-weight:800;letter-spacing:2px}.expert{font-size:18px;font-weight:750;fill:#f3f8fd}.body{font-size:14px;fill:#b7c7d9}.small{font-size:12px;fill:#8da4be}.node{fill:#dbe7f3}.dim,.node{font-size:13px;font-weight:700}</style><style>text{fill:#111827}.eyebrow{fill:#2448c2}.body,.small,.subtitle{fill:#52627a}.headline{fill:#111827}.dim,.mono{fill:#253651}</style></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><g class="sans"><text x="80" y="74" class="eyebrow">MODEL ARCHITECTURE · RELEASED FOUR-EXPERT ENSEMBLE</text><text x="80" y="130" class="headline">Diverse vision encoders, matching binary heads</text><text x="80" y="168" class="subtitle">Every checkpoint restores a complete encoder and classifier; no separate base-model weights are required.</text><g><text x="0" y="0" class="small" transform="translate(80 214)">MODEL VIEW</text><text x="166" y="0" class="small" transform="translate(80 214)">VISION ENCODER</text><text x="542" y="0" class="small" transform="translate(80 214)">FEATURE</text><text x="708" y="0" class="small" transform="translate(80 214)">CLASSIFIER HEAD</text><text x="1162" y="0" class="small" transform="translate(80 214)">OUTPUT</text></g><g filter="url(#shadow)" transform="translate(64 240)"><rect width="1312" height="266" fill="#edf3ff" stroke="#2563eb" stroke-width="2" rx="28"/><rect width="98" height="30" x="20" y="20" fill="#174078" rx="15"/><circle cx="40" cy="35" r="6" fill="#60a5fa"/><text x="56" y="40" fill="#cde3ff" class="group">CLIP ×2</text><text x="136" y="40" class="small">Experts 1 and 2 · independent released checkpoints</text><g transform="translate(20 70)"><rect width="1272" height="78" fill="#f4f8ff" stroke="#27466f" rx="16"/><rect width="116" height="44" x="16" y="17" fill="#edf3ff" rx="12"/><text x="74" y="45" class="expert" text-anchor="middle">EXPERT 1</text><path stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)" d="M132 39H164"/><rect width="334" height="54" x="174" y="12" fill="#edf3ff" stroke="#3b82f6" rx="12"/><text x="190" y="34" class="expert">CLIP ViT-L/14</text><text x="190" y="54" class="small">224 px · 24 layers · hidden 1024 · patch 14</text><path stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)" d="M508 39H542"/><rect width="134" height="54" x="552" y="12" fill="#edf3ff" stroke="#3b82f6" rx="12"/><text x="619" y="34" fill="#b9d8ff" class="dim mono" text-anchor="middle">image_embeds</text><text x="619" y="54" fill="#f0f6ff" class="mono" font-size="13" text-anchor="middle">768-D</text><path stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)" d="M686 39H718"/><g transform="translate(728 12)"><rect width="408" height="54" fill="#edf3ff" stroke="#345b91" rx="12"/><text x="12" y="23" fill="#bcd7f7" class="mono" font-size="12">Linear</text><text x="12" y="43" fill="#e9f2fd" class="mono" font-size="12">768→256</text><text x="94" y="34" class="node">→ ReLU →</text><text x="174" y="23" fill="#bcd7f7" class="mono" font-size="12">Dropout</text><text x="174" y="43" fill="#e9f2fd" class="mono" font-size="12">p = 0.3</text><text x="250" y="34" class="node">→</text><text x="278" y="23" fill="#bcd7f7" class="mono" font-size="12">Linear</text><text x="278" y="43" fill="#e9f2fd" class="mono" font-size="12">256→2</text></g><path stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)" d="M1136 39H1166"/><rect width="78" height="54" x="1176" y="12" fill="#edf3ff" stroke="#60a5fa" rx="12"/><text x="1215" y="34" fill="#d7e9ff" class="dim mono" text-anchor="middle">2 logits</text><text x="1215" y="53" class="small" text-anchor="middle">real / fake</text></g><g transform="translate(20 160)"><rect width="1272" height="78" fill="#f4f8ff" stroke="#27466f" rx="16"/><rect width="116" height="44" x="16" y="17" fill="#edf3ff" rx="12"/><text x="74" y="45" class="expert" text-anchor="middle">EXPERT 2</text><path stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)" d="M132 39H164"/><rect width="334" height="54" x="174" y="12" fill="#edf3ff" stroke="#3b82f6" rx="12"/><text x="190" y="34" class="expert">CLIP ViT-L/14</tex