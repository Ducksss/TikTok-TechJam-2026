<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">SynthFlag four-expert model architecture</title>
  <desc id="desc">Two CLIP ViT-L/14 experts take 224 pixel inputs and use 768-dimensional image embeddings. Two SigLIP So400M Patch14-384 experts take 384 pixel inputs and use 1152-dimensional pooled features. Each expert has a linear, ReLU, dropout 0.3, linear classifier head that outputs two logits.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#7a92ad" stroke-opacity="0.07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f4f8ff" flood-opacity="0.45"/>
    </filter>
    <marker id="blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#60a5fa"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#fbbf24"/></marker>
    <marker id="lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a3e635"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#65e6d2}
      .headline{font-size:46px;font-weight:740;letter-spacing:-1.3px;fill:#f5f9ff}
      .subtitle{font-size:19px;fill:#aabbd0}
      .group{font-size:13px;font-weight:800;letter-spacing:2px}
      .expert{font-size:18px;font-weight:750;fill:#f3f8fd}
      .body{font-size:14px;fill:#b7c7d9}
      .small{font-size:12px;fill:#8da4be}
      .node{font-size:13px;font-weight:700;fill:#dbe7f3}
      .dim{font-size:13px;font-weight:700}
    </style>
      <style>
      text,tspan{fill:#111827}
      .eyebrow,.kicker,.stage,.role,.step,.label,.section{fill:#2448c2}
      .subtitle,.body,.small,.mini,.note,.sub,.tiny{fill:#52627a}
      .headline,.title,.laneTitle,.lane-title,.card-title,.cardTitle,.boxTitle,.actor,.head,.strong,.stat,.value,.formula,.eq,.prob,.state{fill:#111827}
      .mono,.monoText,.chip,.number,.num,.code,.dim{fill:#253651}
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>
  <g class="sans">
    <text x="80" y="74" class="eyebrow">MODEL ARCHITECTURE · RELEASED FOUR-EXPERT ENSEMBLE</text>
    <text x="80" y="130" class="headline">Diverse vision encoders, matching binary heads</text>
    <text x="80" y="168" class="subtitle">Every checkpoint restores a complete encoder and classifier; no separate base-model weights are required.</text>

    <!-- Labels -->
    <g transform="translate(80 214)">
      <text x="0" y="0" class="small">MODEL VIEW</text>
      <text x="166" y="0" class="small">VISION ENCODER</text>
      <text x="542" y="0" class="small">FEATURE</text>
      <text x="708" y="0" class="small">CLASSIFIER HEAD</text>
      <text x="1162" y="0" class="small">OUTPUT</text>
    </g>

    <!-- CLIP group -->
    <g transform="translate(64 240)" filter="url(#shadow)">
      <rect width="1312" height="266" rx="28" fill="#edf3ff" stroke="#2563eb" stroke-width="2"/>
      <rect x="20" y="20" width="98" height="30" rx="15" fill="#174078"/>
      <circle cx="40" cy="35" r="6" fill="#60a5fa"/>
      <text x="56" y="40" class="group" fill="#cde3ff">CLIP ×2</text>
      <text x="136" y="40" class="small">Experts 1 and 2 · independent released checkpoints</text>

      <g transform="translate(20 70)">
        <rect width="1272" height="78" rx="16" fill="#f4f8ff" stroke="#27466f"/>
        <rect x="16" y="17" width="116" height="44" rx="12" fill="#edf3ff"/>
        <text x="74" y="45" class="expert" text-anchor="middle">EXPERT 1</text>
        <path d="M132 39H164" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/>
        <rect x="174" y="12" width="334" height="54" rx="12" fill="#edf3ff" stroke="#3b82f6"/>
        <text x="190" y="34" class="expert">CLIP ViT-L/14</text>
        <text x="190" y="54" class="small">224 px · 24 layers · hidden 1024 · patch 14</text>
        <path d="M508 39H542" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/>
        <rect x="552" y="12" width="134" height="54" rx="12" fill="#edf3ff" stroke="#3b82f6"/>
        <text x="619" y="34" class="dim mono" text-anchor="middle" fill="#b9d8ff">image_embeds</text>
        <text x="619" y="54" class="mono" font-size="13" text-anchor="middle" fill="#f0f6ff">768-D</text>
        <path d="M686 39H718" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/>
        <g transform="translate(728 12)">
          <rect width="408" height="54" rx="12" fill="#edf3ff" stroke="#345b91"/>
          <text x="12" y="23" class="mono" font-size="12" fill="#bcd7f7">Linear</text>
          <text x="12" y="43" class="mono" font-size="12" fill="#e9f2fd">768→256</text>
          <text x="94" y="34" class="node">→ ReLU →</text>
          <text x="174" y="23" class="mono" font-size="12" fill="#bcd7f7">Dropout</text>
          <text x="174" y="43" class="mono" font-size="12" fill="#e9f2fd">p = 0.3</text>
          <text x="250" y="34" class="node">→</text>
          <text x="278" y="23" class="mono" font-size="12" fill="#bcd7f7">Linear</text>
          <text x="278" y="43" class="mono" font-size="12" fill="#e9f2fd">256→2</text>
        </g>
        <path d="M1136 39H1166" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/>
        <rect x="1176" y="12" width="78" height="54" rx="12" fill="#edf3ff" stroke="#60a5fa"/>
        <text x="1215" y="34" class="dim mono" text-anchor="middle" fill="#d7e9ff">2 logits</text>
        <text x="1215" y="53" class="small" text-anchor="middle">real / fake</text>
      </g>

      <g transform="translate(20 160)">
        <rect width="1272" height="78" rx="16" fill="#f4f8ff" stroke="#27466f"/>
        <rect x="16" y="17" width="116" height="44" rx="12" fill="#edf3ff"/>
        <text x="74" y="45" class="expert" text-anchor="middle">EXPERT 2</text>
        <path d="M132 39H164" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/>
        <rect x="174" y="12" width="334" height="54" rx="12" fill="#edf3ff" stroke="#3b82f6"/>
        <text x="190" y="34" class="expert">CLIP ViT-L/14</text>
        <text x="190" y="54" class="small">224 px · 24 layers · hidden 1024 · patch 14</text>
        <path d="M508 39H542" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/>
        <rect x="552" y="12" width="134" height="54" rx="12" fill="#edf3ff" stroke="#3b82f6"/>
        <text x="619" y="34" class="dim mono" text-anchor="middle" fill="#b9d8ff">image_embeds</text>
        <text x="619" y="54" class="mono" font-size="13" text-anchor="middle" fill="#f0f6ff">768-D</text>
        <path d="M686 39H718" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/>
        <g transform="translate(728 12)">
          <rect width="408" height="54" rx="12" fill="#edf3ff" stroke="#345b91"/>
          <text x="12" y="23" class="mono" font-size="12" fill="#bcd7f7">Linear</text>
          <text x="12" y="43" class="mono" font-size="12" fill="#e9f2fd">768→256</text>
          <text x="94" y="34" class="node">→ ReLU →</text>
          <text x="174" y="23" class="mono" font-size="12" fill="#bcd7f7">Dropout</text>
          <text x="174" y="43" class="mono" font-size="12" fill="#e9f2fd">p = 0.3</text>
          <text x="250" y="34" class="node">→</text>
          <text x="278" y="23" class="mono" font-size="12" fill="#bcd7f7">Linear</text>
          <text x="278" y="43" class="mono" font-size="12" fill="#e9f2fd">256→2</text>
        </g>
        <path d="M1136 39H1166" stroke="#60a5fa" stroke-width="2.5" marker-end="url(#blue)"/>
        <rect x="1176" y="12" width="78" height="54" rx="12" fill="#edf3ff" stroke="#60a5fa"/>
        <text x="1215" y="34" class="dim mono" text-anchor="middle" fill="#d7e9ff">2 logits</text>
        <text x="1215" y="53" class="small" text-anchor="middle">real / fake</text>
      </g>
    </g>

    <!-- SigLIP group -->
    <g transform="translate(64 536)" filter="url(#shadow)">
      <rect width="1312" height="266" rx="28" fill="#fff7e8" stroke="#d97706" stroke-width="2"/>
      <rect x="20" y="20" width="120" height="30" rx="15" fill="#fff7e8"/>
      <circle cx="40" cy="35" r="6" fill="#fbbf24"/>
      <text x="56" y="40" class="group" fill="#ffe2a5">SIGLIP ×2</text>
      <text x="158" y="40" class="small">Experts 3 and 4 · independent released checkpoints</text>

      <g transform="translate(20 70)">
        <rect width="1272" height="78" rx="16" fill="#fff7e8" stroke="#614a23"/>
        <rect x="16" y="17" width="116" height="44" rx="12" fill="#fff7e8"/>
        <text x="74" y="45" class="expert" text-anchor="middle">EXPERT 3</text>
        <path d="M132 39H164" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/>
        <rect x="174" y="12" width="334" height="54" rx="12" fill="#fff7e8" stroke="#d97706"/>
        <text x="190" y="34" class="expert">SigLIP So400M Patch14-384</text>
        <text x="190" y="54" class="small">384 px · 27 layers · hidden 1152 · patch 14</text>
        <path d="M508 39H542" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/>
        <rect x="552" y="12" width="134" height="54" rx="12" fill="#fff7e8" stroke="#d97706"/>
        <text x="619" y="34" class="dim mono" text-anchor="middle" fill="#ffe0a3">pooler_output</text>
        <text x="619" y="54" class="mono" font-size="13" text-anchor="middle" fill="#fff4da">1152-D</text>
        <path d="M686 39H718" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/>
        <g transform="translate(728 12)">
          <rect width="408" height="54" rx="12" fill="#fff7e8" stroke="#795722"/>
          <text x="12" y="23" class="mono" font-size="12" fill="#f6d99e">Linear</text>
          <text x="12" y="43" class="mono" font-size="12" fill="#fff0cf">1152→256</text>
          <text x="94" y="34" class="node">→ ReLU →</text>
          <text x="174" y="23" class="mono" font-size="12" fill="#f6d99e">Dropout</text>
          <text x="174" y="43" class="mono" font-size="12" fill="#fff0cf">p = 0.3</text>
          <text x="250" y="34" class="node">→</text>
          <text x="278" y="23" class="mono" font-size="12" fill="#f6d99e">Linear</text>
          <text x="278" y="43" class="mono" font-size="12" fill="#fff0cf">256→2</text>
        </g>
        <path d="M1136 39H1166" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/>
        <rect x="1176" y="12" width="78" height="54" rx="12" fill="#fff7e8" stroke="#fbbf24"/>
        <text x="1215" y="34" class="dim mono" text-anchor="middle" fill="#ffedc6">2 logits</text>
        <text x="1215" y="53" class="small" text-anchor="middle">real / fake</text>
      </g>

      <g transform="translate(20 160)">
        <rect width="1272" height="78" rx="16" fill="#fff7e8" stroke="#614a23"/>
        <rect x="16" y="17" width="116" height="44" rx="12" fill="#fff7e8"/>
        <text x="74" y="45" class="expert" text-anchor="middle">EXPERT 4</text>
        <path d="M132 39H164" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/>
        <rect x="174" y="12" width="334" height="54" rx="12" fill="#fff7e8" stroke="#d97706"/>
        <text x="190" y="34" class="expert">SigLIP So400M Patch14-384</text>
        <text x="190" y="54" class="small">384 px · 27 layers · hidden 1152 · patch 14</text>
        <path d="M508 39H542" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/>
        <rect x="552" y="12" width="134" height="54" rx="12" fill="#fff7e8" stroke="#d97706"/>
        <text x="619" y="34" class="dim mono" text-anchor="middle" fill="#ffe0a3">pooler_output</text>
        <text x="619" y="54" class="mono" font-size="13" text-anchor="middle" fill="#fff4da">1152-D</text>
        <path d="M686 39H718" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/>
        <g transform="translate(728 12)">
          <rect width="408" height="54" rx="12" fill="#fff7e8" stroke="#795722"/>
          <text x="12" y="23" class="mono" font-size="12" fill="#f6d99e">Linear</text>
          <text x="12" y="43" class="mono" font-size="12" fill="#fff0cf">1152→256</text>
          <text x="94" y="34" class="node">→ ReLU →</text>
          <text x="174" y="23" class="mono" font-size="12" fill="#f6d99e">Dropout</text>
          <text x="174" y="43" class="mono" font-size="12" fill="#fff0cf">p = 0.3</text>
          <text x="250" y="34" class="node">→</text>
          <text x="278" y="23" class="mono" font-size="12" fill="#f6d99e">Linear</text>
          <text x="278" y="43" class="mono" font-size="12" fill="#fff0cf">256→2</text>
        </g>
        <path d="M1136 39H1166" stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)"/>
        <rect x="1176" y="12" width="78" height="54" rx="12" fill="#fff7e8" stroke="#fbbf24"/>
        <text x="1215" y="34" class="dim mono" text-anchor="middle" fill="#ffedc6">2 logits</text>
        <text x="1215" y="53" class="small" text-anchor="middle">real / fake</text>
      </g>
    </g>

    <g transform="translate(80 842)">
      <line x1="0" y1="0" x2="1276" y2="0" stroke="#28415b"/>
      <text x="0" y="35" class="small">NEXT</text>
      <text x="52" y="35" class="body">Softmax converts each expert’s two logits to P(fake); the ensemble averages the four probabilities.</text>
      <text x="1276" y="35" class="small" text-anchor="end">Source: released infer/model.py</text>
    </g>
  </g>
  <g aria-label="Historical baseline notice" pointer-events="none">
    <rect x="67%" y="16" width="30%" height="36" rx="8" fill="#8b1d2c" opacity="0.96"/>
    <text x="82%" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text>
  </g>
</svg>
