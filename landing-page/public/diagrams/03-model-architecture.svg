height="78" fill="#fff7e8" stroke="#614a23" rx="16"/><rect width="116" height="44" x="16" y="17" fill="#fff7e8" rx="12"/><text x="74" y="45" class="expert" text-anchor="middle">EXPERT 3</text><path stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)" d="M132 39H164"/><rect width="334" height="54" x="174" y="12" fill="#fff7e8" stroke="#d97706" rx="12"/><text x="190" y="34" class="expert">SigLIP So400M Patch14-384</text><text x="190" y="54" class="small">384 px · 27 layers · hidden 1152 · patch 14</text><path stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)" d="M508 39H542"/><rect width="134" height="54" x="552" y="12" fill="#fff7e8" stroke="#d97706" rx="12"/><text x="619" y="34" fill="#ffe0a3" class="dim mono" text-anchor="middle">pooler_output</text><text x="619" y="54" fill="#fff4da" class="mono" font-size="13" text-anchor="middle">1152-D</text><path stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)" d="M686 39H718"/><g transform="translate(728 12)"><rect width="408" height="54" fill="#fff7e8" stroke="#795722" rx="12"/><text x="12" y="23" fill="#f6d99e" class="mono" font-size="12">Linear</text><text x="12" y="43" fill="#fff0cf" class="mono" font-size="12">1152→256</text><text x="94" y="34" class="node">→ ReLU →</text><text x="174" y="23" fill="#f6d99e" class="mono" font-size="12">Dropout</text><text x="174" y="43" fill="#fff0cf" class="mono" font-size="12">p = 0.3</text><text x="250" y="34" class="node">→</text><text x="278" y="23" fill="#f6d99e" class="mono" font-size="12">Linear</text><text x="278" y="43" fill="#fff0cf" class="mono" font-size="12">256→2</text></g><path stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)" d="M1136 39H1166"/><rect width="78" height="54" x="1176" y="12" fill="#fff7e8" stroke="#fbbf24" rx="12"/><text x="1215" y="34" fill="#ffedc6" class="dim mono" text-anchor="middle">2 logits</text><text x="1215" y="53" class="small" text-anchor="middle">real / fake</text></g><g transform="translate(20 160)"><rec