<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">SynthFlag supported web system configuration</title>
  <desc id="desc">The SynthFlag try page validates an image or short video in the browser. Videos remain local while eight derived frames are sampled. The browser then calls the FastAPI inference service directly or through the optional edge proxy. The service validates and decodes image or frame bytes in memory, uses a checkpoint-backed resident four-expert model, and returns an image score or ordered frame report.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient>
    <linearGradient id="service" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#edf3ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7991aa" stroke-opacity=".07"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#f4f8ff" flood-opacity=".44"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#91a9c4"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#2dd4bf"/></marker>
    <marker id="lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a3e635"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:15px;font-weight:750;letter-spacing:3px;fill:#65e6d2}.headline{font-size:46px;font-weight:740;letter-spacing:-1.3px;fill:#f5f9ff}.subtitle{font-size:19px;fill:#aabbd0}
      .kicker{font-size:12px;font-weight:800;letter-spacing:1.7px;fill:#8da5bf}.title{font-size:23px;font-weight:740;fill:#f4f8fd}.body{font-size:15px;fill:#b8c8da}.small{font-size:12px;fill:#91a6bd}.monoText{font-size:12px;fill:#d9e7f5}.chip{font-size:11px;font-weight:780;letter-spacing:.8px}
    </style>
      <style>
      text,tspan{fill:#111827}
      .eyebrow,.kicker,.stage,.role,.step,.label,.section{fill:#2448c2}
      .subtitle,.body,.small,.mini,.note,.sub,.tiny{fill:#52627a}
      .headline,.title,.laneTitle,.lane-title,.card-title,.cardTitle,.boxTitle,.actor,.head,.strong,.stat,.value,.formula,.eq,.prob,.state{fill:#111827}
      .mono,.monoText,.chip,.number,.num,.code,.dim{fill:#253651}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/>
  <g class="sans">
    <text x="64" y="72" class="eyebrow">SYSTEM ATLAS · SUPPORTED WEB CONFIGURATION</text>
    <text x="64" y="128" class="headline">The interface and the model are separate systems.</text>
    <text x="64" y="166" class="subtitle">The browser can reach the same checkpoint-backed service directly or through the site’s edge proxy.</text>
    <g transform="translate(1152 66)"><rect width="224" height="62" rx="16" fill="#edf3ff" stroke="#2a415b"/><circle cx="24" cy="31" r="6" fill="#a3e635"/><text x="40" y="28" class="small">RECOMMENDED PUBLIC DEMO</text><text x="40" y="47" class="mono monoText">HTTPS + warm worker</text></g>

    <!-- browser -->
    <g transform="translate(64 224)" filter="url(#shadow)">
      <rect width="306" height="526" rx="28" fill="#edf9f7" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="22" y="22" width="112" height="31" rx="15" fill="#edf9f7"/><circle cx="41" cy="37" r="6" fill="#2dd4bf"/><text x="57" y="42" class="kicker" fill="#bdf8ee">BROWSER</text>
      <text x="22" y="91" class="title">Public <tspan class="mono">/try</tspan> page</text>
      <text x="22" y="118" class="body">One image or short video · local interaction</text>
      <g transform="translate(22 148)">
        <rect width="262" height="88" rx="16" fill="#f4f8ff" stroke="#2b5660"/>
        <text x="16" y="25" class="kicker">01 · SELECT + PREVIEW</text>
        <text x="16" y="53" class="body">Image or MP4/WebM video</text>
        <text x="16" y="75" class="small">video stays local · eight PNG samples</text>
        <path d="M131 88V108" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#teal)"/>
        <rect y="116" width="262" height="88" rx="16" fill="#f4f8ff" stroke="#2b5660"/>
        <text x="16" y="141" class="kicker">02 · ROUTE REQUEST</text>
        <text x="16" y="169" class="body">multipart image or sampled frames</text>
        <text x="16" y="191" class="small">direct endpoint if configured</text>
        <path d="M131 204V224" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#teal)"/>
        <rect y="232" width="262" height="104" rx="16" fill="#ffffff" stroke="#84cc16"/>
        <text x="16" y="257" class="kicker" fill="#badd80">05 · RESULT CARD</text>
        <text x="16" y="288" class="title" fill="#dcf7a1">score or frame timeline</text>
        <text x="16" y="315" class="small">descriptive signal, not provenance proof</text>
      </g>
      <g transform="translate(22 486)"><rect width="262" height="38" rx="12" fill="#edf9f7"/><text x="131" y="24" class="small" text-anchor="middle" fill="#bdf8ee">media + frame URLs revoked after use</text></g>
    </g>

    <!-- route choices -->
    <g transform="translate(416 224)">
      <text x="0" y="18" class="kicker">REQUEST ROUTING · TWO SUPPORTED PATHS</text>
      <g transform="translate(0 46)" filter="url(#shadow)">
        <rect width="360" height="140" rx="22" fill="#edf3ff" stroke="#3b82f6" stroke-width="2"/>
        <rect x="18" y="18" width="78" height="28" rx="14" fill="#153f78"/><text x="57" y="37" class="chip" text-anchor="middle" fill="#d4e7ff">DIRECT</text>
        <text x="18" y="75" class="title">Browser → service</text>
        <text x="18" y="102" class="mono monoText">NEXT_PUBLIC_SYNTHFLAG_INFERENCE_URL</text>
        <text x="18" y="125" class="small">POST /v1/analyze[-frames] · GET /health</text>
      </g>
      <g transform="translate(0 212)" filter="url(#shadow)">
        <rect width="360" height="182" rx="22" fill="#edf3ff" stroke="#647b95" stroke-width="2"/>
        <rect x="18" y="18" width="78" height="28" rx="14" fill="#293e57"/><text x="57" y="37" class="chip" text-anchor="middle" fill="#dce8f5">PROXY</text>
        <text x="18" y="74" class="title">Next.js edge route</text>
        <text x="18" y="100" class="mono monoText">POST /api/analyze[-video]</text>
        <line x1="18" y1="116" x2="342" y2="116" stroke="#2c435e"/>
        <text x="18" y="140" class="small">revalidates image or bounded frame batch</text>
        <text x="18" y="162" class="mono monoText">SYNTHFLAG_INFERENCE_URL → analysis endpoint</text>
      </g>
      <g transform="translate(0 422)" filter="url(#shadow)">
        <rect width="360" height="104" rx="20" fill="#fff7e8" stroke="#b58a28"/>
        <text x="18" y="29" class="kicker" fill="#f0c968">MODEL ASSETS</text>
        <text x="18" y="57" class="body">manifest.json + four checkpoints</text>
        <text x="18" y="81" class="small">mounted at the service; not bundled in the site</text>
      </g>
    </g>

    <!-- client route arrows -->
    <path d="M370 430H394V340H416" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M394 430V527H416" fill="none" stroke="#91a9c4" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- service -->
    <g transform="translate(824 224)" filter="url(#shadow)">
      <rect width="552" height="526" rx="28" fill="url(#service)" stroke="#3b536d" stroke-width="2"/>
      <rect x="22" y="22" width="150" height="31" rx="15" fill="#edf3ff"/><circle cx="42" cy="37" r="6" fill="#91a9c4"/><text x="58" y="42" class="kicker" fill="#dae7f4">MODEL SERVICE</text>
      <text x="22" y="90" class="title">FastAPI analysis endpoints</text>
      <text x="22" y="117" class="body">Checkpoint-backed HTTP wrapper · no upload/result store</text>
      <g transform="translate(22 146)">
        <rect width="238" height="98" rx="16" fill="#f4f8ff" stroke="#344b65"/>
        <text x="16" y="26" class="kicker">03 · REQUEST GUARDS</text>
        <text x="16" y="54" class="body">type · bytes · dimensions · timestamps</text>
        <text x="16" y="78" class="small">verify decodable → convert RGB in memory</text>
        <path d="M238 49H270" stroke="#91a9c4" stroke-width="3" marker-end="url(#arrow)"/>
        <rect x="280" width="226" height="98" rx="16" fill="#f4f8ff" stroke="#344b65"/>
        <text x="296" y="26" class="kicker">MODEL ACCESS</text>
        <text x="296" y="54" class="body">lazy or eager resident model</text>
        <text x="296" y="78" class="small">one initialized model per worker process</text>
      </g>
      <g transform="translate(22 272)">
        <rect width="506" height="148" rx="20" fill="#edf3ff" stroke="#3b82f6"/>
        <text x="18" y="29" class="kicker" fill="#aacfff">04 · FEATDISTILL ENSEMBLE</text>
        <g transform="translate(18 48)">
          <rect width="108" height="52" rx="12" fill="#113b76"/><text x="54" y="23" class="chip" text-anchor="middle" fill="#dcecff">CLIP 1</text><text x="54" y="41" class="small" text-anchor="middle">224 px</text>
          <rect x="120" width="108" height="52" rx="12" fill="#113b76"/><text x="174" y="23" class="chip" text-anchor="middle" fill="#dcecff">CLIP 2</text><text x="174" y="41" class="small" text-anchor="middle">224 px</text>
          <rect x="240" width="108" height="52" rx="12" fill="#fff7e8"/><text x="294" y="23" class="chip" text-anchor="middle" fill="#ffe2a4">SIGLIP 3</text><text x="294" y="41" class="small" text-anchor="middle">384 px</text>
          <rect x="360" width="108" height="52" rx="12" fill="#fff7e8"/><text x="414" y="23" class="chip" text-anchor="middle" fill="#ffe2a4">SIGLIP 4</text><text x="414" y="41" class="small" text-anchor="middle">384 px</text>
        </g>
        <text x="18" y="127" class="body">four P(fake) values → unweighted arithmetic mean</text>
      </g>
      <g transform="translate(22 446)">
        <rect width="506" height="56" rx="16" fill="#ffffff" stroke="#84cc16"/>
        <text x="16" y="23" class="kicker" fill="#c8ec89">JSON RESPONSE</text>
        <text x="16" y="43" class="mono monoText" fill="#e4f8b9">score or frame_scores + summary · timing · model identity</text>
      </g>
    </g>

    <!-- routing into service -->
    <path d="M776 340H800V335H824" fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M776 527H800V397H824" fill="none" stroke="#91a9c4" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M776 698H804V450H1108V496" fill="none" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="7 7" marker-end="url(#arrow)"/>
    <!-- response loop -->
    <path d="M824 722H806V796H218V750" fill="none" stroke="#a3e635" stroke-width="3" marker-end="url(#lime)"/>
    <text x="510" y="820" class="small" text-anchor="middle" fill="#cfea91">same JSON payload returns directly or through the proxy</text>

    <g transform="translate(824 790)"><circle cx="6" cy="8" r="6" fill="#2dd4bf"/><text x="20" y="11" class="small">Image or derived-frame bytes are decoded in memory, scored, and discarded.</text><text x="20" y="30" class="small">Raw video is not submitted; the service writes no upload or result files.</text></g>
    <text x="1376" y="866" class="small" text-anchor="end">Source: current /try, edge route, FastAPI service, and inference model</text>
  </g>
</svg>
