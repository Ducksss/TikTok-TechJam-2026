<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag supported web system configuration</title><desc id="desc">The SynthFlag try page validates an image or short video in the browser. Videos remain local while eight derived frames are sampled. The browser then calls the FastAPI inference service directly or through the optional edge proxy. The service validates and decodes image or frame bytes in memory, uses a checkpoint-backed resident four-expert model, and returns an image score or ordered frame report.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><linearGradient id="service" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#edf3ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#7991aa" stroke-opacity=".07" d="M40 0H0V40"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#f4f8ff" flood-opacity=".44" stdDeviation="16"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#91a9c4" d="M0 0L10 5L0 10Z"/></marker><marker id="teal" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2dd4bf" d="M0 0L10 5L0 10Z"/></marker><marker id="lime" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a3e635" d="M0 0L10 5L0 10Z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:15px;font-weight:750;letter-spacing:3px;fill:#65e6d2}.headline{font-size:46px;font-weight:740;letter-spacing:-1.3px;fill:#f5f9ff}.subtitle{font-size:19px;fill:#aabbd0}.kicker{font-size:12px;font-weight:800;letter-spacing:1.7px;fill:#8da5bf}.title{font-size:23px;font-weight:740;fill:#f4f8fd}.body{font-size:15px;fill:#b8c8da}.monoText,.small{font-size:12px}.small{fill:#91a6bd}.monoText{fill:#d9e7f5}.chip{font-size:11px;font-weight:780;letter-spacing:.8px}</style><style>text,tspan{fill:#111827}.eyebrow,.kicker{fill:#2448c2}.body,.small,.subtitle{fill:#52627a}.headline,.title{fill:#111827}.chip,.mono,.monoText{fill:#253651}</style></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><g class="sans"><text x="64" y="72" class="eyebrow">SYSTEM ATLAS · SUPPORTED WEB CONFIGURATION</text><text x="64" y="128" class="headline">The interface and the model are separate systems.</text><text x="64" y="166" class="subtitle">The browser can reach the same checkpoint-backed service directly or through the site’s edge proxy.</text><g transform="translate(1152 66)"><rect width="224" height="62" fill="#edf3ff" stroke="#2a415b" rx="16"/><circle cx="24" cy="31" r="6" fill="#a3e635"/><text x="40" y="28" class="small">RECOMMENDED PUBLIC DEMO</text><text x="40" y="47" class="mono monoText">HTTPS + warm worker</text></g><g filter="url(#shadow)" transform="translate(64 224)"><rect width="306" height="526" fill="#edf9f7" stroke="#2dd4bf" stroke-width="2" rx="28"/><rect width="112" height="31" x="22" y="22" fill="#edf9f7" rx="15"/><circle cx="41" cy="37" r="6" fill="#2dd4bf"/><text x="57" y="42" fill="#bdf8ee" class="kicker">BROWSER</text><text x="22" y="91" class="title">Public <tspan class="mono">/try</tspan> page</text><text x="22" y="118" class="body">One image or short video · local interaction</text><g transform="translate(22 148)"><rect width="262" height="88" fill="#f4f8ff" stroke="#2b5660" rx="16"/><text x="16" y="25" class="kicker">01 · SELECT + PREVIEW</text><text x="16" y="53" class="body">Image or MP4/WebM video</text><text x="16" y="75" class="small">video stays local · eight PNG samples</text><path stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#teal)" d="M131 88V108"/><rect width="262" height="88" y="116" fill="#f4f8ff" stroke="#2b5660" rx="16"/><text x="16" y="141" class="kicker">02 · ROUTE REQUEST</text><text x="16" y="169" class="body">multipart image or sampled frames</text><text x="16" y="191" class="small">direct endpoint if configured</text><path stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#teal)" d="M131 204V224"/><rect width="262" height="104" y="232" fill="#fff" stroke="#84cc16" rx="16"/><text x="16" y="257" fill="#badd80" class="kicker">05 · RESULT CARD</text><text x="16" y="288" fill="#dcf7a1" class="title">score or frame timeline</text><text x="16" y="315" class="small">descriptive signal, not provenance proof</text></g><g transform="translate(22 486)"><rect width="262" height="38" fill="#edf9f7" rx="12"/><text x="131" y="24" fill="#bdf8ee" class="small" text-anchor="middle">media + frame URLs revoked after use</text></g></g><g><text x="0" y="18" class="kicker" transform="translate(416 224)">REQUEST ROUTING · TWO SUPPORTED PATHS</text><g filter="url(#shadow)" transform="translate(416 224) translate(0 46)"><rect width="360" height="140" fill="#edf3ff" stroke="#3b82f6" stroke-width="2" rx="22"/><rect width="78" height="28" x="18" y="18" fill="#153f78" rx="14"/><text x="57" y="37" fill="#d4e7ff" class="chip" text-anchor="middle">DIRECT</text><text x="18" y="75" class="title">Browser → service</text><text x="18" y="102" class="mono monoText">NEXT_PUBLIC_SYNTHFLAG_INFERENCE_URL</text><text x="18" y="125" class="small">POST /v1/analyze[-frames] · GET /health</text></g><g filter="url(#shadow)" transform="translate(416 224) translate(0 212)"><rect width="360" height="182" fill="#edf3ff" stroke="#647b95" stroke-width="2" rx="22"/><rect width="78" height="28" x="18" y="18" fill="#293e57" rx="14"/><text x="57" y="37" fill="#dce8f5" class="chip" text-anchor="middle">PROXY</text><text x="18" y="74" class="title">Next.js edge route</text><text x="18" y="100" class="mono monoText">POST /api/analyze[-video]</text><line x1="18" x2="342" y1="116" y2="116" stroke="#2c435e"/><text x="18" y="140" class="small">revalidates image or bounded frame batch</text><text x="18" y="162" class="mono monoText">SYNTHFLAG_INFERENCE_URL → analysis endpoint</text></g><g filter="url(#shadow)" transform="translate(416 224) translate(0 422)"><rect width="360" height="104" fill="#fff7e8" stroke="#b58a28" rx="20"/><text x="18" y="29" fill="#f0c968" class="kicker">MODEL ASSETS</text><text x="18" y="57" class="body">manifest.json + four checkpoints</text><text x="18" y="81" class="small">mounted at the service; not bundled in the site</text></g></g><path fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)" d="M370 430H394V340H416"/><path fill="none" stroke="#91a9c4" stroke-width="3" marker-end="url(#arrow)" d="M394 430V527H416"/><g filter="url(#shadow)" transform="translate(824 224)"><rect width="552" height="526" fill="url(#service)" stroke="#3b536d" stroke-width="2" rx="28"/><rect width="150" height="31" x="22" y="22" fill="#edf3ff" rx="15"/><circle cx="42" cy="37" r="6" fill="#91a9c4"/><text x="58" y="42" fill="#dae7f4" class="kicker">MODEL SERVICE</text><text x="22" y="90" class="title">FastAPI analysis endpoints</text><text x="22" y="117" class="body">Checkpoint-backed HTTP wrapper · no upload/result store</text><g transform="translate(22 146)"><rect width="238" height="98" fill="#f4f8ff" stroke="#344b65" rx="16"/><text x="16" y="26" class="kicker">03 · REQUEST GUARDS</text><text x="16" y="54" class="body">type · bytes · dimensions · timestamps</text><text x="16" y="78" class="small">verify decodable → convert RGB in memory</text><path stroke="#91a9c4" stroke-width="3" marker-end="url(#arrow)" d="M238 49H270"/><rect width="226" height="98" x="280" fill="#f4f8ff" stroke="#344b65" rx="16"/><text x="296" y="26" class="kicker">MODEL ACCESS</text><text x="296" y="54" class="body">lazy or eager resident model</text><text x="296" y="78" class="small">one initialized model per worker process</text></g><g transform="translate(22 272)"><rect width="506" height="148" fill="#edf3ff" stroke="#3b82f6" rx="20"/><text x="18" y="29" fill="#aacfff" class="kicker">04 · SYNTHFLAG ENSEMBLE</text><g transform="translate(18 48)"><rect width="108" height="52" fill="#113b76" rx="12"/><text x="54" y="23" fill="#dcecff" class="chip" text-anchor="middle">CLIP 1</text><text x="54" y="41" class="small" text-anchor="middle">224 px</text><rect width="108" height="52" x="120" fill="#113b76" rx="12"/><text x="174" y="23" fill="#dcecff" class="chip" text-anchor="middle">CLIP 2</text><text x="174" y="41" class="small" text-anchor="middle">224 px</text><rect width="108" height="52" x="240" fill="#fff7e8" rx="12"/><text x="294" y="23" fill="#ffe2a4" class="chip" text-anchor="middle">SIGLIP 3</text><text x="294" y="41" class="small" text-anchor="middle">384 px</text><rect width="108" height="52" x="360" fill="#fff7e8" rx="12"/><text x="414" y="23" fill="#ffe2a4" class="chip" text-anchor="middle">SIGLIP 4</text><text x="414" y="41" class="small" text-anchor="middle">384 px</text></g><text x="18" y="127" class="body">four P(fake) values → unweighted arithmetic mean</text></g><g transform="translate(22 446)"><rect width="506" height="56" fill="#fff" stroke="#84cc16" rx="16"/><text x="16" y="23" fill="#c8ec89" class="kicker">JSON RESPONSE</text><text x="16" y="43" fill="#e4f8b9" class="mono monoText">score or frame_scores + summary · timing · model identity</text></g></g><path fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arrow)" d="M776 340H800V335H824"/><path fill="none" stroke="#91a9c4" stroke-width="3" marker-end="url(#arrow)" d="M776 527H800V397H824"/><path fill="none" stroke="#fbbf24" stroke-dasharray="7 7" stroke-width="2.5" marker-end="url(#arrow)" d="M776 698H804V450H1108V496"/><path fill="none" stroke="#a3e635" stroke-width="3" marker-end="url(#lime)" d="M824 722H806V796H218V750"/><text x="510" y="820" fill="#cfea91" class="small" text-anchor="middle">same JSON payload returns directly or through the proxy</text><g transform="translate(824 790)"><circle cx="6" cy="8" r="6" fill="#2dd4bf"/><text x="20" y="11" class="small">Image or derived-frame bytes are decoded in memory, scored, and discarded.</text><text x="20" y="30" class="small">Raw video is not submitted; the service writes no upload or result files.</text></g><text x="1376" y="866" class="small" text-anchor="end">Source: current /try, edge route, FastAPI service, and inference model</text></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>