<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1400" viewBox="0 0 1920 1400" role="img" aria-labelledby="title desc">
  <title id="title">DINOv3 architectures described for external NTIRE challenge teams</title>
  <desc id="desc">A source-bounded comparison of two external DINOv3 challenge methods. MICV uses a four-backbone committee and a two-backbone committee with projection and MLP heads, then averages stream probabilities; its DINOv3 variants are not reported. Ant International uses two independently fine-tuned DINOv3-7B experts at 512 and 288 pixels with attention and first-token pooling, test-time augmentation, and weighted fusion. The official DINOv3-7B backbone anatomy contextualizes Ant's named model only, while undisclosed detector details and the separation from SynthFlag are explicit.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#edf3ff"/></pattern>
    <linearGradient id="dino" x1="0" x2="1"><stop stop-color="#edf3ff"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
    <linearGradient id="micv" x1="0" x2="1"><stop stop-color="#edf9f7"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient>
    <linearGradient id="ant" x1="0" x2="1"><stop stop-color="#fff7e8"/><stop offset="1" stop-color="#edf3ff"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8597b4"/></marker>
    <marker id="teal" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#42d5c5"/></marker>
    <marker id="amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f4bb4f"/></marker>
    <style>
      .title{font:700 40px ui-sans-serif,system-ui,sans-serif;fill:#f4f8ff;letter-spacing:-1.2px}.subtitle{font:400 17px ui-sans-serif,system-ui,sans-serif;fill:#93a5c1}.kicker{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.7px}.section{font:700 25px ui-sans-serif,system-ui,sans-serif;fill:#f3f7ff}.boxTitle{font:700 16px ui-sans-serif,system-ui,sans-serif;fill:#edf4ff}.body{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#aebbd0}.small{font:400 12px ui-sans-serif,system-ui,sans-serif;fill:#8497b5}.mono{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#dce8fa}.mini{font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#8ea3c3;letter-spacing:.6px}.dinoNode{fill:#edf3ff;stroke:#a78bfa;stroke-width:1.5}.micvNode{fill:#edf9f7;stroke:#32b8aa;stroke-width:1.5}.antNode{fill:#fff7e8;stroke:#d3992f;stroke-width:1.5}.neutral{fill:#f4f8ff;stroke:#354760;stroke-width:1.5}.unknown{fill:#ffffff;stroke:#d38f7e;stroke-width:1.5;stroke-dasharray:6 5}.line{fill:none;stroke:#8597b4;stroke-width:2;marker-end:url(#a)}.micvLine{fill:none;stroke:#42d5c5;stroke-width:2;marker-end:url(#teal)}.antLine{fill:none;stroke:#f4bb4f;stroke-width:2;marker-end:url(#amber)}
    </style>
      <style>
      text,tspan{fill:#111827}
      .eyebrow,.kicker,.stage,.role,.step,.label,.section{fill:#2448c2}
      .subtitle,.body,.small,.mini,.note,.sub,.tiny{fill:#52627a}
      .headline,.title,.laneTitle,.lane-title,.card-title,.cardTitle,.boxTitle,.actor,.head,.strong,.stat,.value,.formula,.eq,.prob,.state{fill:#111827}
      .mono,.monoText,.chip,.number,.num,.code,.dim{fill:#253651}
    </style>
  </defs>

  <rect width="1920" height="1400" fill="#f4f8ff"/><rect width="1920" height="1400" fill="url(#grid)" opacity=".5"/>
  <text x="60" y="66" class="kicker" fill="#d1bfff">FIGURE 17 · NTIRE CHALLENGE CONTEXT · EXTERNAL DINOv3 METHODS</text>
  <text x="60" y="114" class="title">DINOv3 appears in the report—but outside SynthFlag</text>
  <text x="60" y="147" class="subtitle">ViT-7B/16 anatomy contextualizes Ant’s named backbone only; MICV variants remain unreported and are not assumed.</text>
  <g transform="translate(1472 48)"><rect width="388" height="94" rx="15" fill="#ffffff" stroke="#df8e7d" stroke-dasharray="7 6"/><text x="18" y="28" class="mini" fill="#ffb09f">NOT DEPLOYED BY SYNTHFLAG</text><text x="18" y="55" class="body">No DINOv3 module is imported, instantiated,</text><text x="18" y="76" class="body">checkpoint-loaded, or executed by its inference path.</text></g>

  <!-- Backbone anatomy -->
  <g transform="translate(60 185)">
    <rect width="1800" height="350" rx="24" fill="url(#dino)" stroke="#8066d0" stroke-width="2"/>
    <text x="24" y="38" class="kicker" fill="#cfbfff">OFFICIAL BACKBONE REFERENCE · DINOv3 ViT-7B/16 · 6,716M PRETRAINED PARAMETERS</text>
    <text x="24" y="75" class="section">What “DINOv3-7B” means before a challenge team adds its detector head</text>

    <g transform="translate(24 112)"><rect class="dinoNode" width="245" height="190" rx="15"/><text x="16" y="28" class="mini">PATCH EMBEDDING</text><text x="16" y="58" class="body">Conv2d · kernel/stride 16</text><text x="16" y="82" class="mono">RGB → width 4096</text><text x="16" y="112" class="body">512 px → 32×32 patches</text><text x="16" y="136" class="body">288 px → 18×18 patches</text><text x="16" y="166" class="small">spatial tokens stay dense</text></g>
    <path class="line" d="M277 207H315"/>
    <g transform="translate(323 112)"><rect class="dinoNode" width="245" height="190" rx="15"/><text x="16" y="28" class="mini">TOKEN SEQUENCE</text><text x="16" y="58" class="body">prepend 1 CLS token</text><text x="16" y="82" class="body">prepend 4 register tokens</text><text x="16" y="106" class="body">2D rotary positions (RoPE)</text><text x="16" y="136" class="mono">512 px → 1,029 tokens</text><text x="16" y="160" class="mono">288 px → 329 tokens</text></g>
    <path class="line" d="M576 207H614"/>
    <g transform="translate(622 96)"><rect class="dinoNode" width="568" height="222" rx="16"/><text x="16" y="28" class="mini">TRANSFORMER BLOCK ×40</text><text x="16" y="60" class="body">LayerNorm ε=1e−5 → multi-head self-attention → residual</text><text x="16" y="86" class="mono">width 4096 · 32 heads · 128 dimensions/head</text><text x="16" y="116" class="body">QKV bias false · projection bias true · LayerScale init 1e−5</text><text x="16" y="148" class="body">LayerNorm → SwiGLU64 feed-forward → residual</text><text x="16" y="174" class="mono">FFN ratio 3 · drop-path configured 0 in reference factory</text><text x="16" y="202" class="small">Official reference for Ant’s named model; not assumed for MICV.</text></g>
    <path class="line" d="M1198 207H1236"/>
    <g transform="translate(1244 112)"><rect class="dinoNode" width="238" height="190" rx="15"/><text x="16" y="28" class="mini">NORMALIZED OUTPUTS</text><text x="16" y="58" class="body">normalized CLS token</text><text x="16" y="82" class="body">4 normalized registers</text><text x="16" y="106" class="body">normalized patch tokens</text><text x="16" y="136" class="mono">feature width = 4096</text><text x="16" y="164" class="small">task head is downstream</text></g>
    <path class="line" d="M1490 207H1528"/>
    <g transform="translate(1536 112)"><rect class="unknown" width="240" height="190" rx="15"/><text x="16" y="28" class="mini" fill="#ffb09f">TEAM-SPECIFIC DETECTOR</text><text x="16" y="58" class="body">pooling / aggregation</text><text x="16" y="82" class="body">projection / binary head</text><text x="16" y="106" class="body">TTA and probability fusion</text><text x="16" y="140" class="boxTitle">Use report details below</text><text x="16" y="165" class="small">do not infer missing layers</text></g>
  </g>

  <!-- MICV -->
  <g transform="translate(60 570)">
    <rect width="875" height="680" rx="24" fill="url(#micv)" stroke="#258c84" stroke-width="2"/>
    <text x="24" y="38" class="kicker" fill="#78eadf">TEAM MICV · TWO DINOv3 COMMITTEES</text>
    <text x="24" y="75" class="section">Six backbones grouped 4 + 2</text>
    <text x="24" y="103" class="small">The report does not name the individual DINOv3 variants in either committee.</text>

    <g transform="translate(24 132)"><rect class="micvNode" width="176" height="106" rx="14"/><text x="14" y="27" class="mini">IMAGE</text><text x="14" y="54" class="body">direct resize</text><text x="14" y="78" class="mono">512×512</text><text x="14" y="98" class="small">inference</text></g>
    <path class="micvLine" d="M208 185H248V245"/><path class="micvLine" d="M208 185H248V426"/>

    <g transform="translate(256 126)">
      <rect class="micvNode" width="260" height="238" rx="16"/>
      <text x="16" y="28" class="mini">STREAM A · COMMITTEE ×4</text>
      <g transform="translate(16 49)"><rect class="dinoNode" width="104" height="62" rx="9"/><text x="52" y="25" text-anchor="middle" class="mono">DINOv3 A1</text><text x="52" y="46" text-anchor="middle" class="small">variant ?</text></g>
      <g transform="translate(136 49)"><rect class="dinoNode" width="104" height="62" rx="9"/><text x="52" y="25" text-anchor="middle" class="mono">DINOv3 A2</text><text x="52" y="46" text-anchor="middle" class="small">variant ?</text></g>
      <g transform="translate(16 123)"><rect class="dinoNode" width="104" height="62" rx="9"/><text x="52" y="25" text-anchor="middle" class="mono">DINOv3 A3</text><text x="52" y="46" text-anchor="middle" class="small">variant ?</text></g>
      <g transform="translate(136 123)"><rect class="dinoNode" width="104" height="62" rx="9"/><text x="52" y="25" text-anchor="middle" class="mono">DINOv3 A4</text><text x="52" y="46" text-anchor="middle" class="small">variant ?</text></g>
      <text x="16" y="218" class="small">aggregate feature maps · operator not reported</text>
    </g>
    <path class="micvLine" d="M524 245H557"/>
    <g transform="translate(565 151)"><rect class="micvNode" width="154" height="188" rx="14"/><text x="14" y="27" class="mini">STREAM A HEAD</text><text x="14" y="58" class="body">projection layer</text><text x="14" y="82" class="body">latent space</text><text x="14" y="106" class="body">MLP head</text><text x="14" y="138" class="mono">probability pA</text><text x="14" y="166" class="small">dimensions ?</text></g>

    <g transform="translate(256 388)">
      <rect class="micvNode" width="260" height="164" rx="16"/>
      <text x="16" y="28" class="mini">STREAM B · COMMITTEE ×2</text>
      <g transform="translate(16 49)"><rect class="dinoNode" width="104" height="62" rx="9"/><text x="52" y="25" text-anchor="middle" class="mono">DINOv3 B1</text><text x="52" y="46" text-anchor="middle" class="small">variant ?</text></g>
      <g transform="translate(136 49)"><rect class="dinoNode" width="104" height="62" rx="9"/><text x="52" y="25" text-anchor="middle" class="mono">DINOv3 B2</text><text x="52" y="46" text-anchor="middle" class="small">variant ?</text></g>
      <text x="16" y="142" class="small">aggregate feature maps · operator not reported</text>
    </g>
    <path class="micvLine" d="M524 470H557"/>
    <g transform="translate(565 388)"><rect class="micvNode" width="154" height="164" rx="14"/><text x="14" y="27" class="mini">STREAM B HEAD</text><text x="14" y="58" class="body">projection layer</text><text x="14" y="82" class="body">latent space</text><text x="14" y="106" class="body">MLP head</text><text x="14" y="138" class="mono">probability pB</text></g>

    <path class="micvLine" d="M727 245H757V330"/><path class="micvLine" d="M727 470H757V390"/>
    <g transform="translate(765 312)"><rect class="micvNode" width="86" height="96" rx="14"/><text x="43" y="27" text-anchor="middle" class="mini">MEAN</text><text x="43" y="53" text-anchor="middle" class="mono">pA+pB</text><line x1="22" y1="62" x2="64" y2="62" stroke="#78eadf"/><text x="43" y="84" text-anchor="middle" class="mono">2</text></g>
    <g transform="translate(24 586)"><rect class="unknown" width="827" height="68" rx="12"/><text x="14" y="26" class="mini" fill="#ffb09f">UNREPORTED · DO NOT FILL WITH ASSUMPTIONS</text><text x="14" y="50" class="body">six exact variants · feature shapes · within-committee aggregation · projection dimensions · MLP layers</text></g>
  </g>

  <!-- Ant International -->
  <g transform="translate(965 570)">
    <rect width="895" height="680" rx="24" fill="url(#ant)" stroke="#a66f1c" stroke-width="2"/>
    <text x="24" y="38" class="kicker" fill="#ffd47a">ANT INTERNATIONAL · DUAL DINOv3-7B EXPERTS</text>
    <text x="24" y="75" class="section">Two full fine-tunes · reported total 14B parameters</text>
    <text x="24" y="103" class="small">Each expert generates multiple TTA outputs before cross-expert weighted averaging.</text>

    <g transform="translate(24 132)"><rect class="antNode" width="174" height="106" rx="14"/><text x="14" y="27" class="mini">IMAGE</text><text x="14" y="54" class="body">two expert views</text><text x="14" y="78" class="small">exact TTA set ?</text></g>
    <path class="antLine" d="M206 185H246V245"/><path class="antLine" d="M206 185H246V444"/>

    <g transform="translate(254 126)">
      <rect class="antNode" width="340" height="258" rx="16"/>
      <text x="16" y="28" class="mini">EXPERT 1 · HIGH-RES SPECIALIST</text>
      <text x="16" y="58" class="mono">input resolution 512×512</text>
      <text x="16" y="86" class="body">DINOv3-7B · independent full parameters</text>
      <text x="16" y="112" class="body">pooling: attention_pooling</text>
      <text x="16" y="138" class="body">TTA → per-view predictions</text>
      <text x="16" y="164" class="body">aggregate TTA outputs per expert</text>
      <line x1="16" y1="182" x2="324" y2="182" stroke="#6f511e"/>
      <text x="16" y="207" class="small">trained: degradation levels 2–4 · 1 epoch</text>
      <text x="16" y="230" class="small">LR 1e−6 · EMA · AMP · no dropout</text>
      <text x="16" y="250" class="mono">expert score s1</text>
    </g>
    <path class="antLine" d="M602 255H646"/>

    <g transform="translate(254 408)">
      <rect class="antNode" width="340" height="222" rx="16"/>
      <text x="16" y="28" class="mini">EXPERT 2 · ROBUSTNESS SPECIALIST</text>
      <text x="16" y="58" class="mono">input resolution 288×288</text>
      <text x="16" y="86" class="body">DINOv3-7B · independent full parameters</text>
      <text x="16" y="112" class="body">pooling: first_token_pooling</text>
      <text x="16" y="138" class="body">TTA → aggregate per expert</text>
      <line x1="16" y1="156" x2="324" y2="156" stroke="#6f511e"/>
      <text x="16" y="181" class="small">trained: degradation levels 1–4 · 10 epochs</text>
      <text x="16" y="207" class="mono">expert score s2</text>
    </g>
    <path class="antLine" d="M602 519H646"/>

    <g transform="translate(654 211)">
      <rect class="antNode" width="217" height="330" rx="16"/>
      <text x="16" y="29" class="mini">WEIGHTED FUSION</text>
      <text x="16" y="66" class="mono">w1·s1 + w2·s2</text>
      <text x="16" y="92" class="small">weights not reported</text>
      <line x1="16" y1="112" x2="201" y2="112" stroke="#8b6424"/>
      <text x="16" y="143" class="body">final robust prediction</text>
      <text x="16" y="177" class="body">reported A100 inference</text>
      <text x="16" y="201" class="mono">≈2.21 images/s</text>
      <text x="16" y="225" class="mono">78.25 GB VRAM</text>
      <text x="16" y="264" class="small">full-parameter training</text>
      <text x="16" y="286" class="small">used NVIDIA B200 GPUs</text>
      <text x="16" y="314" class="small">head dimensions ?</text>
    </g>

    <g transform="translate(24 586)"><rect class="unknown" width="847" height="68" rx="12"/><text x="14" y="26" class="mini" fill="#ffb09f">UNREPORTED · DO NOT FILL WITH ASSUMPTIONS</text><text x="14" y="50" class="body">TTA transforms/count · per-expert TTA reducer · fusion weights · classifier-head architecture</text></g>
  </g>

  <g transform="translate(60 1285)">
    <rect width="1800" height="70" rx="14" fill="#ffffff" stroke="#df8e7d" stroke-dasharray="7 6"/>
    <text x="18" y="28" class="mini" fill="#ffb09f">HARD RELEASE BOUNDARY</text>
    <text x="18" y="51" class="body">These are comparative summaries of other NTIRE submissions. SynthFlag executes CLIP ×2 + SigLIP ×2; it does not ship, load, call, or claim the DINOv3 systems above.</text>
  </g>
  <text x="60" y="1386" class="small">Sources: NTIRE 2026 challenge report §§3.1 and 3.2 · Meta DINOv3 official model card and reference ViT-7B/16 factory.</text>
  <g aria-label="Historical baseline notice" pointer-events="none">
    <rect x="67%" y="16" width="30%" height="36" rx="8" fill="#8b1d2c" opacity="0.96"/>
    <text x="82%" y="40" fill="#ffffff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text>
  </g>
</svg>
