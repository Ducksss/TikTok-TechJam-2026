<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag dual image preprocessing</title><desc id="desc">An RGB image splits into a CLIP pipeline using bicubic resize, 224 pixel center crop, tensor conversion, and CLIP channel normalization, and a SigLIP pipeline using bicubic resize, 384 pixel center crop, tensor conversion, and mean and standard deviation of 0.5.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><linearGradient id="clip-lane" x1="0" x2="1"><stop offset="0" stop-color="#edf3ff"/><stop offset="1" stop-color="#edf3ff"/></linearGradient><linearGradient id="siglip-lane" x1="0" x2="1"><stop offset="0" stop-color="#fff7e8"/><stop offset="1" stop-color="#fff7e8"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#7890a9" stroke-opacity=".07" d="M40 0H0V40"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#f4f8ff" flood-opacity=".4" stdDeviation="15"/></filter><marker id="arr-blue" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#60a5fa" d="M0 0L10 5L0 10Z"/></marker><marker id="arr-amber" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#fbbf24" d="M0 0L10 5L0 10Z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#65e6d2}.headline{font-size:46px;font-weight:740;letter-spacing:-1.3px;fill:#f5f9ff}.subtitle{font-size:19px;fill:#aabbd0}.lane-title{font-size:26px;font-weight:730;fill:#f6f9fd}.body{font-size:16px;fill:#b9c8da}.small,.step{font-size:13px;fill:#8fa5be}.step{font-weight:800;letter-spacing:1.6px;fill:#8da4be}.card-title{font-size:18px;font-weight:720;fill:#eef5fc}.value{font-size:14px;fill:#cbd9e8}</style><style>text{fill:#111827}.eyebrow,.step{fill:#2448c2}.body,.small,.subtitle{fill:#52627a}.card-title,.headline,.lane-title,.value{fill:#111827}.mono{fill:#253651}</style></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><g class="sans"><text x="80" y="76" class="eyebrow">IMAGE PROCESSING · TWO VIEWS, SAME PIXELS</text><text x="80" y="132" class="headline">Each backbone receives its native input</text><text x="80" y="170" class="subtitle">The source is decoded once, then transformed independently for CLIP and SigLIP.</text><g filter="url(#shadow)" transform="translate(80 250)"><rect width="214" height="400" fill="#edf9f7" stroke="#2dd4bf" stroke-width="2" rx="24"/><text x="24" y="41" fill="#63e6d4" class="step">SHARED INPUT</text><rect width="166" height="166" x="24" y="72" fill="#edf9f7" stroke="#347a7b" rx="18"/><rect width="128" height="128" x="43" y="91" fill="#edf3ff" rx="12"/><circle cx="84" cy="134" r="24" fill="#2dd4bf" fill-opacity=".75"/><path fill="#60a5fa" fill-opacity=".8" d="M43 200l39-40 28 26 25-31 36 45Z"/><text x="24" y="278" class="lane-title">RGB</text><text x="24" y="310" class="body">Three channels</text><text x="24" y="336" class="body">Mixed source sizes</text><rect width="151" height="26" x="24" y="358" fill="#edf9f7" rx="13"/><text x="99" y="376" fill="#bff8ee" class="mono" font-size="12" text-anchor="middle">PIL.Image</text></g><path fill="none" stroke="#60a5fa" stroke-width="3" marker-end="url(#arr-blue)" d="M294 450H340V350H382"/><path fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#arr-amber)" d="M340 450V650H382"/><circle cx="340" cy="450" r="7" fill="#dbe7f5"/><g transform="translate(382 230)"><rect width="974" height="250" fill="url(#clip-lane)" stroke="#2563eb" stroke-width="2" rx="26"/><rect width="130" height="34" x="26" y="24" fill="#173c78" rx="17"/><circle cx="46" cy="41" r="6" fill="#60a5fa"/><text x="62" y="46" fill="#cce2ff" class="step">CLIP LANE</text><text x="186" y="49" class="small">OpenAI CLIP ViT-L/14 image transform</text><g transform="translate(26 82)"><rect width="182" height="126" fill="#f4f8ff" stroke="#345b91" rx="16"/><text x="18" y="27" class="step">01</text><text x="18" y="55" class="card-title">Resize</text><text x="18" y="82" class="value">short edge → 224</text><text x="18" y="104" class="small">bicubic interpolation</text><path stroke="#60a5fa" stroke-width="3" marker-end="url(#arr-blue)" d="M208 63H230"/><rect width="174" height="126" x="238" fill="#f4f8ff" stroke="#345b91" rx="16"/><text x="256" y="27" class="step">02</text><text x="256" y="55" class="card-title">CenterCrop</text><text x="256" y="84" fill="#9fc7ff" class="mono" font-size="18" font-weight="700">224 × 224</text><path stroke="#60a5fa" stroke-width="3" marker-end="url(#arr-blue)" d="M412 63H434"/><rect width="148" height="126" x="442" fill="#f4f8ff" stroke="#345b91" rx="16"/><text x="460" y="27" class="step">03</text><text x="460" y="55" class="card-title">ToTensor</text><text x="460" y="83" class="value">[3, 224, 224]</text><text x="460" y="104" class="small">float channels</text><path stroke="#60a5fa" stroke-width="3" marker-end="url(#arr-blue)" d="M590 63H612"/><rect width="302" height="126" x="620" fill="#f4f8ff" stroke="#345b91" rx="16"/><text x="638" y="27" class="step">04 · NORMALIZE</text><text x="638" y="55" fill="#d4e6fb" class="mono" font-size="13">mean = (0.48145466, 0.4578275,</text><text x="638" y="75" fill="#d4e6fb" class="mono" font-size="13">0.40821073)</text><text x="638" y="99" fill="#d4e6fb" class="mono" font-size="13">std = (0.26862954, 0.26130258,</text><text x="638" y="119" fill="#d4e6fb" class="mono" font-size="13">0.27577711)</text></g></g><g transform="translate(382 520)"><rect width="974" height="250" fill="url(#siglip-lane)" stroke="#d97706" stroke-width="2" rx="26"/><rect width="150" height="34" x="26" y="24" fill="#fff7e8" rx="17"/><circle cx="46" cy="41" r="6" fill="#fbbf24"/><text x="62" y="46" fill="#ffe1a1" class="step">SIGLIP LANE</text><text x="206" y="49" class="small">Google SigLIP So400M Patch14-384 image transform</text><g transform="translate(26 82)"><rect width="182" height="126" fill="#fff7e8" stroke="#73531e" rx="16"/><text x="18" y="27" class="step">01</text><text x="18" y="55" class="card-title">Resize</text><text x="18" y="82" class="value">short edge → 384</text><text x="18" y="104" class="small">bicubic interpolation</text><path stroke="#fbbf24" stroke-width="3" marker-end="url(#arr-amber)" d="M208 63H230"/><rect width="174" height="126" x="238" fill="#fff7e8" stroke="#73531e" rx="16"/><text x="256" y="27" class="step">02</text><text x="256" y="55" class="card-title">CenterCrop</text><text x="256" y="84" fill="#ffd783" class="mono" font-size="18" font-weight="700">384 × 384</text><path stroke="#fbbf24" stroke-width="3" marker-end="url(#arr-amber)" d="M412 63H434"/><rect width="148" height="126" x="442" fill="#fff7e8" stroke="#73531e" rx="16"/><text x="460" y="27" class="step">03</text><text x="460" y="55" class="card-title">ToTensor</text><text x="460" y="83" class="value">[3, 384, 384]</text><text x="460" y="104" class="small">float channels</text><path stroke="#fbbf24" stroke-width="3" marker-end="url(#arr-amber)" d="M590 63H612"/><rect width="302" height="126" x="620" fill="#fff7e8" stroke="#73531e" rx="16"/><text x="638" y="27" class="step">04 · NORMALIZE</text><text x="638" y="60" fill="#ffdfa0" class="mono" font-size="15">mean = (0.5, 0.5, 0.5)</text><text x="638" y="88" fill="#ffdfa0" class="mono" font-size="15">std = (0.5, 0.5, 0.5)</text><text x="638" y="112" class="small">maps each channel to roughly −1…1</text></g></g><g transform="translate(80 824)"><line x1="0" x2="1276" y1="0" y2="0" stroke="#28415b"/><text x="0" y="37" class="small">ORDER IS FIXED</text><text x="124" y="37" fill="#d6e3f1" class="mono" font-size="13">Resize → CenterCrop → ToTensor → Normalize</text><text x="1276" y="37" class="small" text-anchor="end">Source: released infer/model.py</text></g></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>