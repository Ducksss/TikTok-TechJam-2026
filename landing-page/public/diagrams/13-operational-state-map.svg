<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag public detector operational state map</title><desc id="desc">On page load the user interface performs one health check and enters checking, ready, warming, or offline service state, while also reading advertised video capability. A valid image proceeds to a model request; a valid video is locally sampled before its frame request. Errors return to idle with the selection preserved. Client, edge proxy, and model service validation produce documented statuses. The client has a five-minute abort and no automatic retry; authentication and rate limiting remain external deployment responsibilities.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#7890a9" stroke-opacity=".07" d="M40 0H0V40"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="11" flood-color="#f4f8ff" flood-opacity=".14" stdDeviation="15"/></filter><marker id="arr" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#8ba7c5" d="M0 0L10 5L0 10Z"/></marker><marker id="lime" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a3e635" d="M0 0L10 5L0 10Z"/></marker><marker id="coral" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#ff7e79" d="M0 0L10 5L0 10Z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#65e6d2}.headline{font-size:44px;font-weight:740;letter-spacing:-1.2px;fill:#f5f9ff}.subtitle{font-size:18px;fill:#aabbd0}.label{font-size:12px;font-weight:800;letter-spacing:1.65px}.head{font-size:19px;font-weight:730;fill:#f4f8fd}.body{font-size:14px;fill:#b8c7d8}.small{font-size:12px;fill:#91a6bd}.tiny{font-size:11px;fill:#849ab3}.state{font-size:16px;font-weight:760;fill:#f5f8fc}.code{font-size:13px;font-weight:780}</style><style>text,tspan{fill:#111827}.eyebrow,.label{fill:#2448c2}.body,.small,.subtitle,.tiny{fill:#52627a}.head,.headline,.state{fill:#111827}.code,.mono{fill:#253651}</style></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><g class="sans"><text x="80" y="76" class="eyebrow">PUBLIC WORKSPACE · UI STATE + FAILURE SURFACES</text><text x="80" y="130" class="headline">Availability and analysis are two independent state machines</text><text x="80" y="168" class="subtitle">The interface reports what it knows; it does not hide cold starts, retry automatically, or imply provenance.</text><g filter="url(#shadow)" transform="translate(70 216)"><rect width="638" height="284" fill="#f4f8ff" stroke="#3d5977" rx="25"/><text x="24" y="40" fill="#65e6d2" class="label">A · SERVICE AVAILABILITY · ONE CHECK ON MOUNT</text><g transform="translate(24 78)"><rect width="124" height="64" fill="#edf3ff" stroke="#71839a" rx="16"/><text x="62" y="38" class="state" text-anchor="middle">checking</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M148 110H192"/><g transform="translate(200 67)"><rect width="176" height="88" fill="#edf3ff" stroke="#526c88" rx="17"/><text x="88" y="32" class="head" text-anchor="middle">Health request</text><text x="88" y="57" class="small" text-anchor="middle">browser abort · 6 s</text><text x="88" y="76" class="tiny" text-anchor="middle">proxy upstream · 5 s</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M376 110H420"/><g transform="translate(428 57)"><rect width="168" height="52" fill="#fff" stroke="#a3e635" rx="15"/><circle cx="18" cy="26" r="5" fill="#a3e635"/><text x="34" y="31" class="state">ready</text><rect width="168" height="52" y="67" fill="#fff7e8" stroke="#fbbf24" rx="15"/><circle cx="18" cy="93" r="5" fill="#fbbf24"/><text x="34" y="98" class="state">warming</text><rect width="168" height="52" y="134" fill="#fff5f6" stroke="#ff7e79" rx="15"/><circle cx="18" cy="160" r="5" fill="#ff7e79"/><text x="34" y="165" class="state">offline</text></g><text x="24" y="247" class="body">Ready → run normally · Warming → analysis allowed, triggers cold start</text><text x="24" y="269" class="body">Offline/checking → analysis button disabled</text></g><g filter="url(#shadow)" transform="translate(732 216)"><rect width="638" height="284" fill="#f4f8ff" stroke="#3d5977" rx="25"/><text x="24" y="40" fill="#65e6d2" class="label">B · ANALYSIS LIFECYCLE</text><g transform="translate(24 74)"><rect width="128" height="72" fill="#edf3ff" stroke="#60758e" rx="17"/><text x="64" y="43" class="state" text-anchor="middle">idle</text></g><path stroke="#a3e635" stroke-width="2.2" marker-end="url(#lime)" d="M152 110H207"/><g transform="translate(215 74)"><rect width="168" height="72" fill="#edf3ff" stroke="#60a5fa" rx="17"/><text x="84" y="32" class="state" text-anchor="middle">sample / request</text><text x="84" y="55" class="tiny" text-anchor="middle">real client work states</text></g><path stroke="#a3e635" stroke-width="2.2" marker-end="url(#lime)" d="M383 110H438"/><g transform="translate(446 74)"><rect width="168" height="72" fill="#fff" stroke="#a3e635" rx="17"/><text x="84" y="32" class="state" text-anchor="middle">complete</text><text x="84" y="55" class="tiny" text-anchor="middle">score or frame timeline</text></g><path fill="none" stroke="#ff7e79" stroke-width="2" marker-end="url(#coral)" d="M299 146V194H108V154"/><g transform="translate(336 176)"><rect width="278" height="64" fill="#fff5f6" stroke="#ff7e79" rx="16"/><text x="16" y="27" class="state">error → idle + message</text><text x="16" y="49" class="tiny">user may submit again manually</text></g><text x="24" y="266" fill="#ff9b97" class="label">NO AUTOMATIC RETRY · CLIENT ABORTS THE REQUEST AT 300 S</text></g><g filter="url(#shadow)" transform="translate(70 528)"><rect width="900" height="276" fill="#f4f8ff" stroke="#3b536d" rx="25"/><text x="24" y="40" fill="#8fa6c0" class="label">VALIDATION + STATUS SURFACES</text><g transform="translate(24 68)"><rect width="254" height="174" fill="#edf3ff" stroke="#4a6c90" rx="18"/><text x="18" y="30" fill="#79c5ff" class="label">BROWSER</text><text x="18" y="59" class="body">image or MP4/WebM video</text><text x="18" y="82" class="body">10 MiB image · 50 MB / 10 s video</text><text x="18" y="105" class="body">local decode + eight video samples</text><text x="18" y="137" class="small">invalid type / size / decode</text><text x="18" y="157" class="small">shown locally; no request</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M278 155H317"/><g transform="translate(325 68)"><rect width="254" height="174" fill="#edf3ff" stroke="#728096" rx="18"/><text x="18" y="30" fill="#aebed1" class="label">EDGE PROXY · OPTIONAL</text><text x="18" y="59" class="body"><tspan fill="#ff9b97" class="mono code">400</tspan> malformed / missing file</text><text x="18" y="84" class="body"><tspan fill="#ff9b97" class="mono code">415</tspan> unsupported MIME</text><text x="18" y="109" class="body"><tspan fill="#ff9b97" class="mono code">413</tspan> image or frame byte limit</text><text x="18" y="134" class="body"><tspan fill="#ff9b97" class="mono code">503</tspan> no service configured</text><text x="18" y="159" class="body"><tspan fill="#ff9b97" class="mono code">502</tspan> upstream / 300 s timeout</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M579 155H618"/><g transform="translate(626 68)"><rect width="250" height="174" fill="#eef3fb" stroke="#ff7e79" rx="18"/><text x="18" y="30" fill="#ff9b97" class="label">MODEL SERVICE</text><text x="18" y="59" class="body"><tspan fill="#ff9b97" class="mono code">415</tspan> unsupported MIME</text><text x="18" y="84" class="body"><tspan fill="#ff9b97" class="mono code">413</tspan> over 10 MiB / 50 MP</text><text x="18" y="109" class="body"><tspan fill="#ff9b97" class="mono code">422</tspan> decode / duration / timestamp failure</text><text x="18" y="134" class="body"><tspan fill="#ff9b97" class="mono code">422</tspan> dimensions or frame count invalid</text><text x="18" y="159" class="small">upstream status passes through proxy</text></g></g><g filter="url(#shadow)" transform="translate(994 528)"><rect width="376" height="276" fill="#fff" stroke="#a3e635" stroke-opacity=".75" rx="25"/><text x="24" y="40" fill="#b7f66e" class="label">DEPLOYMENT RESPONSIBILITIES</text><circle cx="30" cy="78" r="5" fill="#ff7e79"/><text x="46" y="83" class="body">Public endpoint has no application auth.</text><circle cx="30" cy="116" r="5" fill="#ff7e79"/><text x="46" y="121" class="body">Rate limiting is outside this code.</text><circle cx="30" cy="154" r="5" fill="#fbbf24"/><text x="46" y="159" class="body">Direct access depends on CORS allowlist.</text><circle cx="30" cy="192" r="5" fill="#a3e635"/><text x="46" y="197" class="body">Uploads are processed in memory.</text><circle cx="30" cy="230" r="5" fill="#a3e635"/><text x="46" y="235" class="body">Service writes no upload or result files.</text></g><text x="70" y="848" class="small">Routing choice: direct → /v1/analyze[-frames], or same-origin → /api/analyze[-video] → model service.</text></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>