<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">SynthFlag public detector operational state map</title>
  <desc id="desc">On page load the user interface performs one health check and enters checking, ready, warming, or offline service state, while also reading advertised video capability. A valid image proceeds to a model request; a valid video is locally sampled before its frame request. Errors return to idle with the selection preserved. Client, edge proxy, and model service validation produce documented statuses. The client has a five-minute abort and no automatic retry; authentication and rate limiting remain external deployment responsibilities.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#06101d"/><stop offset="1" stop-color="#0a1527"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7890a9" stroke-opacity="0.07"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="11" stdDeviation="15" flood-color="#000712" flood-opacity="0.42"/></filter>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#8ba7c5"/></marker>
    <marker id="lime" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#a3e635"/></marker>
    <marker id="coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#ff7e79"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#65e6d2}.headline{font-size:44px;font-weight:740;letter-spacing:-1.2px;fill:#f5f9ff}.subtitle{font-size:18px;fill:#aabbd0}
      .label{font-size:12px;font-weight:800;letter-spacing:1.65px}.head{font-size:19px;font-weight:730;fill:#f4f8fd}.body{font-size:14px;fill:#b8c7d8}.small{font-size:12px;fill:#91a6bd}.tiny{font-size:11px;fill:#849ab3}.state{font-size:16px;font-weight:760;fill:#f5f8fc}.code{font-size:13px;font-weight:780}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/>
  <g class="sans">
    <text x="80" y="76" class="eyebrow">PUBLIC WORKSPACE · UI STATE + FAILURE SURFACES</text>
    <text x="80" y="130" class="headline">Availability and analysis are two independent state machines</text>
    <text x="80" y="168" class="subtitle">The interface reports what it knows; it does not hide cold starts, retry automatically, or imply provenance.</text>

    <g transform="translate(70 216)" filter="url(#shadow)">
      <rect width="638" height="284" rx="25" fill="#0c1a2c" stroke="#3d5977"/>
      <text x="24" y="40" class="label" fill="#65e6d2">A · SERVICE AVAILABILITY · ONE CHECK ON MOUNT</text>
      <g transform="translate(24 78)"><rect width="124" height="64" rx="16" fill="#142438" stroke="#71839a"/><text x="62" y="38" class="state" text-anchor="middle">checking</text></g>
      <path d="M148 110H192" stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)"/>
      <g transform="translate(200 67)">
        <rect width="176" height="88" rx="17" fill="#111d30" stroke="#526c88"/>
        <text x="88" y="32" class="head" text-anchor="middle">Health request</text>
        <text x="88" y="57" class="small" text-anchor="middle">browser abort · 6 s</text>
        <text x="88" y="76" class="tiny" text-anchor="middle">proxy upstream · 5 s</text>
      </g>
      <path d="M376 110H420" stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)"/>
      <g transform="translate(428 57)">
        <rect width="168" height="52" rx="15" fill="#183022" stroke="#a3e635"/><circle cx="18" cy="26" r="5" fill="#a3e635"/><text x="34" y="31" class="state">ready</text>
        <rect y="67" width="168" height="52" rx="15" fill="#302710" stroke="#fbbf24"/><circle cx="18" cy="93" r="5" fill="#fbbf24"/><text x="34" y="98" class="state">warming</text>
        <rect y="134" width="168" height="52" rx="15" fill="#2d1a22" stroke="#ff7e79"/><circle cx="18" cy="160" r="5" fill="#ff7e79"/><text x="34" y="165" class="state">offline</text>
      </g>
      <text x="24" y="247" class="body">Ready → run normally · Warming → analysis allowed, triggers cold start</text>
      <text x="24" y="269" class="body">Offline/checking → analysis button disabled</text>
    </g>

    <g transform="translate(732 216)" filter="url(#shadow)">
      <rect width="638" height="284" rx="25" fill="#0c1a2c" stroke="#3d5977"/>
      <text x="24" y="40" class="label" fill="#65e6d2">B · ANALYSIS LIFECYCLE</text>
      <g transform="translate(24 74)"><rect width="128" height="72" rx="17" fill="#152337" stroke="#60758e"/><text x="64" y="43" class="state" text-anchor="middle">idle</text></g>
      <path d="M152 110H207" stroke="#a3e635" stroke-width="2.2" marker-end="url(#lime)"/>
      <g transform="translate(215 74)"><rect width="168" height="72" rx="17" fill="#102844" stroke="#60a5fa"/><text x="84" y="32" class="state" text-anchor="middle">sample / request</text><text x="84" y="55" class="tiny" text-anchor="middle">real client work states</text></g>
      <path d="M383 110H438" stroke="#a3e635" stroke-width="2.2" marker-end="url(#lime)"/>
      <g transform="translate(446 74)"><rect width="168" height="72" rx="17" fill="#183022" stroke="#a3e635"/><text x="84" y="32" class="state" text-anchor="middle">complete</text><text x="84" y="55" class="tiny" text-anchor="middle">score or frame timeline</text></g>
      <path d="M299 146V194H108V154" fill="none" stroke="#ff7e79" stroke-width="2" marker-end="url(#coral)"/>
      <g transform="translate(336 176)"><rect width="278" height="64" rx="16" fill="#2c1921" stroke="#ff7e79"/><text x="16" y="27" class="state">error → idle + message</text><text x="16" y="49" class="tiny">user may submit again manually</text></g>
      <text x="24" y="266" class="label" fill="#ff9b97">NO AUTOMATIC RETRY · CLIENT ABORTS THE REQUEST AT 300 S</text>
    </g>

    <g transform="translate(70 528)" filter="url(#shadow)">
      <rect width="900" height="276" rx="25" fill="#0b1829" stroke="#3b536d"/>
      <text x="24" y="40" class="label" fill="#8fa6c0">VALIDATION + STATUS SURFACES</text>
      <g transform="translate(24 68)">
        <rect width="254" height="174" rx="18" fill="#102138" stroke="#4a6c90"/>
        <text x="18" y="30" class="label" fill="#79c5ff">BROWSER</text>
        <text x="18" y="59" class="body">image or MP4/WebM video</text>
        <text x="18" y="82" class="body">10 MiB image · 50 MB / 10 s video</text>
        <text x="18" y="105" class="body">local decode + eight video samples</text>
        <text x="18" y="137" class="small">invalid type / size / decode</text>
        <text x="18" y="157" class="small">shown locally; no request</text>
      </g>
      <path d="M278 155H317" stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)"/>
      <g transform="translate(325 68)">
        <rect width="254" height="174" rx="18" fill="#151d2c" stroke="#728096"/>
        <text x="18" y="30" class="label" fill="#aebed1">EDGE PROXY · OPTIONAL</text>
        <text x="18" y="59" class="body"><tspan class="mono code" fill="#ff9b97">400</tspan> malformed / missing file</text>
        <text x="18" y="84" class="body"><tspan class="mono code" fill="#ff9b97">415</tspan> unsupported MIME</text>
        <text x="18" y="109" class="body"><tspan class="mono code" fill="#ff9b97">413</tspan> image or frame byte limit</text>
        <text x="18" y="134" class="body"><tspan class="mono code" fill="#ff9b97">503</tspan> no service configured</text>
        <text x="18" y="159" class="body"><tspan class="mono code" fill="#ff9b97">502</tspan> upstream / 300 s timeout</text>
      </g>
      <path d="M579 155H618" stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)"/>
      <g transform="translate(626 68)">
        <rect width="250" height="174" rx="18" fill="#251a20" stroke="#ff7e79"/>
        <text x="18" y="30" class="label" fill="#ff9b97">MODEL SERVICE</text>
        <text x="18" y="59" class="body"><tspan class="mono code" fill="#ff9b97">415</tspan> unsupported MIME</text>
        <text x="18" y="84" class="body"><tspan class="mono code" fill="#ff9b97">413</tspan> over 10 MiB / 50 MP</text>
        <text x="18" y="109" class="body"><tspan class="mono code" fill="#ff9b97">422</tspan> decode / duration / timestamp failure</text>
        <text x="18" y="134" class="body"><tspan class="mono code" fill="#ff9b97">422</tspan> dimensions or frame count invalid</text>
        <text x="18" y="159" class="small">upstream status passes through proxy</text>
      </g>
    </g>

    <g transform="translate(994 528)" filter="url(#shadow)">
      <rect width="376" height="276" rx="25" fill="#17201d" stroke="#a3e635" stroke-opacity=".75"/>
      <text x="24" y="40" class="label" fill="#b7f66e">DEPLOYMENT RESPONSIBILITIES</text>
      <circle cx="30" cy="78" r="5" fill="#ff7e79"/><text x="46" y="83" class="body">Public endpoint has no application auth.</text>
      <circle cx="30" cy="116" r="5" fill="#ff7e79"/><text x="46" y="121" class="body">Rate limiting is outside this code.</text>
      <circle cx="30" cy="154" r="5" fill="#fbbf24"/><text x="46" y="159" class="body">Direct access depends on CORS allowlist.</text>
      <circle cx="30" cy="192" r="5" fill="#a3e635"/><text x="46" y="197" class="body">Uploads are processed in memory.</text>
      <circle cx="30" cy="230" r="5" fill="#a3e635"/><text x="46" y="235" class="body">Service writes no upload or result files.</text>
    </g>

    <text x="70" y="848" class="small">Routing choice: direct → /v1/analyze[-frames], or same-origin → /api/analyze[-video] → model service.</text>
  </g>
</svg>
