<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">SynthFlag sampled-video analysis contract</title>
  <desc id="desc">A short MP4 or WebM stays in the browser while eight uniform midpoint frames are decoded, center-cropped to lossless 384-pixel PNG files, and sent with timestamps to the FastAPI service. The service validates the frame batch, scores two frames at a time with the unchanged FeatDistill ensemble, and returns ordered frame scores plus descriptive mean, peak, and threshold-count summaries. Audio and motion are not analyzed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#06101d"/><stop offset="1" stop-color="#071a2c"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#7991aa" stroke-opacity=".07"/></pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000711" flood-opacity=".42"/></filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#91a9c4"/></marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:15px;font-weight:750;letter-spacing:3px;fill:#65e6d2}.headline{font-size:44px;font-weight:740;letter-spacing:-1.2px;fill:#f5f9ff}.subtitle{font-size:18px;fill:#aabbd0}
      .kicker{font-size:12px;font-weight:800;letter-spacing:1.65px;fill:#8da5bf}.title{font-size:23px;font-weight:740;fill:#f4f8fd}.body{font-size:15px;fill:#b8c8da}.small{font-size:12px;fill:#91a6bd}.tiny{font-size:10px;fill:#849ab3}.chip{font-size:11px;font-weight:780;letter-spacing:.8px}
    </style>
  </defs>
  <rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/>
  <g class="sans">
    <text x="64" y="72" class="eyebrow">VIDEO CONTRACT · BROWSER-SAMPLED VISUAL EVIDENCE</text>
    <text x="64" y="126" class="headline">The video stays local. Eight model-visible frames cross the boundary.</text>
    <text x="64" y="164" class="subtitle">Uniform midpoint sampling is reproducible; every returned value remains an image-model score.</text>

    <g transform="translate(64 220)" filter="url(#shadow)">
      <rect width="388" height="500" rx="28" fill="#09232d" stroke="#2dd4bf" stroke-width="2"/>
      <rect x="22" y="22" width="146" height="31" rx="15" fill="#10424a"/><text x="95" y="42" class="kicker" text-anchor="middle" fill="#bdf8ee">BROWSER · LOCAL</text>
      <text x="22" y="92" class="title">Decode + sample</text>
      <text x="22" y="119" class="body">H.264 MP4 or supported WebM</text>
      <text x="22" y="142" class="small">1–10 seconds · ≤50 MB · metadata checked</text>
      <g transform="translate(22 176)">
        <rect width="344" height="72" rx="16" fill="#0b1826" stroke="#2b5660"/>
        <text x="16" y="27" class="kicker">01 · MIDPOINT RULE</text>
        <text x="16" y="54" class="mono body">tᵢ = duration × (i + 0.5) / 8</text>
        <path d="M172 72V94" stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)"/>
        <rect y="102" width="344" height="92" rx="16" fill="#0b1826" stroke="#2b5660"/>
        <text x="16" y="129" class="kicker">02 · MODEL-VISIBLE CROP</text>
        <text x="16" y="157" class="body">center square → 384 × 384</text>
        <text x="16" y="179" class="small">lossless PNG · one object URL per thumbnail</text>
      </g>
      <g transform="translate(22 400)">
        <rect width="344" height="70" rx="16" fill="#12261f" stroke="#2dd4bf"/>
        <text x="16" y="27" class="kicker" fill="#8ff3e4">PRIVACY BOUNDARY</text>
        <text x="16" y="51" class="body">Original video bytes are never submitted.</text>
      </g>
    </g>

    <path d="M452 470H506" stroke="#91a9c4" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(514 220)" filter="url(#shadow)">
      <rect width="350" height="500" rx="28" fill="#101c2c" stroke="#647b95" stroke-width="2"/>
      <rect x="22" y="22" width="156" height="31" rx="15" fill="#293e57"/><text x="100" y="42" class="kicker" text-anchor="middle" fill="#dce8f5">REQUEST CONTRACT</text>
      <text x="22" y="92" class="title">Bounded multipart payload</text>
      <g transform="translate(22 126)">
        <rect width="306" height="164" rx="18" fill="#0b1826" stroke="#3b536d"/>
        <text x="16" y="30" class="mono body">frames × 8</text>
        <text x="16" y="57" class="small">PNG · ≤2 MB each · ≤16 MB total</text>
        <text x="16" y="92" class="mono body">timestamps_ms</text>
        <text x="16" y="119" class="small">strictly increasing · one per frame</text>
        <text x="16" y="150" class="mono body">duration_ms</text>
      </g>
      <g transform="translate(22 316)">
        <rect width="306" height="70" rx="16" fill="#0c2038" stroke="#3b82f6"/>
        <text x="16" y="27" class="kicker" fill="#aacfff">DIRECT</text>
        <text x="16" y="51" class="mono small">POST /v1/analyze-frames</text>
        <rect y="88" width="306" height="70" rx="16" fill="#151d2c" stroke="#728096"/>
        <text x="16" y="115" class="kicker" fill="#c2cedb">SAME-ORIGIN</text>
        <text x="16" y="139" class="mono small">POST /api/analyze-video</text>
      </g>
    </g>

    <path d="M864 470H918" stroke="#91a9c4" stroke-width="3" marker-end="url(#arrow)"/>
    <g transform="translate(926 220)" filter="url(#shadow)">
      <rect width="450" height="500" rx="28" fill="#101d2d" stroke="#3b536d" stroke-width="2"/>
      <rect x="22" y="22" width="166" height="31" rx="15" fill="#23364b"/><text x="105" y="42" class="kicker" text-anchor="middle" fill="#dae7f4">FASTAPI + MODEL</text>
      <text x="22" y="92" class="title">Validate, microbatch, summarize</text>
      <g transform="translate(22 126)">
        <rect width="406" height="84" rx="16" fill="#0a1725" stroke="#344b65"/>
        <text x="16" y="28" class="kicker">03 · VALIDATION</text>
        <text x="16" y="55" class="body">count · MIME · bytes · duration · timestamps</text>
        <text x="16" y="74" class="tiny">decode every frame in memory; reject malformed input</text>
        <path d="M203 84V106" stroke="#91a9c4" stroke-width="2.5" marker-end="url(#arrow)"/>
        <rect y="114" width="406" height="102" rx="16" fill="#0b2035" stroke="#3b82f6"/>
        <text x="16" y="142" class="kicker" fill="#aacfff">04 · UNCHANGED FEATDISTILL</text>
        <text x="16" y="170" class="body">4 microbatches × 2 frames · one inference lock</text>
        <text x="16" y="195" class="small">same RGB transforms · same four experts · same score</text>
        <path d="M203 216V238" stroke="#91a9c4" stroke-width="2.5" marker-end="url(#arrow)"/>
        <rect y="246" width="406" height="104" rx="16" fill="#17240f" stroke="#84cc16"/>
        <text x="16" y="274" class="kicker" fill="#c8ec89">05 · ORDERED JSON REPORT</text>
        <text x="16" y="301" class="mono small">frame_scores[index, timestamp_ms, score]</text>
        <text x="16" y="327" class="mono small">mean · peak · peak time · count ≥ threshold</text>
      </g>
    </g>

    <g transform="translate(64 758)">
      <rect width="1312" height="82" rx="20" fill="#251d17" stroke="#fbbf24" stroke-opacity=".8"/>
      <text x="22" y="31" class="kicker" fill="#ffd978">INTERPRETATION BOUNDARY</text>
      <text x="22" y="57" class="body">No audio · no motion model · no scene detection · no calibrated “probability this video is AI-generated” · no application upload/result store</text>
    </g>
    <text x="1376" y="874" class="small" text-anchor="end">Source: current /try sampler, edge proxy, FastAPI frame endpoint, and unchanged infer/model.py</text>
  </g>
</svg>
