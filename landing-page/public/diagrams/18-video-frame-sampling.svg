<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag sampled-video analysis contract</title><desc id="desc">A short MP4 or WebM stays in the browser while eight uniform midpoint frames are decoded, center-cropped to lossless 384-pixel PNG files, and sent with timestamps to the FastAPI service. The service validates the frame batch, scores two frames at a time with the unchanged SynthFlag ensemble, and returns ordered frame scores plus descriptive mean, peak, and threshold-count summaries. Audio and motion are not analyzed.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#7991aa" stroke-opacity=".07" d="M40 0H0V40"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#f4f8ff" flood-opacity=".42" stdDeviation="16"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#91a9c4" d="M0 0L10 5L0 10Z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:15px;font-weight:750;letter-spacing:3px;fill:#65e6d2}.headline{font-size:44px;font-weight:740;letter-spacing:-1.2px;fill:#f5f9ff}.subtitle{font-size:18px;fill:#aabbd0}.kicker{font-size:12px;font-weight:800;letter-spacing:1.65px;fill:#8da5bf}.title{font-size:23px;font-weight:740;fill:#f4f8fd}.body{font-size:15px;fill:#b8c8da}.small{font-size:12px;fill:#91a6bd}.tiny{font-size:10px;fill:#849ab3}</style><style>text{fill:#111827}.eyebrow,.kicker{fill:#2448c2}.body,.small,.subtitle,.tiny{fill:#52627a}.headline,.title{fill:#111827}.mono{fill:#253651}</style></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><g class="sans"><text x="64" y="72" class="eyebrow">VIDEO CONTRACT · BROWSER-SAMPLED VISUAL EVIDENCE</text><text x="64" y="126" class="headline">The video stays local. Eight model-visible frames cross the boundary.</text><text x="64" y="164" class="subtitle">Uniform midpoint sampling is reproducible; every returned value remains an image-model score.</text><g filter="url(#shadow)" transform="translate(64 220)"><rect width="388" height="500" fill="#edf9f7" stroke="#2dd4bf" stroke-width="2" rx="28"/><rect width="146" height="31" x="22" y="22" fill="#edf9f7" rx="15"/><text x="95" y="42" fill="#bdf8ee" class="kicker" text-anchor="middle">BROWSER · LOCAL</text><text x="22" y="92" class="title">Decode + sample</text><text x="22" y="119" class="body">H.264 MP4 or supported WebM</text><text x="22" y="142" class="small">1–10 seconds · ≤50 MB · metadata checked</text><g transform="translate(22 176)"><rect width="344" height="72" fill="#f4f8ff" stroke="#2b5660" rx="16"/><text x="16" y="27" class="kicker">01 · MIDPOINT RULE</text><text x="16" y="54" class="mono body">tᵢ = duration × (i + 0.5) / 8</text><path stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arrow)" d="M172 72V94"/><rect width="344" height="92" y="102" fill="#f4f8ff" stroke="#2b5660" rx="16"/><text x="16" y="129" class="kicker">02 · MODEL-VISIBLE CROP</text><text x="16" y="157" class="body">center square → 384 × 384</text><text x="16" y="179" class="small">lossless PNG · one object URL per thumbnail</text></g><g transform="translate(22 400)"><rect width="344" height="70" fill="#edf9f7" stroke="#2dd4bf" rx="16"/><text x="16" y="27" fill="#8ff3e4" class="kicker">PRIVACY BOUNDARY</text><text x="16" y="51" class="body">Original video bytes are never submitted.</text></g></g><path stroke="#91a9c4" stroke-width="3" marker-end="url(#arrow)" d="M452 470H506"/><g filter="url(#shadow)" transform="translate(514 220)"><rect width="350" height="500" fill="#edf3ff" stroke="#647b95" stroke-width="2" rx="28"/><rect width="156" height="31" x="22" y="22" fill="#293e57" rx="15"/><text x="100" y="42" fill="#dce8f5" class="kicker" text-anchor="middle">REQUEST CONTRACT</text><text x="22" y="92" class="title">Bounded multipart payload</text><g transform="translate(22 126)"><rect width="306" height="164" fill="#f4f8ff" stroke="#3b536d" rx="18"/><text x="16" y="30" class="mono body">frames × 8</text><text x="16" y="57" class="small">PNG · ≤2 MB each · ≤16 MB total</text><text x="16" y="92" class="mono body">timestamps_ms</text><text x="16" y="119" class="small">strictly increasing · one per frame</text><text x="16" y="150" class="mono body">duration_ms</text></g><g transform="translate(22 316)"><rect width="306" height="70" fill="#edf3ff" stroke="#3b82f6" rx="16"/><text x="16" y="27" fill="#aacfff" class="kicker">DIRECT</text><text x="16" y="51" class="mono small">POST /v1/analyze-frames</text><rect width="306" height="70" y="88" fill="#edf3ff" stroke="#728096" rx="16"/><text x="16" y="115" fill="#c2cedb" class="kicker">SAME-ORIGIN</text><text x="16" y="139" class="mono small">POST /api/analyze-video</text></g></g><path stroke="#91a9c4" stroke-width="3" marker-end="url(#arrow)" d="M864 470H918"/><g filter="url(#shadow)" transform="translate(926 220)"><rect width="450" height="500" fill="#edf3ff" stroke="#3b536d" stroke-width="2" rx="28"/><rect width="166" height="31" x="22" y="22" fill="#edf3ff" rx="15"/><text x="105" y="42" fill="#dae7f4" class="kicker" text-anchor="middle">FASTAPI + MODEL</text><text x="22" y="92" class="title">Validate, microbatch, summarize</text><g transform="translate(22 126)"><rect width="406" height="84" fill="#f4f8ff" stroke="#344b65" rx="16"/><text x="16" y="28" class="kicker">03 · VALIDATION</text><text x="16" y="55" class="body">count · MIME · bytes · duration · timestamps</text><text x="16" y="74" class="tiny">decode every frame in memory; reject malformed input</text><path stroke="#91a9c4" stroke-width="2.5" marker-end="url(#arrow)" d="M203 84V106"/><rect width="406" height="102" y="114" fill="#edf3ff" stroke="#3b82f6" rx="16"/><text x="16" y="142" fill="#aacfff" class="kicker">04 · UNCHANGED MODEL</text><text x="16" y="170" class="body">4 microbatches × 2 frames · one inference lock</text><text x="16" y="195" class="small">same RGB transforms · same four experts · same score</text><path stroke="#91a9c4" stroke-width="2.5" marker-end="url(#arrow)" d="M203 216V238"/><rect width="406" height="104" y="246" fill="#fff" stroke="#84cc16" rx="16"/><text x="16" y="274" fill="#c8ec89" class="kicker">05 · ORDERED JSON REPORT</text><text x="16" y="301" class="mono small">frame_scores[index, timestamp_ms, score]</text><text x="16" y="327" class="mono small">mean · peak · peak time · count ≥ threshold</text></g></g><g transform="translate(64 758)"><rect width="1312" height="82" fill="#fff7e8" stroke="#fbbf24" stroke-opacity=".8" rx="20"/><text x="22" y="31" fill="#ffd978" class="kicker">INTERPRETATION BOUNDARY</text><text x="22" y="57" class="body">No audio · no motion model · no scene detection · no calibrated “probability this video is AI-generated” · no application upload/result store</text></g><text x="1376" y="874" class="small" text-anchor="end">Source: current /try sampler, edge proxy, FastAPI frame endpoint, and unchanged infer/model.py</text></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>