<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag executable tensor contract</title><desc id="desc">The Python tensor API accepts batches shaped B by 3 by H by W as unsigned 8-bit pixels or finite floating-point values from zero to one. It converts to RGB PIL images, builds CLIP and SigLIP batches, produces four B-length class-one probabilities, averages them, and returns B scores. The HTTP service uses B equals one and indexes one scalar.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#7890a9" stroke-opacity=".07" d="M40 0H0V40"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="11" flood-color="#f4f8ff" flood-opacity=".14" stdDeviation="15"/></filter><marker id="arr" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#8ba7c5" d="M0 0L10 5L0 10Z"/></marker><marker id="blue" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#60a5fa" d="M0 0L10 5L0 10Z"/></marker><marker id="amber" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#fbbf24" d="M0 0L10 5L0 10Z"/></marker><marker id="lime" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a3e635" d="M0 0L10 5L0 10Z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#65e6d2}.headline{font-size:44px;font-weight:740;letter-spacing:-1.2px;fill:#f5f9ff}.subtitle{font-size:18px;fill:#aabbd0}.label{font-size:12px;font-weight:800;letter-spacing:1.7px}.head{font-size:19px;font-weight:730;fill:#f4f8fd}.body{font-size:14px;fill:#b9c8da}.small{font-size:12px;fill:#90a6bf}.shape{font-size:16px;font-weight:750;fill:#f7fbff}.tiny{font-size:11px;fill:#869cb6}</style><style>text{fill:#111827}.eyebrow,.label{fill:#2448c2}.body,.small,.subtitle,.tiny{fill:#52627a}.head,.headline{fill:#111827}.mono{fill:#253651}</style></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><g class="sans"><text x="80" y="76" class="eyebrow">ENGINEERING CONTRACT · SHAPES, DTYPES, FAILURE GUARDS</text><text x="80" y="130" class="headline">A batch stays a batch until the service boundary</text><text x="80" y="168" class="subtitle">Every branch preserves B; the web API alone selects element zero from a one-image batch.</text><g filter="url(#shadow)" transform="translate(70 214)"><rect width="292" height="514" fill="#edf3ff" stroke="#395675" rx="25"/><text x="24" y="40" fill="#65e6d2" class="label">ENTRY CONTRACTS</text><g transform="translate(20 67)"><rect width="252" height="174" fill="#edf3ff" stroke="#4e7196" rx="18"/><text x="18" y="34" class="head">predict(tensor)</text><text x="18" y="64" class="mono shape">[B, 3, H, W]</text><text x="18" y="92" class="body">uint8 pixels</text><text x="18" y="116" class="body">or finite float in [0, 1]</text><text x="18" y="148" class="small">CPU conversion → PIL per item</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M146 250V279"/><g transform="translate(20 288)"><rect width="252" height="130" fill="#edf3ff" stroke="#60748e" rx="18"/><text x="18" y="34" class="head">predict_pil(sequence)</text><text x="18" y="64" class="body">B RGB-converted images</text><text x="18" y="88" class="body">mixed source sizes accepted</text><text x="18" y="111" class="small">empty sequence → output [0]</text></g><g transform="translate(20 438)"><rect width="252" height="54" fill="#f5f0ff" stroke="#ff7e79" stroke-opacity=".75" rx="14"/><text x="15" y="23" fill="#ff9b97" class="label">REJECT</text><text x="15" y="42" class="tiny">rank · channels · dtype · range · NaN/∞</text></g></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M362 471H402"/><g filter="url(#shadow)" transform="translate(410 214)"><rect width="688" height="514" fill="#f4f8ff" stroke="#314860" rx="25"/><text x="24" y="40" fill="#8fa6c0" class="label">TWO PREPROCESS + FOUR EXPERT LANES</text><g transform="translate(20 68)"><rect width="648" height="188" fill="#edf3ff" stroke="#2563eb" stroke-width="1.5" rx="21"/><rect width="8" height="188" fill="#60a5fa" rx="4"/><text x="24" y="32" fill="#79c5ff" class="label">CLIP · EXPERTS 1 + 2</text><g transform="translate(24 54)"><rect width="166" height="100" fill="#f4f8ff" stroke="#456d98" rx="15"/><text x="16" y="28" class="small">normalized batch</text><text x="16" y="57" class="mono shape">[B,3,224,224]</text><text x="16" y="80" class="tiny">float · target device</text></g><path stroke="#60a5fa" stroke-width="2" marker-end="url(#blue)" d="M200 104H231"/><g transform="translate(236 54)"><rect width="120" height="100" fill="#edf3ff" stroke="#60a5fa" rx="15"/><text x="14" y="28" class="small">image_embeds</text><text x="14" y="58" class="mono shape">[B, 768]</text><text x="14" y="81" class="tiny">per expert</text></g><path stroke="#60a5fa" stroke-width="2" marker-end="url(#blue)" d="M366 104H397"/><g transform="translate(402 54)"><rect width="104" height="100" fill="#edf3ff" stroke="#60a5fa" rx="15"/><text x="14" y="28" class="small">head logits</text><text x="14" y="58" class="mono shape">[B, 2]</text><text x="14" y="81" class="tiny">768→256→2</text></g><path stroke="#60a5fa" stroke-width="2" marker-end="url(#blue)" d="M516 104H547"/><g transform="translate(552 54)"><rect width="76" height="100" fill="#edf3ff" stroke="#60a5fa" rx="15"/><text x="38" y="28" class="small" text-anchor="middle">class 1</text><text x="38" y="58" class="mono shape" text-anchor="middle">P1 [B]</text><text x="38" y="81" class="mono tiny" text-anchor="middle">P2 [B]</text></g></g><g transform="translate(20 278)"><rect width="648" height="188" fill="#fff7e8" stroke="#f0a61d" stroke-width="1.5" rx="21"/><rect width="8" height="188" fill="#fbbf24" rx="4"/><text x="24" y="32" fill="#ffd36b" class="label">SIGLIP · EXPERTS 3 + 4</text><g transform="translate(24 54)"><rect width="166" height="100" fill="#fff7e8" stroke="#80642d" rx="15"/><text x="16" y="28" class="small">normalized batch</text><text x="16" y="57" class="mono shape">[B,3,384,384]</text><text x="16" y="80" class="tiny">float · target device</text></g><path stroke="#fbbf24" stroke-width="2" marker-end="url(#amber)" d="M200 104H231"/><g transform="translate(236 54)"><rect width="120" height="100" fill="#fff7e8" stroke="#fbbf24" rx="15"/><text x="14" y="28" class="small">pooler_output</text><text x="14" y="58" class="mono shape">[B,1152]</text><text x="14" y="81" class="tiny">per expert</text></g><path stroke="#fbbf24" stroke-width="2" marker-end="url(#amber)" d="M366 104H397"/><g transform="translate(402 54)"><rect width="104" height="100" fill="#fff7e8" stroke="#fbbf24" rx="15"/><text x="14" y="28" class="small">head logits</text><text x="14" y="58" class="mono shape">[B, 2]</text><text x="14" y="81" class="tiny">1152→256→2</text></g><path stroke="#fbbf24" stroke-width="2" marker-end="url(#amber)" d="M516 104H547"/><g transform="translate(552 54)"><rect width="76" height="100" fill="#fff7e8" stroke="#fbbf24" rx="15"/><text x="38" y="28" class="small" text-anchor="middle">class 1</text><text x="38" y="58" class="mono shape" text-anchor="middle">P3 [B]</text><text x="38" y="81" class="mono tiny" text-anchor="middle">P4 [B]</text></g></g></g><path stroke="#a3e635" stroke-width="2.4" marker-end="url(#lime)" d="M1098 471H1134"/><g filter="url(#shadow)" transform="translate(1142 264)"><rect width="228" height="402" fill="#edf9f7" stroke="#a3e635" stroke-width="1.5" rx="25"/><text x="22" y="40" fill="#b7f66e" class="label">FUSION + RETURN</text><text x="22" y="82" class="head">Float softmax</text><text x="22" y="108" class="body">logits cast to float</text><text x="22" y="130" class="body">before class-1 softmax</text><rect width="188" height="72" x="20" y="155" fill="#edf9f7" stroke="#5f8738" rx="15"/><text x="114" y="185" class="mono shape" text-anchor="middle">(P3+P4+P1+P2)/4</text><text x="114" y="210" class="mono small" text-anchor="middle">→ scores [B]</text><text x="22" y="263" fill="#91aa9d" class="label">PYTHON API</text><text x="22" y="290" class="mono shape">returns [B]</text><line x1="22" x2="206" y1="316" y2="316" stroke="#416252"/><text x="22" y="347" fill="#91aa9d" class="label">HTTP · B=1 IMAGE / B≤2 FRAME MICRO-BATCH</text><text x="22" y="378" class="mono shape">scores.cpu()[0]</text><text x="22" y="398" class="tiny">scalar JSON score</text></g><g transform="translate(70 765)"><rect width="1300" height="72" fill="#f4f8ff" stroke="#344b64" rx="18"/><text x="24" y="28" fill="#ff9b97" class="label">OUTPUT GUARD</text><text x="24" y="53" class="body">Return must be rank 1, length B, and finite. CLI writes one scalar row per image; CUDA autocast is optional.</text><text x="1274" y="43" fill="#b7f66e" class="mono shape" text-anchor="end">[B] → scalar only at web boundary</text></g></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>