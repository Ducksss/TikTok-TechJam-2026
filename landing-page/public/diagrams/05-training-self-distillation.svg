<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">Two-stage training with feature-level self-distillation</title><desc id="desc">Stage 1 trains each expert for two epochs with a binary real-versus-generated objective. The epoch-2 checkpoint provides fixed intermediate feature targets for Stage 2, where current representations receive dense feature-alignment supervision together with binary supervision. This process is training-only.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><linearGradient id="stage2" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#edf3ff"/><stop offset="1" stop-color="#edf3ff"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="10" flood-color="#f4f8ff" flood-opacity=".5" stdDeviation="18"/></filter><marker id="arrow" markerHeight="11" markerWidth="11" orient="auto" refX="9" refY="5.5"><path fill="#92a6be" d="M0 0L11 5.5L0 11Z"/></marker><marker id="arrowV" markerHeight="11" markerWidth="11" orient="auto" refX="9" refY="5.5"><path fill="#a78bfa" d="M0 0L11 5.5L0 11Z"/></marker><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path fill="none" stroke="#87a0bf" stroke-opacity=".055" d="M36 0H0V36"/></pattern><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}.kicker{font-size:15px;font-weight:700;letter-spacing:2.6px;fill:#8fa4be}.title{font-size:38px;font-weight:730;fill:#f5f8fc;letter-spacing:-.6px}.sub{font-size:17px;fill:#a9bbcf}.label{font-size:13px;font-weight:750;letter-spacing:1.4px}.head{font-size:22px;font-weight:720;fill:#f4f7fc}.body{font-size:15px;fill:#b2c2d4}.mini{font-size:13px;fill:#9fb0c5}.eq{font-size:18px;font-weight:680;fill:#f6f8ff}</style><style>text{fill:#111827}.kicker,.label{fill:#2448c2}.body,.mini,.sub{fill:#52627a}.eq,.head,.title{fill:#111827}</style></defs><rect width="1440" height="900" fill="url(#bg)" rx="32"/><rect width="1440" height="900" fill="url(#grid)" rx="32"/><rect width="1368" height="828" x="36" y="36" fill="none" stroke="#8ba2bd" stroke-opacity=".16" rx="26"/><text x="80" y="94" class="kicker">PAPER FACT · TRAINING PARADIGM</text><text x="80" y="143" class="title">Learn the task, then stabilize the features.</text><text x="80" y="178" class="sub">The epoch-2 model becomes a fixed reference while the current model continues learning.</text><g transform="translate(1170 78)"><rect width="186" height="48" fill="#edf3ff" stroke="#8c72ff" rx="24"/><circle cx="24" cy="24" r="6" fill="#a78bfa"/><text x="42" y="29" fill="#eeeaff" font-size="14" font-weight="750">TRAINING ONLY</text></g><g filter="url(#shadow)" transform="translate(80 230)"><rect width="430" height="518" fill="#edf3ff" stroke="#3c87bd" rx="26"/><rect width="430" height="7" x="0" y="0" fill="#56b9ff" rx="3.5"/><text x="28" y="49" fill="#70c7ff" class="label">STAGE 1 · INITIAL TRAINING</text><text x="28" y="88" class="head">Binary task foundation</text><text x="28" y="119" class="body">Each expert is trained for exactly two epochs.</text><g transform="translate(28 158)"><rect width="374" height="84" fill="#f4f8ff" stroke="#334b65" rx="17"/><rect width="48" height="48" x="18" y="19" fill="#edf3ff" stroke="#56b9ff" rx="13"/><path fill="none" stroke="#56b9ff" stroke-width="2" d="M30 52l10-12 8 8 7-9"/><circle cx="54" cy="32" r="4" fill="#ffbd5c"/><text x="84" y="36" class="eq">Training image + binary label</text><text x="84" y="61" class="mini">real (0) or generated (1)</text></g><path stroke="#92a6be" stroke-width="2" marker-end="url(#arrow)" d="M215 252V286"/><g transform="translate(28 294)"><rect width="374" height="88" fill="#edf3ff" stroke="#56b9ff" rx="17"/><text x="20" y="34" class="eq">Expert parameters update</text><text x="20" y="61" class="mini">standard binary objective · epoch 1 → epoch 2</text></g><path stroke="#92a6be" stroke-width="2" marker-end="url(#arrow)" d="M215 392V426"/><g transform="translate(28 434)"><rect width="374" height="58" fill="#edf3ff" stroke="#7695b8" rx="17"/><text x="20" y="36" class="eq">Epoch-2 checkpoint</text><rect width="59" height="34" x="295" y="12" fill="#edf3ff" rx="17"/><text x="324" y="34" fill="#d4e4f6" font-size="12" font-weight="750" text-anchor="middle">SNAPSHOT</text></g></g><path fill="none" stroke="#a78bfa" stroke-width="3" marker-end="url(#arrowV)" d="M510 489H582"/><g filter="url(#shadow)" transform="translate(586 230)"><rect width="770" height="518" fill="url(#stage2)" stroke="#8c72ff" rx="26"/><rect width="770" height="7" x="0" y="0" fill="#a78bfa" rx="3.5"/><text x="28" y="49" fill="#b7a7ff" class="label">STAGE 2 · FEATURE-LEVEL SELF-DISTILLATION</text><text x="28" y="88" class="head">Dense supervision from a fixed self</text><text x="28" y="119" class="body">The same input travels through a fixed reference and the current trainable model.</text><g transform="translate(28 158)"><rect width="214" height="88" fill="#edf3ff" stroke="#60738e" rx="17"/><text x="20" y="35" class="eq">Same training image</text><text x="20" y="62" class="mini">shared input to both paths</text></g><path stroke="#92a6be" stroke-width="2" d="M242 202H288"/><path stroke="#92a6be" stroke-width="2" marker-end="url(#arrow)" d="M288 202V166H340"/><path stroke="#92a6be" stroke-width="2" marker-end="url(#arrow)" d="M288 202V316H340"/><g transform="translate(344 130)"><rect width="268" height="100" fill="#edf3ff" stroke="#9aaac0" stroke-dasharray="6 5" rx="17"/><text x="20" y="33" fill="#c5d0de" class="label">FIXED REFERENCE</text><text x="20" y="63" class="eq">Epoch-2 feature maps</text><text x="20" y="86" class="mini">targets only · no parameter updates</text></g><g transform="translate(344 280)"><rect width="268" height="100" fill="#edf3ff" stroke="#a78bfa" rx="17"/><text x="20" y="33" fill="#c1b2ff" class="label">CURRENT MODEL</text><text x="20" y="63" class="eq">Current feature maps</text><text x="20" y="86" class="mini">trainable representations</text></g><path fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowV)" d="M612 180H668V246"/><path fill="none" stroke="#a78bfa" stroke-width="2" marker-end="url(#arrowV)" d="M612 330H668V274"/><g transform="translate(628 246)"><circle cx="40" cy="14" r="39" fill="#edf3ff" stroke="#a78bfa"/><text x="40" y="10" fill="#d8ceff" font-size="12" font-weight="740" text-anchor="middle">DENSE</text><text x="40" y="28" fill="#d8ceff" font-size="12" font-weight="740" text-anchor="middle">ALIGN</text></g><g transform="translate(28 416)"><rect width="714" height="72" fill="#f4f8ff" stroke="#4b426f" rx="17"/><circle cx="29" cy="36" r="8" fill="#56b9ff"/><text x="50" y="32" class="eq">Binary supervision</text><text x="50" y="54" class="mini">keeps the real-vs-generated task grounded</text><text x="346" y="42" fill="#71829a" font-size="26" font-weight="500">+</text><circle cx="391" cy="36" r="8" fill="#a78bfa"/><text x="412" y="32" class="eq">Dense feature alignment</text><text x="412" y="54" class="mini">regularizes current representations</text></g></g><g transform="translate(520 428)"><rect width="132" height="44" fill="#edf3ff" stroke="#8c72ff" rx="22"/><text x="66" y="28" fill="#d8ceff" font-size="11" font-weight="760" text-anchor="middle">FIXED TARGET</text></g><g transform="translate(80 780)"><rect width="1276" height="56" fill="#edf3ff" stroke="#38485f" rx="18"/><text x="24" y="35" fill="#a78bfa" class="label">BOUNDARY</text><text x="126" y="35" class="body">The paper specifies alignment with dense epoch-2 features, but does not name a particular alignment-loss formula.</text><text x="1248" y="35" fill="#b7f66e" class="label" text-anchor="end">NOT USED AT INFERENCE</text></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>