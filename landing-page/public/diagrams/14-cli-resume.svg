<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag command-line resumability and durable output protocol</title><desc id="desc">The CLI discovers supported images recursively in sorted order, verifies checkpoints, builds run metadata, acquires an exclusive output lock, refuses incompatible prior output, skips completed relative-path resume keys, performs batched inference, and periodically appends CSV rows with flush and fsync. Metadata is written atomically. After a process crash, fsynced rows are revalidated while unflushed images may be reprocessed; a hard crash may leave a stale lock.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#7890a9" stroke-opacity=".07" d="M40 0H0V40"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="11" flood-color="#f4f8ff" flood-opacity=".14" stdDeviation="15"/></filter><marker id="arr" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#8ba7c5" d="M0 0L10 5L0 10Z"/></marker><marker id="teal" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2dd4bf" d="M0 0L10 5L0 10Z"/></marker><marker id="coral" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#ff7e79" d="M0 0L10 5L0 10Z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#65e6d2}.headline{font-size:44px;font-weight:740;letter-spacing:-1.2px;fill:#f5f9ff}.subtitle{font-size:18px;fill:#aabbd0}.label{font-size:12px;font-weight:800;letter-spacing:1.65px}.head{font-size:17px;font-weight:730;fill:#f4f8fd}.body{font-size:13px;fill:#b8c7d8}.small{font-size:11px;fill:#91a6bd}.tiny{font-size:10px;fill:#849ab3}.code,.num{font-size:12px}.num{font-weight:800;fill:#f4f8ff}.code{font-weight:700;fill:#d7e7f6}</style><style>text,tspan{fill:#111827}.eyebrow,.label{fill:#2448c2}.body,.small,.subtitle,.tiny{fill:#52627a}.head,.headline{fill:#111827}.code,.mono,.num{fill:#253651}</style></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><g class="sans"><text x="80" y="76" class="eyebrow">BATCH CLI · RESUME IDENTITY · DURABLE CHECKPOINTING</text><text x="80" y="130" class="headline">Persist progress, refuse ambiguous history</text><text x="80" y="168" class="subtitle">A run resumes only when metadata and CSV state are structurally compatible with the current invocation.</text><g filter="url(#shadow)" transform="translate(70 222)"><rect width="252" height="150" fill="#edf3ff" stroke="#446381" rx="21"/><circle cx="25" cy="25" r="14" fill="#65e6d2"/><text x="25" y="30" class="num" text-anchor="middle">1</text><text x="48" y="31" fill="#65e6d2" class="label">DISCOVER</text><text x="20" y="67" class="head">Recursive + sorted</text><text x="20" y="92" class="body">JPEG · PNG · BMP · WebP · TIFF</text><text x="20" y="117" class="mono code">relative/path.ext</text><text x="20" y="137" class="small">error if directory empty / missing</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M322 297H348"/><g filter="url(#shadow)" transform="translate(356 222)"><rect width="252" height="150" fill="#edf3ff" stroke="#60738a" rx="21"/><circle cx="25" cy="25" r="14" fill="#65e6d2"/><text x="25" y="30" class="num" text-anchor="middle">2</text><text x="48" y="31" fill="#65e6d2" class="label">PREFLIGHT</text><text x="20" y="67" class="head">Resolve + verify</text><text x="20" y="92" class="body">device · CUDA autocast · checkpoints</text><text x="20" y="117" class="body">size + SHA-256 before deserialize</text><text x="20" y="137" class="small">skip hash only when explicitly requested</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M608 297H634"/><g filter="url(#shadow)" transform="translate(642 222)"><rect width="252" height="150" fill="#edf3ff" stroke="#60738a" rx="21"/><circle cx="25" cy="25" r="14" fill="#65e6d2"/><text x="25" y="30" class="num" text-anchor="middle">3</text><text x="48" y="31" fill="#65e6d2" class="label">IDENTIFY RUN</text><text x="20" y="67" class="head">Build metadata v2</text><text x="20" y="92" class="body">input root · checkpoint identity</text><text x="20" y="115" class="body">runtime · device · AMP · batch size</text><text x="20" y="137" class="small">protocol + preprocessing + score definition</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M894 297H920"/><g filter="url(#shadow)" transform="translate(928 222)"><rect width="202" height="150" fill="#edf3ff" stroke="#8c72ff" rx="21"/><circle cx="25" cy="25" r="14" fill="#a78bfa"/><text x="25" y="30" class="num" text-anchor="middle">4</text><text x="48" y="31" fill="#b8a8ff" class="label">LOCK</text><text x="20" y="67" class="head">Exclusive create</text><text x="20" y="94" class="mono code">.inference.lock</text><text x="20" y="118" class="body">stores current PID</text><text x="20" y="138" class="small">existing lock → refuse</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M1130 297H1156"/><g filter="url(#shadow)" transform="translate(1164 222)"><rect width="206" height="150" fill="#edf9f7" stroke="#2dd4bf" rx="21"/><circle cx="25" cy="25" r="14" fill="#2dd4bf"/><text x="25" y="30" class="num" text-anchor="middle">5</text><text x="48" y="31" fill="#65e6d2" class="label">MATCH</text><text x="20" y="67" class="head">Prepare output</text><text x="20" y="92" class="body">metadata equal?</text><text x="20" y="115" class="body">CSV structurally valid?</text><text x="20" y="138" class="small">load completed names</text></g><g filter="url(#shadow)" transform="translate(70 405)"><rect width="432" height="168" fill="#f5f0ff" stroke="#ff7e79" rx="22"/><text x="22" y="36" fill="#ff9b97" class="label">REFUSE AMBIGUOUS OUTPUT</text><circle cx="27" cy="72" r="4" fill="#ff7e79"/><text x="42" y="77" class="body">metadata JSON invalid or not exactly equal</text><circle cx="27" cy="102" r="4" fill="#ff7e79"/><text x="42" y="107" class="body">CSV exists without matching metadata</text><circle cx="27" cy="132" r="4" fill="#ff7e79"/><text x="42" y="137" class="body">bad header · extra columns · duplicate name</text><text x="22" y="158" class="small">invalid / nonfinite / out-of-range score also refuses resume</text></g><path fill="none" stroke="#2dd4bf" stroke-width="2.2" marker-end="url(#teal)" d="M1164 372V394H934V425"/><g filter="url(#shadow)" transform="translate(526 405)"><rect width="844" height="168" fill="#f4f8ff" stroke="#3f607c" rx="22"/><text x="22" y="36" fill="#65e6d2" class="label">VALID RESUME PATH</text><g transform="translate(22 58)"><rect width="190" height="78" fill="#edf3ff" stroke="#4b708e" rx="15"/><text x="15" y="28" class="head">Remaining paths</text><text x="15" y="52" class="body">all sorted paths − processed</text><text x="15" y="69" class="tiny">POSIX-relative resume key</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M222 97H253"/><g transform="translate(260 58)"><rect width="180" height="78" fill="#edf3ff" stroke="#4b708e" rx="15"/><text x="15" y="28" class="head">Restore model</text><text x="15" y="52" class="body">no second full hash pass</text><text x="15" y="69" class="tiny">preflight already completed</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M450 97H481"/><g transform="translate(488 58)"><rect width="160" height="78" fill="#edf3ff" stroke="#4b708e" rx="15"/><text x="15" y="28" class="head">Atomic metadata</text><text x="15" y="52" class="mono small">.partial → replace</text><text x="15" y="69" class="tiny">only when absent</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M658 97H689"/><g transform="translate(696 58)"><rect width="126" height="78" fill="#fff" stroke="#a3e635" rx="15"/><text x="63" y="28" class="head" text-anchor="middle">Batch loop</text><text x="63" y="52" class="mono small" text-anchor="middle">size B</text><text x="63" y="69" class="tiny" text-anchor="middle">or done</text></g></g><g filter="url(#shadow)" transform="translate(70 610)"><rect width="900" height="202" fill="#f4f8ff" stroke="#3e5c79" rx="24"/><text x="22" y="38" fill="#8fa6c0" class="label">BATCH EXECUTION + DURABILITY</text><g transform="translate(22 64)"><rect width="154" height="98" fill="#edf3ff" stroke="#4c6e8e" rx="16"/><text x="15" y="29" class="head">Decode RGB</text><text x="15" y="53" class="body">whole batch</text><text x="15" y="78" class="small">failure stops run</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M176 113H208"/><g transform="translate(216 64)"><rect width="154" height="98" fill="#edf3ff" stroke="#4c6e8e" rx="16"/><text x="15" y="29" class="head">Predict [B]</text><text x="15" y="53" class="body">length + finite</text><text x="15" y="78" class="small">validated</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M370 113H402"/><g transform="translate(410 64)"><rect width="154" height="98" fill="#edf3ff" stroke="#4c6e8e" rx="16"/><text x="15" y="29" class="head">Buffer rows</text><text x="15" y="53" class="mono small">image_name,score</text><text x="15" y="78" class="small">relative path</text></g><path stroke="#8ba7c5" stroke-width="2" marker-end="url(#arr)" d="M564 113H596"/><g transform="translate(604 64)"><rect width="252" height="98" fill="#edf9f7" stroke="#2dd4bf" rx="16"/><text x="15" y="29" class="head">When buffer ≥ save_every</text><text x="15" y="53" class="body">append CSV → flush → fsync</text><text x="15" y="78" class="small">final buffer also appended</text></g><path fill="none" stroke="#2dd4bf" stroke-dasharray="6 5" stroke-width="1.8" marker-end="url(#teal)" d="M730 162V181H293V166"/></g><g filter="url(#shadow)" transform="translate(994 610)"><rect width="376" height="202" fill="#eef3fb" stroke="#ff7e79" rx="24"/><text x="22" y="38" fill="#ff9b97" class="label">CRASH / RESTART</text><circle cx="29" cy="76" r="5" fill="#a3e635"/><text x="45" y="74" class="small"><tspan x="45">fsynced rows are intended to survive</tspan><tspan x="45" dy="16">a process crash</tspan></text><circle cx="29" cy="112" r="5" fill="#fbbf24"/><text x="45" y="117" class="body">unflushed images may be reprocessed</text><text x="45" y="138" class="small">existing CSV is revalidated on restart</text><circle cx="29" cy="160" r="5" fill="#ff7e79"/><text x="45" y="165" class="body">hard crash may leave stale lock</text><text x="22" y="190" class="small">verify process stopped before removing it</text></g><g><text x="0" y="0" class="small" transform="translate(70 838)">Normal exit removes the lock; --overwrite resets history. Relative filenames are resume keys; image content is not hashed.</text><text x="1300" y="0" fill="#b7f66e" class="label" text-anchor="end" transform="translate(70 838)">MATCHING RECORDED METADATA</text></g></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>