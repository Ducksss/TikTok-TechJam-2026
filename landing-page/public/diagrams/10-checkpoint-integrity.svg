<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag checkpoint integrity and restoration gates</title><desc id="desc">Before loading, SynthFlag requires four named checkpoint files and by default validates a schema-version-one manifest, positive byte sizes, and 64-character SHA-256 hashes against the files. It then uses weights-only CPU deserialization, accepts only nonempty string-to-tensor state dictionaries, requires a strict architecture match, moves each expert to the selected device, and sets evaluation mode. These checks establish integrity relative to the local manifest, not publisher authentication or licensing.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#7891aa" stroke-opacity=".065" d="M40 0H0V40"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="11" flood-color="#f4f8ff" flood-opacity=".44" stdDeviation="15"/></filter><marker id="arr" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#93abc4" d="M0 0L10 5L0 10Z"/></marker><marker id="green" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a3e635" d="M0 0L10 5L0 10Z"/></marker><marker id="red" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#fb7185" d="M0 0L10 5L0 10Z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:15px;font-weight:750;letter-spacing:3px;fill:#65e6d2}.headline{font-size:45px;font-weight:740;letter-spacing:-1.2px;fill:#f5f9ff}.subtitle{font-size:18px;fill:#aabbd0}.kicker{font-size:12px;font-weight:800;letter-spacing:1.5px;fill:#8da5bf}.title{font-size:19px;font-weight:740;fill:#f3f8fd}.body{font-size:13px;fill:#b8c8da}.monoText,.small{font-size:11px}.small{fill:#8fa5bd}.monoText{fill:#dce8f5}.num{font-size:13px;font-weight:800;fill:#f4f8ff}</style><style>text{fill:#111827}.eyebrow,.kicker{fill:#2448c2}.body,.small,.subtitle{fill:#52627a}.headline,.title{fill:#111827}.mono,.monoText,.num{fill:#253651}</style></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><g class="sans"><text x="64" y="70" class="eyebrow">CHECKPOINT INTEGRITY PATH · FAIL-CLOSED GATES</text><text x="64" y="125" class="headline">Verify the bytes, then verify the architecture.</text><text x="64" y="161" class="subtitle">All four experts must pass every enabled gate before the ensemble becomes resident.</text><g filter="url(#shadow)" transform="translate(1094 54)"><rect width="282" height="114" fill="#fff5f6" stroke="#e2763e" rx="19"/><text x="18" y="27" fill="#ffbb94" class="kicker">IMPORTANT DISTINCTION</text><text x="18" y="53" class="title" font-size="16">Integrity ≠ authentication</text><text x="18" y="78" class="small">A local manifest match does not prove</text><text x="18" y="96" class="small">publisher identity, provenance, or license rights.</text></g><text x="64" y="222" class="kicker">PHASE A · FILE AND MANIFEST PREFLIGHT</text><g filter="url(#shadow)" transform="translate(64 246)"><rect width="278" height="212" fill="#edf3ff" stroke="#526a83" rx="22"/><rect width="32" height="32" x="18" y="18" fill="#91a9c4" rx="9"/><text x="34" y="40" class="num" text-anchor="middle">01</text><text x="62" y="42" class="kicker">REQUIRE FILES</text><text x="18" y="78" class="title">Weights directory + four files</text><g><text y="0" class="mono monoText" transform="translate(18 98)">Expert_1_clip.pth</text><text y="23" class="mono monoText" transform="translate(18 98)">Expert_2_clip.pth</text><text y="46" class="mono monoText" transform="translate(18 98)">Expert_3_siglip.pth</text><text y="69" class="mono monoText" transform="translate(18 98)">Expert_4_siglip.pth</text></g><text x="18" y="192" class="small">Missing directory/file → stop before load</text></g><path stroke="#93abc4" stroke-width="3" marker-end="url(#arr)" d="M342 352H378"/><g filter="url(#shadow)" transform="translate(392 246)"><rect width="278" height="212" fill="#fff7e8" stroke="#d97706" rx="22"/><rect width="32" height="32" x="18" y="18" fill="#fbbf24" rx="9"/><text x="34" y="40" class="num" text-anchor="middle">02</text><text x="62" y="42" fill="#f2d28c" class="kicker">PARSE MANIFEST</text><text x="18" y="78" class="title">manifest.json</text><text x="18" y="106" class="mono monoText">schema_version == 1</text><text x="18" y="129" class="mono monoText">files is an object</text><text x="18" y="158" class="body">Each required name must map</text><text x="18" y="178" class="body">to a valid entry.</text><text x="18" y="198" class="small">Missing/invalid/unsupported → stop</text></g><path stroke="#93abc4" stroke-width="3" marker-end="url(#arr)" d="M670 352H706"/><g filter="url(#shadow)" transform="translate(720 246)"><rect width="278" height="212" fill="#fff7e8" stroke="#d97706" rx="22"/><rect width="32" height="32" x="18" y="18" fill="#fbbf24" rx="9"/><text x="34" y="40" class="num" text-anchor="middle">03</text><text x="62" y="42" fill="#f2d28c" class="kicker">VALIDATE ENTRY</text><text x="18" y="78" class="title">Expected identity fields</text><text x="18" y="108" class="mono monoText">size_bytes: positive integer</text><text x="18" y="132" class="mono monoText">sha256: lowercase-normalized · 64 hex</text><line x1="18" x2="260" y1="151" y2="151" stroke="#60491f"/><text x="18" y="176" class="body">Metadata shape is checked</text><text x="18" y="197" class="body">before hashing file contents.</text></g><path stroke="#93abc4" stroke-width="3" marker-end="url(#arr)" d="M998 352H1034"/><g filter="url(#shadow)" transform="translate(1048 246)"><rect width="328" height="212" fill="#fff" stroke="#84cc16" rx="22"/><rect width="32" height="32" x="18" y="18" fill="#a3e635" rx="9"/><text x="34" y="40" class="num" text-anchor="middle">04</text><text x="62" y="42" fill="#d9f3a5" class="kicker">COMPARE BYTES</text><text x="18" y="78" class="title">Size, then SHA-256</text><text x="18" y="107" class="body">actual file size = expected size</text><text x="18" y="132" class="body">stream SHA-256 in 8 MiB chunks</text><text x="18" y="157" class="body">actual digest = expected digest</text><g transform="translate(18 177)"><circle cx="7" cy="7" r="7" fill="#a3e635"/><path fill="none" stroke="#fff" stroke-width="2" d="M3 7l3 3 5-6"/><text x="22" y="11" fill="#dff7ac" class="small">all four pass → deserialize</text></g></g><path fill="none" stroke="#fbbf24" stroke-dasharray="7 7" stroke-width="2" marker-end="url(#arr)" d="M342 438H362V648H342"/><rect width="514" height="30" x="504" y="469" fill="#fff7e8" rx="15"/><text x="761" y="489" fill="#f4d28b" class="small" text-anchor="middle">Explicit skip-hash mode bypasses manifest size/SHA checks—not the four-file requirement.</text><text x="64" y="536" class="kicker">PHASE B · RESTRICTED RESTORATION OF EACH EXPERT</text><g filter="url(#shadow)" transform="translate(64 560)"><rect width="278" height="176" fill="#edf3ff" stroke="#3b82f6" rx="22"/><rect width="32" height="32" x="18" y="18" fill="#60a5fa" rx="9"/><text x="34" y="40" class="num" text-anchor="middle">05</text><text x="62" y="42" fill="#cce3ff" class="kicker">DESERIALIZE</text><text x="18" y="78" class="title">Weights-only torch.load</text><text x="18" y="108" class="mono monoText">map_location = &quot;cpu&quot;</text><text x="18" y="132" class="mono monoText">weights_only = True</text><text x="18" y="156" class="small">Optional model_state_dict wrapper is unwrapped.</text></g><path stroke="#93abc4" stroke-width="3" marker-end="url(#arr)" d="M342 648H378"/><g filter="url(#shadow)" transform="translate(392 560)"><rect width="278" height="176" fill="#edf3ff" stroke="#3b82f6" rx="22"/><rect width="32" height="32" x="18" y="18" fill="#60a5fa" rx="9"/><text x="34" y="40" class="num" text-anchor="middle">06</text><text x="62" y="42" fill="#cce3ff" class="kicker">TYPE GATE</text><text x="18" y="78" class="title">Tensor-only state dict</text><text x="18" y="108" class="body">non-empty Mapping</text><text x="18" y="132" class="body">every key is a string</text><text x="18" y="156" class="body">every value is a Tensor</text></g><path stroke="#93abc4" stroke-width="3" marker-end="url(#arr)" d="M670 648H706"/><g filter="url(#shadow)" transform="translate(720 560)"><rect width="278" height="176" fill="#edf3ff" stroke="#3b82f6" rx="22"/><rect width="32" height="32" x="18" y="18" fill="#60a5fa" rx="9"/><text x="34" y="40" class="num" text-anchor="middle">07</text><text x="62" y="42" fill="#cce3ff" class="kicker">ARCHITECTURE GATE</text><text x="18" y="78" class="title">Exact parameter match</text><text x="18" y="110" class="mono monoText">load_state_dict(</text><text x="18" y="131" class="mono monoText">strict=True, assign=True)</text><text x="18" y="156" class="small">Missing/extra/mismatched parameters → stop</text></g><path stroke="#a3e635" stroke-width="3" marker-end="url(#green)" d="M998 648H1034"/><g filter="url(#shadow)" transform="translate(1048 560)"><rect width="328" height="176" fill="#fff" stroke="#84cc16" stroke-width="2" rx="22"/><rect width="32" height="32" x="18" y="18" fill="#a3e635" rx="9"/><text x="34" y="40" class="num" text-anchor="middle">08</text><text x="62" y="42" fill="#d9f3a5" class="kicker">RESTORE EXPERT</text><text x="18" y="78" class="title">Move to device · eval()</text><text x="18" y="108" class="body">state dict released after strict load</text><text x="18" y="132" class="body">expert is set to evaluation mode</text><text x="18" y="156" class="small">repeat for CLIP 1–2 and SigLIP 3–4</text></g><g transform="translate(64 776)"><rect width="1312" height="72" fill="#fff5f6" stroke="#be4056" rx="18"/><circle cx="28" cy="36" r="11" fill="#fb7185"/><path stroke="#fff5f6" stroke-width="2.5" d="M23 31l10 10m0-10L23 41"/><text x="52" y="29" fill="#ffb2bf" class="kicker">ANY FAILED GATE ABORTS RESTORATION</text><text x="52" y="52" class="body">No partial ensemble is served: missing files, malformed manifest metadata, size/hash mismatch, invalid state dict, or architecture mismatch raises an error.</text></g><path fill="none" stroke="#fb7185" stroke-dasharray="5 7" stroke-width="1.8" marker-end="url(#red)" d="M203 458V500H44V812H64"/><path stroke="#fb7185" stroke-dasharray="5 7" stroke-width="1.8" marker-end="url(#red)" d="M531 458V776"/><path stroke="#fb7185" stroke-dasharray="5 7" stroke-width="1.8" marker-end="url(#red)" d="M859 458V776"/><path fill="none" stroke="#fb7185" stroke-dasharray="5 7" stroke-width="1.8" marker-end="url(#red)" d="M1212 458H1394V812H1376"/><path stroke="#fb7185" stroke-dasharray="5 7" stroke-width="1.8" marker-end="url(#red)" d="M203 736V776"/><path stroke="#fb7185" stroke-dasharray="5 7" stroke-width="1.8" marker-end="url(#red)" d="M531 736V776"/><path stroke="#fb7185" stroke-dasharray="5 7" stroke-width="1.8" marker-end="url(#red)" d="M859 736V776"/><text x="1376" y="878" class="small" text-anchor="end">Default service behavior verifies hashes unless explicitly disabled for trusted local checkpoints.</text></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>