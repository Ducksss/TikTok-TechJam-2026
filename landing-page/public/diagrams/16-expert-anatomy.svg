<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1350" viewBox="0 0 1920 1350" role="img" aria-labelledby="title desc">
  <title id="title">CLIP and SigLIP expert anatomy in the released SynthFlag ensemble</title>
  <desc id="desc">A detailed comparison of CLIP and SigLIP patch embeddings, token tensors, repeated pre-layer-normalized transformer blocks with query, key, value projections, multi-head attention, residual paths, MLP layers, family-specific pooling, binary classifier heads, and float32 class-one softmax outputs.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#15243a"/></pattern>
    <linearGradient id="clipBg" x1="0" x2="1"><stop stop-color="#0b244a"/><stop offset="1" stop-color="#091728"/></linearGradient>
    <linearGradient id="sigBg" x1="0" x2="1"><stop stop-color="#35250a"/><stop offset="1" stop-color="#131826"/></linearGradient>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#8194b2"/></marker>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#65a9ff"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#f3b849"/></marker>
    <style>
      .title{font:700 40px ui-sans-serif,system-ui,sans-serif;fill:#f4f8ff;letter-spacing:-1.2px}.subtitle{font:400 17px ui-sans-serif,system-ui,sans-serif;fill:#92a4c1}.kicker{font:700 13px ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:1.7px}.lane{font:700 27px ui-sans-serif,system-ui,sans-serif;fill:#f3f7ff}.boxTitle{font:700 16px ui-sans-serif,system-ui,sans-serif;fill:#edf4ff}.body{font:400 14px ui-sans-serif,system-ui,sans-serif;fill:#aebbd0}.small{font:400 12px ui-sans-serif,system-ui,sans-serif;fill:#8295b3}.mono{font:600 13px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#d9e6fa}.mini{font:700 11px ui-monospace,SFMono-Regular,Consolas,monospace;fill:#8da2c2;letter-spacing:.6px}.clip{fill:#0d284f;stroke:#4d8fe8;stroke-width:1.5}.sig{fill:#39290e;stroke:#bd8524;stroke-width:1.5}.neutral{fill:#0c1728;stroke:#344661;stroke-width:1.5}.clipLine{fill:none;stroke:#65a9ff;stroke-width:2;marker-end:url(#ac)}.sigLine{fill:none;stroke:#f3b849;stroke-width:2;marker-end:url(#as)}.thin{fill:none;stroke:#8194b2;stroke-width:1.6;marker-end:url(#a)}.resClip{fill:none;stroke:#76b6ff;stroke-width:1.5;stroke-dasharray:5 5}.resSig{fill:none;stroke:#ffd173;stroke-width:1.5;stroke-dasharray:5 5}
    </style>
  </defs>

  <rect width="1920" height="1350" fill="#07111f"/><rect width="1920" height="1350" fill="url(#grid)" opacity=".48"/>
  <text x="60" y="66" class="kicker" fill="#52dfc9">FIGURE 16 · BACKBONE + HEAD ANATOMY · PINNED TRANSFORMERS 5.3.0</text>
  <text x="60" y="114" class="title">Open the expert: tokens, attention, residuals, pooling, classifier</text>
  <text x="60" y="147" class="subtitle">The encoder block topology is similar; token construction, width, depth, activation, and pooling are not.</text>
  <g transform="translate(1450 50)"><rect width="410" height="92" rx="15" fill="#121927" stroke="#40516b"/><text x="18" y="28" class="mini">SCORING-TIME MODULES ONLY</text><text x="18" y="53" class="body">Vision backbone + binary head. No text encoder,</text><text x="18" y="75" class="body">prompt, decoder, distillation target, or DINO module.</text></g>

  <!-- CLIP family -->
  <g transform="translate(60 190)">
    <rect width="1800" height="500" rx="24" fill="url(#clipBg)" stroke="#2f70c5" stroke-width="2"/>
    <text x="24" y="38" class="kicker" fill="#78b9ff">CLIP ViT-L/14 · THE COMPLETE PIPELINE IS INSTANTIATED TWICE</text>
    <text x="24" y="75" class="lane">Class-token pooling + visual projection</text>
    <text x="24" y="101" class="small">Expert 1 and Expert 2 have identical structure but independent encoder, projection, and classifier parameters.</text>

    <g transform="translate(24 132)">
      <rect class="clip" width="230" height="306" rx="16"/>
      <text x="16" y="28" class="mini">01 · PATCHIFY</text>
      <text x="16" y="59" class="mono">[B,3,224,224]</text>
      <text x="16" y="92" class="body">Conv2d 3→1024</text>
      <text x="16" y="115" class="body">kernel 14 · stride 14</text>
      <text x="16" y="138" class="body">bias = false</text>
      <text x="16" y="172" class="mono">16×16 = 256 patches</text>
      <text x="16" y="205" class="body">flatten spatial grid</text>
      <text x="16" y="228" class="body">prepend learned CLS</text>
      <text x="16" y="251" class="body">add learned positions</text>
      <text x="16" y="284" class="mono">[B,257,1024]</text>
    </g>
    <path class="clipLine" d="M262 285H298"/>

    <g transform="translate(306 122)">
      <rect class="clip" width="900" height="326" rx="18"/>
      <text x="18" y="30" class="mini">02 · PRE-LAYER-NORMALIZED TRANSFORMER BLOCK ×24</text>
      <g transform="translate(18 58)"><rect class="neutral" width="125" height="68" rx="11"/><text x="62" y="27" text-anchor="middle" class="mini">LAYER NORM</text><text x="62" y="49" text-anchor="middle" class="mono">ε=1e−5</text></g>
      <path class="clipLine" d="M151 92H184"/>
      <g transform="translate(192 48)">
        <rect class="clip" width="430" height="156" rx="14"/>
        <text x="14" y="27" class="mini">MULTI-HEAD SELF-ATTENTION · DROPOUT 0</text>
        <g transform="translate(14 45)"><rect class="neutral" width="82" height="48" rx="9"/><text x="41" y="29" text-anchor="middle" class="mono">Q 1024</text></g>
        <g transform="translate(108 45)"><rect class="neutral" width="82" height="48" rx="9"/><text x="41" y="29" text-anchor="middle" class="mono">K 1024</text></g>
        <g transform="translate(202 45)"><rect class="neutral" width="82" height="48" rx="9"/><text x="41" y="29" text-anchor="middle" class="mono">V 1024</text></g>
        <path d="M96 69H104M190 69H198M284 69H306" class="thin"/>
        <g transform="translate(314 41)"><rect class="clip" width="100" height="56" rx="9"/><text x="50" y="23" text-anchor="middle" class="mini">16 HEADS</text><text x="50" y="43" text-anchor="middle" class="mono">64 / head</text></g>
        <text x="14" y="122" class="body">scaled dot-product attention → concatenate → out projection</text>
        <text x="14" y="144" class="mono">[B,257,1024] → [B,257,1024]</text>
      </g>
      <path class="clipLine" d="M630 126H662"/>
      <g transform="translate(670 58)"><rect class="neutral" width="125" height="68" rx="11"/><text x="62" y="27" text-anchor="middle" class="mini">RESIDUAL</text><text x="62" y="49" text-anchor="middle" class="mono">x + attn(x)</text></g>
      <path class="resClip" d="M18 228H70V274H652V228"/>
      <g transform="translate(18 220)"><rect class="neutral" width="125" height="68" rx="11"/><text x="62" y="27" text-anchor="middle" class="mini">LAYER NORM</text><text x="62" y="49" text-anchor="middle" class="mono">ε=1e−5</text></g>
      <path class="clipLine" d="M151 254H184"/>
      <g transform="translate(192 212)"><rect class="clip" width="430" height="86" rx="12"/><text x="14" y="27" class="mini">FEED-FORWARD MLP</text><text x="14" y="52" class="mono">1024 → 4096 → 1024</text><text x="250" y="52" class="body">QuickGELU</text><text x="14" y="74" class="small">two linear layers · token-wise</text></g>
      <path class="clipLine" d="M630 254H662"/>
      <g transform="translate(670 220)"><rect class="neutral" width="125" height="68" rx="11"/><text x="62" y="27" text-anchor="middle" class="mini">RESIDUAL</text><text x="62" y="49" text-anchor="middle" class="mono">y + mlp(y)</text></g>
      <g transform="translate(814 58)"><rect class="clip" width="68" height="230" rx="12"/><text x="34" y="28" text-anchor="middle" class="mini">×24</text><path d="M34 52V196" stroke="#76b6ff" stroke-width="2"/><path d="M24 186L34 202L44 186" fill="none" stroke="#76b6ff" stroke-width="2"/><text x="34" y="220" text-anchor="middle" class="mini">DEPTH</text></g>
    </g>
    <path class="clipLine" d="M1214 285H1248"/>

    <g transform="translate(1256 132)">
      <rect class="clip" width="244" height="306" rx="16"/>
      <text x="16" y="28" class="mini">03 · POOL + PROJECT</text>
      <text x="16" y="59" class="body">select token index 0</text>
      <text x="16" y="82" class="mono">CLS [B,1024]</text>
      <text x="16" y="115" class="body">post LayerNorm ε=1e−5</text>
      <text x="16" y="148" class="body">visual_projection</text>
      <text x="16" y="171" class="mono">Linear 1024→768</text>
      <text x="16" y="194" class="small">bias = false</text>
      <text x="16" y="228" class="boxTitle">image_embeds</text>
      <text x="16" y="252" class="mono">[B,768]</text>
      <text x="16" y="283" class="small">one vector per image</text>
    </g>
    <path class="clipLine" d="M1508 285H1542"/>
    <g transform="translate(1550 132)">
      <rect class="clip" width="226" height="306" rx="16"/>
      <text x="16" y="28" class="mini">04 · BINARY HEAD ×2</text>
      <text x="16" y="60" class="mono">768→256</text>
      <text x="16" y="86" class="body">ReLU</text>
      <text x="16" y="112" class="body">Dropout(0.3)</text>
      <text x="16" y="136" class="small">inactive in eval mode</text>
      <text x="16" y="169" class="mono">256→2 logits</text>
      <text x="16" y="198" class="body">cast logits to float32</text>
      <text x="16" y="224" class="body">softmax(dim=1)[:,1]</text>
      <text x="16" y="258" class="boxTitle">Expert 1 → P1 [B]</text>
      <text x="16" y="283" class="boxTitle">Expert 2 → P2 [B]</text>
    </g>
  </g>

  <!-- SigLIP family -->
  <g transform="translate(60 720)">
    <rect width="1800" height="550" rx="24" fill="url(#sigBg)" stroke="#ad781f" stroke-width="2"/>
    <text x="24" y="38" class="kicker" fill="#ffd270">SIGLIP So400M PATCH14-384 · THE COMPLETE PIPELINE IS INSTANTIATED TWICE</text>
    <text x="24" y="75" class="lane">Patch-only tokens + learned-probe attention pooling</text>
    <text x="24" y="101" class="small">Expert 3 and Expert 4 have identical structure but independent encoder, pooling-head, and classifier parameters.</text>

    <g transform="translate(24 142)">
      <rect class="sig" width="230" height="342" rx="16"/>
      <text x="16" y="28" class="mini">01 · PATCHIFY</text>
      <text x="16" y="59" class="mono">[B,3,384,384]</text>
      <text x="16" y="92" class="body">Conv2d 3→1152</text>
      <text x="16" y="115" class="body">kernel 14 · stride 14</text>
      <text x="16" y="138" class="body">padding = valid</text>
      <text x="16" y="172" class="mono">27×27 = 729 patches</text>
      <text x="16" y="205" class="body">flatten spatial grid</text>
      <text x="16" y="228" class="body">add learned positions</text>
      <text x="16" y="251" class="body">no CLS token</text>
      <text x="16" y="284" class="mono">[B,729,1152]</text>
      <text x="16" y="316" class="small">384 ÷ 14 floors to 27</text>
    </g>
    <path class="sigLine" d="M262 313H298"/>

    <g transform="translate(306 132)">
      <rect class="sig" width="900" height="362" rx="18"/>
      <text x="18" y="30" class="mini">02 · PRE-LAYER-NORMALIZED TRANSFORMER BLOCK ×27</text>
      <g transform="translate(18 58)"><rect class="neutral" width="125" height="68" rx="11"/><text x="62" y="27" text-anchor="middle" class="mini">LAYER NORM</text><text x="62" y="49" text-anchor="middle" class="mono">ε=1e−6</text></g>
      <path class="sigLine" d="M151 92H184"/>
      <g transform="translate(192 48)">
        <rect class="sig" width="430" height="156" rx="14"/>
        <text x="14" y="27" class="mini">MULTI-HEAD SELF-ATTENTION · DROPOUT 0</text>
        <g transform="translate(14 45)"><rect class="neutral" width="82" height="48" rx="9"/><text x="41" y="29" text-anchor="middle" class="mono">Q 1152</text></g>
        <g transform="translate(108 45)"><rect class="neutral" width="82" height="48" rx="9"/><text x="41" y="29" text-anchor="middle" class="mono">K 1152</text></g>
        <g transform="translate(202 45)"><rect class="neutral" width="82" height="48" rx="9"/><text x="41" y="29" text-anchor="middle" class="mono">V 1152</text></g>
        <path d="M96 69H104M190 69H198M284 69H306" class="thin"/>
        <g transform="translate(314 41)"><rect class="sig" width="100" height="56" rx="9"/><text x="50" y="23" text-anchor="middle" class="mini">16 HEADS</text><text x="50" y="43" text-anchor="middle" class="mono">72 / head</text></g>
        <text x="14" y="122" class="body">scaled dot-product attention → concatenate → out projection</text>
        <text x="14" y="144" class="mono">[B,729,1152] → [B,729,1152]</text>
      </g>
      <path class="sigLine" d="M630 126H662"/>
      <g transform="translate(670 58)"><rect class="neutral" width="125" height="68" rx="11"/><text x="62" y="27" text-anchor="middle" class="mini">RESIDUAL</text><text x="62" y="49" text-anchor="middle" class="mono">x + attn(x)</text></g>
      <path class="resSig" d="M18 228H70V310H652V228"/>
      <g transform="translate(18 256)"><rect class="neutral" width="125" height="68" rx="11"/><text x="62" y="27" text-anchor="middle" class="mini">LAYER NORM</text><text x="62" y="49" text-anchor="middle" class="mono">ε=1e−6</text></g>
      <path class="sigLine" d="M151 290H184"/>
      <g transform="translate(192 248)"><rect class="sig" width="430" height="86" rx="12"/><text x="14" y="27" class="mini">FEED-FORWARD MLP</text><text x="14" y="52" class="mono">1152 → 4304 → 1152</text><text x="260" y="52" class="body">GELU-tanh</text><text x="14" y="74" class="small">two linear layers · token-wise</text></g>
      <path class="sigLine" d="M630 290H662"/>
      <g transform="translate(670 256)"><rect class="neutral" width="125" height="68" rx="11"/><text x="62" y="27" text-anchor="middle" class="mini">RESIDUAL</text><text x="62" y="49" text-anchor="middle" class="mono">y + mlp(y)</text></g>
      <g transform="translate(814 58)"><rect class="sig" width="68" height="266" rx="12"/><text x="34" y="28" text-anchor="middle" class="mini">×27</text><path d="M34 52V232" stroke="#ffd173" stroke-width="2"/><path d="M24 222L34 238L44 222" fill="none" stroke="#ffd173" stroke-width="2"/><text x="34" y="256" text-anchor="middle" class="mini">DEPTH</text></g>
    </g>
    <path class="sigLine" d="M1214 313H1248"/>

    <g transform="translate(1256 142)">
      <rect class="sig" width="244" height="342" rx="16"/>
      <text x="16" y="28" class="mini">03 · MAP POOLING HEAD</text>
      <text x="16" y="59" class="body">post-LN every token</text>
      <text x="16" y="82" class="mono">[B,729,1152]</text>
      <text x="16" y="115" class="body">repeat learned probe</text>
      <text x="16" y="138" class="mono">[1,1,1152] → B</text>
      <text x="16" y="171" class="body">MultiheadAttention</text>
      <text x="16" y="194" class="small">Q=probe · K/V=patch tokens</text>
      <text x="16" y="227" class="body">residual = attended probe</text>
      <text x="16" y="250" class="body">LN → SigLIP MLP → add</text>
      <text x="16" y="283" class="boxTitle">pooler_output[:,0]</text>
      <text x="16" y="307" class="mono">[B,1152]</text>
      <text x="16" y="329" class="small">one vector per image</text>
    </g>
    <path class="sigLine" d="M1508 313H1542"/>
    <g transform="translate(1550 142)">
      <rect class="sig" width="226" height="342" rx="16"/>
      <text x="16" y="28" class="mini">04 · BINARY HEAD ×2</text>
      <text x="16" y="60" class="mono">1152→256</text>
      <text x="16" y="86" class="body">ReLU</text>
      <text x="16" y="112" class="body">Dropout(0.3)</text>
      <text x="16" y="136" class="small">inactive in eval mode</text>
      <text x="16" y="169" class="mono">256→2 logits</text>
      <text x="16" y="198" class="body">cast logits to float32</text>
      <text x="16" y="224" class="body">softmax(dim=1)[:,1]</text>
      <text x="16" y="266" class="boxTitle">Expert 3 → P3 [B]</text>
      <text x="16" y="291" class="boxTitle">Expert 4 → P4 [B]</text>
      <text x="16" y="322" class="small">separate full checkpoints</text>
    </g>
  </g>

  <g transform="translate(60 1292)">
    <text class="small">Parameter totals per independently instantiated expert: CLIP 304,163,586 · SigLIP 428,521,282 · four-expert ensemble 1,465,369,736. Counts include vision backbone and binary head.</text>
    <text x="0" y="24" class="small">Feature outputs used by SynthFlag: CLIP image_embeds [B,768] · SigLIP pooler_output [B,1152] · no backbone-family outputs are concatenated.</text>
  </g>
</svg>
