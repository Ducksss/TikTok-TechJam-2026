<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag inference worker lifecycle and concurrency</title><desc id="desc">A worker process starts with no model unless eager loading is enabled. Eager startup or the first valid request initializes exactly one resident model through the model lock. Image decoding can overlap, while the inference lock serializes scoring within the process. Health readiness means the model is resident, not that the inference queue is empty.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#7891aa" stroke-opacity=".065" d="M40 0H0V40"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="11" flood-color="#f4f8ff" flood-opacity=".44" stdDeviation="15"/></filter><marker id="arr" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#93abc4" d="M0 0L10 5L0 10Z"/></marker><marker id="amber" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#fbbf24" d="M0 0L10 5L0 10Z"/></marker><marker id="lime" markerHeight="8" markerWidth="8" orient="auto" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#a3e635" d="M0 0L10 5L0 10Z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:15px;font-weight:750;letter-spacing:3px;fill:#65e6d2}.headline{font-size:45px;font-weight:740;letter-spacing:-1.2px;fill:#f5f9ff}.subtitle{font-size:18px;fill:#aabbd0}.kicker{font-size:12px;font-weight:800;letter-spacing:1.5px;fill:#8da5bf}.title{font-size:20px;font-weight:740;fill:#f3f8fd}.body{font-size:14px;fill:#b8c8da}.small{font-size:11px;fill:#8fa5bd}.state{font-size:16px;font-weight:750}.monoText{font-size:12px;fill:#dce8f5}</style><style>text{fill:#111827}.eyebrow,.kicker{fill:#2448c2}.body,.small,.subtitle{fill:#52627a}.headline,.state,.title{fill:#111827}.mono,.monoText{fill:#253651}</style></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#grid)"/><g class="sans"><text x="64" y="70" class="eyebrow">WORKER LIFECYCLE · PROCESS-LOCAL STATE</text><text x="64" y="125" class="headline">Load once. Decode concurrently. Score one at a time.</text><text x="64" y="161" class="subtitle">Two locks protect different resources: initialization and inference.</text><rect width="1032" height="628" x="52" y="204" fill="#f4f8ff" fill-opacity=".72" stroke="#344b64" stroke-dasharray="8 7" stroke-width="2" rx="30"/><rect width="186" height="32" x="76" y="222" fill="#edf3ff" rx="16"/><text x="169" y="243" fill="#dae7f4" class="kicker" text-anchor="middle">ONE WORKER PROCESS</text><g filter="url(#shadow)" transform="translate(76 278)"><rect width="192" height="106" fill="#edf3ff" stroke="#526a83" rx="20"/><text x="18" y="28" class="kicker">PROCESS START</text><text x="18" y="57" class="title">FastAPI lifespan</text><text x="18" y="82" class="small">module state: _model = None</text></g><path stroke="#93abc4" stroke-width="3" marker-end="url(#arr)" d="M268 331H318"/><g filter="url(#shadow)" transform="translate(332 276)"><path fill="#fff" stroke="#b58928" stroke-width="2" d="M92 0L184 55L92 110L0 55Z"/><text x="92" y="46" fill="#f3d17f" class="kicker" text-anchor="middle">EAGER?</text><text x="92" y="67" class="mono monoText" text-anchor="middle">ENV = &quot;1&quot;</text></g><path fill="none" stroke="#fbbf24" stroke-width="3" marker-end="url(#amber)" d="M424 276V246H948V278"/><text x="686" y="236" fill="#f2d28c" class="small" text-anchor="middle">yes · lifespan awaits _get_model()</text><path stroke="#93abc4" stroke-width="3" marker-end="url(#arr)" d="M516 331H566"/><text x="541" y="321" class="small" text-anchor="middle">no</text><g filter="url(#shadow)" transform="translate(580 278)"><rect width="202" height="106" fill="#f4f8ff" stroke="#526a83" rx="20"/><circle cx="24" cy="27" r="7" fill="#64748b"/><text x="42" y="32" fill="#dce6f0" class="state">UNLOADED</text><text x="18" y="61" class="small">health: ready = false</text><text x="18" y="82" class="small">first valid request calls _get_model</text></g><path stroke="#fbbf24" stroke-width="3" marker-end="url(#amber)" d="M782 331H824"/><g filter="url(#shadow)" transform="translate(838 278)"><rect width="220" height="106" fill="#fff7e8" stroke="#d97706" stroke-width="2" rx="20"/><text x="18" y="28" fill="#f2cf83" class="kicker">_model_lock</text><text x="18" y="56" class="title">Initialize once</text><text x="18" y="80" class="small">double-check None · load checkpoints</text><text x="18" y="97" class="small">set model + identity digest</text></g><path fill="none" stroke="#a3e635" stroke-width="3" marker-end="url(#lime)" d="M948 384V414H684"/><g filter="url(#shadow)" transform="translate(522 414)"><rect width="324" height="102" fill="#fff" stroke="#84cc16" stroke-width="2" rx="20"/><circle cx="25" cy="28" r="7" fill="#a3e635"/><text x="43" y="33" fill="#e3f8b4" class="state">READY · RESIDENT</text><text x="18" y="62" class="body">one Model object in this process</text><text x="18" y="84" class="small">future _get_model calls return the fast path</text></g><text x="76" y="570" class="kicker">CONCURRENT REQUESTS AFTER HTTP VALIDATION</text><g transform="translate(76 592)"><rect width="958" height="92" fill="#f4f8ff" stroke="#30485f" rx="18"/><rect width="98" height="60" x="16" y="16" fill="#edf9f7" rx="13"/><text x="65" y="38" fill="#bff7ee" class="state" text-anchor="middle">REQ A</text><text x="65" y="58" class="small" text-anchor="middle">accepted</text><path stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arr)" d="M114 46H150"/><rect width="190" height="60" x="160" y="16" fill="#edf9f7" stroke="#287f79" rx="13"/><text x="176" y="39" class="title" font-size="15">Read + RGB decode</text><text x="176" y="59" class="small">async read · to_thread decode</text><path stroke="#93abc4" stroke-width="2.5" marker-end="url(#arr)" d="M350 46H388"/><rect width="168" height="60" x="398" y="16" fill="#fff" stroke="#84cc16" rx="13"/><text x="414" y="39" class="title" font-size="15">Resident model</text><text x="414" y="59" class="small">fast _get_model return</text><path stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)" d="M566 46H604"/><rect width="154" height="60" x="614" y="16" fill="#fff7e8" stroke="#d97706" rx="13"/><text x="630" y="39" class="title" font-size="15">_inference_lock</text><text x="630" y="59" class="small">acquire</text><path stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arr)" d="M768 46H806"/><rect width="126" height="60" x="816" y="16" fill="#edf3ff" stroke="#3b82f6" rx="13"/><text x="879" y="39" class="title" font-size="15" text-anchor="middle">SCORE A</text><text x="879" y="59" class="small" text-anchor="middle">predict_pil</text></g><g transform="translate(76 700)"><rect width="958" height="92" fill="#f4f8ff" stroke="#30485f" rx="18"/><rect width="98" height="60" x="16" y="16" fill="#edf9f7" rx="13"/><text x="65" y="38" fill="#bff7ee" class="state" text-anchor="middle">REQ B</text><text x="65" y="58" class="small" text-anchor="middle">accepted</text><path stroke="#2dd4bf" stroke-width="2.5" marker-end="url(#arr)" d="M114 46H150"/><rect width="190" height="60" x="160" y="16" fill="#edf9f7" stroke="#287f79" rx="13"/><text x="176" y="39" class="title" font-size="15">Read + RGB decode</text><text x="176" y="59" class="small">may overlap with request A</text><path stroke="#93abc4" stroke-width="2.5" marker-end="url(#arr)" d="M350 46H388"/><rect width="168" height="60" x="398" y="16" fill="#fff" stroke="#84cc16" rx="13"/><text x="414" y="39" class="title" font-size="15">Same model</text><text x="414" y="59" class="small">shared in this process</text><path stroke="#fbbf24" stroke-width="2.5" marker-end="url(#amber)" d="M566 46H604"/><rect width="154" height="60" x="614" y="16" fill="#fff7e8" stroke="#d97706" rx="13"/><text x="630" y="39" class="title" font-size="15">WAIT</text><text x="630" y="59" class="small">until A releases lock</text><path stroke="#60a5fa" stroke-width="2.5" marker-end="url(#arr)" d="M768 46H806"/><rect width="126" height="60" x="816" y="16" fill="#edf3ff" stroke="#3b82f6" rx="13"/><text x="879" y="39" class="title" font-size="15" text-anchor="middle">SCORE B</text><text x="879" y="59" class="small" text-anchor="middle">after A</text></g><g filter="url(#shadow)" transform="translate(1120 204)"><rect width="256" height="628" fill="#edf3ff" stroke="#435b74" rx="26"/><text x="22" y="38" class="kicker">HEALTH SEMANTICS</text><text x="22" y="76" class="title">GET /health</text><g transform="translate(22 100)"><rect width="212" height="88" fill="#f4f8ff" stroke="#526a83" rx="16"/><text x="16" y="27" class="mono monoText">ready: false</text><text x="16" y="51" class="body">model is not resident</text><text x="16" y="72" class="small">service may still accept a cold request</text></g><g transform="translate(22 208)"><rect width="212" height="88" fill="#fff" stroke="#84cc16" rx="16"/><text x="16" y="27" fill="#e4f8b9" class="mono monoText">ready: true</text><text x="16" y="51" class="body">model is resident</text><text x="16" y="72" class="small">does not mean the queue is empty</text></g><line x1="22" x2="234" y1="326" y2="326" stroke="#344b65"/><text x="22" y="360" class="kicker">PROCESS BOUNDARY</text><text x="22" y="392" class="body">Module globals and both locks</text><text x="22" y="414" class="body">are process-local.</text><g transform="translate(22 438)"><rect width="212" height="116" fill="#fff7e8" stroke="#9a6c18" rx="16"/><text x="16" y="27" class="title" font-size="16">More worker processes</text><text x="16" y="54" class="small">→ more Model copies</text><text x="16" y="75" class="small">→ more model memory</text><text x="16" y="96" class="small">→ independent inference locks</text></g><text x="22" y="590" class="small">Scale only with enough model memory</text><text x="22" y="608" class="small">and device capacity per process.</text></g><text x="1376" y="875" class="small" text-anchor="end">Source: current service/app.py worker state and lock placement</text></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>