<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" viewBox="0 0 1440 900" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">SynthFlag inference user flow</title>
  <desc id="desc">A six-stage flow from selecting an image or folder through checkpoint verification, RGB decoding, dual preprocessing, four-expert inference, and a zero-to-one fake-image score with resumable CSV and metadata output.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="0.55" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#f4f8ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.78" cy="0.14" r="0.8">
      <stop offset="0" stop-color="#2563eb" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#2563eb" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#6e89a8" stroke-opacity="0.08" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#f4f8ff" flood-opacity="0.14"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#8ba7c5"/>
    </marker>
    <marker id="arrow-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10Z" fill="#2dd4bf"/>
    </marker>
    <style>
      .sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .mono{font-family:"SFMono-Regular",Consolas,"Liberation Mono",monospace}
      .eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#65e6d2}
      .headline{font-size:48px;font-weight:730;letter-spacing:-1.5px;fill:#f5f9ff}
      .subtitle{font-size:20px;fill:#a9bad0}
      .stage{font-size:12px;font-weight:800;letter-spacing:2px;fill:#7e9cbb}
      .card-title{font-size:24px;font-weight:720;fill:#f6f9fd}
      .body{font-size:16px;fill:#bac8d9}
      .small{font-size:13px;fill:#8fa5be}
      .chip{font-size:12px;font-weight:700;fill:#dbe8f6;letter-spacing:.5px}
      .number{font-size:15px;font-weight:800;fill:#f4f8ff}
    </style>
      <style>
      text,tspan{fill:#111827}
      .eyebrow,.kicker,.stage,.role,.step,.label,.section{fill:#2448c2}
      .subtitle,.body,.small,.mini,.note,.sub,.tiny{fill:#52627a}
      .headline,.title,.laneTitle,.lane-title,.card-title,.cardTitle,.boxTitle,.actor,.head,.strong,.stat,.value,.formula,.eq,.prob,.state{fill:#111827}
      .mono,.monoText,.chip,.number,.num,.code,.dim{fill:#253651}
    </style>
  </defs>

  <rect width="1440" height="900" fill="url(#bg)"/>
  <rect width="1440" height="900" fill="url(#glow)"/>
  <rect width="1440" height="900" fill="url(#grid)"/>

  <g class="sans">
    <text x="84" y="78" class="eyebrow">SYNTHFLAG · RELEASED INFERENCE PATH</text>
    <text x="84" y="135" class="headline">From pixels to a traceable score</text>
    <text x="84" y="174" class="subtitle">One deterministic pipeline · four independently restored experts · one continuous signal</text>
    <g transform="translate(1190 68)">
      <rect width="166" height="62" rx="16" fill="#edf3ff" stroke="#28415d"/>
      <circle cx="28" cy="31" r="8" fill="#a3e635"/>
      <text x="48" y="27" class="small" fill="#d9e7f5">OUTPUT RANGE</text>
      <text x="48" y="46" class="mono" font-size="16" font-weight="700" fill="#eafaad">0.00 — 1.00</text>
    </g>

    <!-- Connectors, behind cards -->
    <path d="M448 340H492" fill="none" stroke="#8ba7c5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M880 340H924" fill="none" stroke="#8ba7c5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M1120 468V512" fill="none" stroke="#8ba7c5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M924 640H880" fill="none" stroke="#8ba7c5" stroke-width="3" marker-end="url(#arrow)"/>
    <path d="M492 640H448" fill="none" stroke="#8ba7c5" stroke-width="3" marker-end="url(#arrow)"/>

    <!-- Stage 1 -->
    <g transform="translate(84 236)" filter="url(#shadow)">
      <rect width="364" height="232" rx="24" fill="#edf9f7" stroke="#277d79" stroke-width="2"/>
      <rect x="24" y="24" width="34" height="34" rx="10" fill="#2dd4bf"/>
      <text x="41" y="47" class="number" text-anchor="middle">01</text>
      <text x="74" y="45" class="stage">INPUT</text>
      <text x="24" y="94" class="card-title">Choose pixels</text>
      <text x="24" y="125" class="body">A single image in the web UI</text>
      <text x="24" y="150" class="body">or a folder in the CLI workflow.</text>
      <g transform="translate(24 178)">
        <rect width="86" height="30" rx="15" fill="#edf9f7"/>
        <text x="43" y="20" class="chip" text-anchor="middle">JPEG</text>
        <rect x="96" width="78" height="30" rx="15" fill="#edf9f7"/>
        <text x="135" y="20" class="chip" text-anchor="middle">PNG</text>
        <rect x="184" width="95" height="30" rx="15" fill="#edf9f7"/>
        <text x="231" y="20" class="chip" text-anchor="middle">WEBP+</text>
      </g>
    </g>

    <!-- Stage 2 -->
    <g transform="translate(492 236)" filter="url(#shadow)">
      <rect width="388" height="232" rx="24" fill="#edf3ff" stroke="#35506f" stroke-width="2"/>
      <rect x="24" y="24" width="34" height="34" rx="10" fill="#91a9c3"/>
      <text x="41" y="47" class="number" text-anchor="middle">02</text>
      <text x="74" y="45" class="stage">INTEGRITY GATE</text>
      <text x="24" y="94" class="card-title">Verify checkpoints</text>
      <text x="24" y="125" class="body">Require all four model files.</text>
      <text x="24" y="150" class="body">Compare manifest size + SHA-256</text>
      <text x="24" y="175" class="body">before deserializing any weights.</text>
      <g transform="translate(24 193)">
        <circle cx="8" cy="8" r="8" fill="#a3e635"/>
        <path d="M4 8l3 3 5-6" fill="none" stroke="#ffffff" stroke-width="2"/>
        <text x="24" y="12" class="small">manifest.json · schema v1</text>
      </g>
    </g>

    <!-- Stage 3 -->
    <g transform="translate(924 236)" filter="url(#shadow)">
      <rect width="432" height="232" rx="24" fill="#edf3ff" stroke="#35506f" stroke-width="2"/>
      <rect x="24" y="24" width="34" height="34" rx="10" fill="#91a9c3"/>
      <text x="41" y="47" class="number" text-anchor="middle">03</text>
      <text x="74" y="45" class="stage">DECODE</text>
      <text x="24" y="94" class="card-title">Normalize the color space</text>
      <text x="24" y="125" class="body">Decode with Pillow and convert</text>
      <text x="24" y="150" class="body">every input to three-channel RGB.</text>
      <g transform="translate(24 177)">
        <rect width="274" height="32" rx="10" fill="#f4f8ff" stroke="#29425e"/>
        <text x="16" y="21" class="mono" font-size="13" fill="#d7e5f4">image.convert(&quot;RGB&quot;)</text>
      </g>
    </g>

    <!-- Stage 4 -->
    <g transform="translate(924 512)" filter="url(#shadow)">
      <rect width="432" height="256" rx="24" fill="#edf3ff" stroke="#35506f" stroke-width="2"/>
      <rect x="24" y="24" width="34" height="34" rx="10" fill="#91a9c3"/>
      <text x="41" y="47" class="number" text-anchor="middle">04</text>
      <text x="74" y="45" class="stage">DUAL PREPROCESSING</text>
      <text x="24" y="94" class="card-title">Create two model views</text>
      <g transform="translate(24 121)">
        <rect width="180" height="91" rx="14" fill="#edf3ff" stroke="#3b82f6"/>
        <text x="16" y="27" class="chip" fill="#9fc7ff">CLIP LANE</text>
        <text x="16" y="55" class="mono" font-size="18" font-weight="700" fill="#edf5ff">224 × 224</text>
        <text x="16" y="77" class="small">bicubic · center crop</text>
        <rect x="204" width="180" height="91" rx="14" fill="#fff7e8" stroke="#f59e0b"/>
        <text x="220" y="27" class="chip" fill="#ffd68a">SIGLIP LANE</text>
        <text x="220" y="55" class="mono" font-size="18" font-weight="700" fill="#fff4da">384 × 384</text>
        <text x="220" y="77" class="small">bicubic · center crop</text>
      </g>
      <text x="24" y="235" class="small">Each lane applies its own channel normalization.</text>
    </g>

    <!-- Stage 5 -->
    <g transform="translate(492 512)" filter="url(#shadow)">
      <rect width="388" height="256" rx="24" fill="#edf3ff" stroke="#35506f" stroke-width="2"/>
      <rect x="24" y="24" width="34" height="34" rx="10" fill="#91a9c3"/>
      <text x="41" y="47" class="number" text-anchor="middle">05</text>
      <text x="74" y="45" class="stage">FOUR EXPERTS</text>
      <text x="24" y="94" class="card-title">Infer in parallel</text>
      <g transform="translate(24 120)">
        <rect width="158" height="42" rx="12" fill="#edf3ff" stroke="#3b82f6"/>
        <text x="79" y="27" class="chip" text-anchor="middle" fill="#bed9ff">CLIP · EXPERT 1</text>
        <rect x="174" width="158" height="42" rx="12" fill="#edf3ff" stroke="#3b82f6"/>
        <text x="253" y="27" class="chip" text-anchor="middle" fill="#bed9ff">CLIP · EXPERT 2</text>
        <rect y="54" width="158" height="42" rx="12" fill="#fff7e8" stroke="#f59e0b"/>
        <text x="79" y="81" class="chip" text-anchor="middle" fill="#ffdda0">SIGLIP · EXPERT 3</text>
        <rect x="174" y="54" width="158" height="42" rx="12" fill="#fff7e8" stroke="#f59e0b"/>
        <text x="253" y="81" class="chip" text-anchor="middle" fill="#ffdda0">SIGLIP · EXPERT 4</text>
      </g>
      <text x="24" y="235" class="small">Softmax class index 1 → each P(fake)</text>
    </g>

    <!-- Stage 6 -->
    <g transform="translate(84 512)" filter="url(#shadow)">
      <rect width="364" height="256" rx="24" fill="#ffffff" stroke="#84cc16" stroke-width="2"/>
      <rect x="24" y="24" width="34" height="34" rx="10" fill="#a3e635"/>
      <text x="41" y="47" class="number" text-anchor="middle">06</text>
      <text x="74" y="45" class="stage" fill="#b8dc75">SCORE + RECORD</text>
      <text x="24" y="94" class="card-title">Return one signal</text>
      <text x="24" y="128" class="mono" font-size="24" font-weight="700" fill="#dffc9a">mean P(fake)</text>
      <text x="24" y="156" class="body">Continuous score from 0 to 1</text>
      <line x1="24" y1="180" x2="340" y2="180" stroke="#56712f"/>
      <text x="24" y="208" class="body">Resumable predictions.csv</text>
      <text x="24" y="233" class="body">+ predictions.meta.json</text>
    </g>

    <!-- Footer evidence rail -->
    <g transform="translate(84 812)">
      <line x1="0" y1="0" x2="1272" y2="0" stroke="#28415b"/>
      <circle cx="8" cy="33" r="5" fill="#2dd4bf"/>
      <text x="24" y="39" class="small">Released code path</text>
      <text x="198" y="39" class="mono" font-size="13" fill="#d6e3f1">infer/cli.py → infer/model.py</text>
      <text x="1272" y="39" class="small" text-anchor="end">A score is evidence, not conclusive proof of origin.</text>
    </g>
  </g>
</svg>
