<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag inference user flow</title><desc id="desc">A six-stage flow from selecting an image or folder through checkpoint verification, RGB decoding, dual preprocessing, four-expert inference, and a zero-to-one fake-image score with resumable CSV and metadata output.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset=".55" stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><radialGradient id="glow" cx=".78" cy=".14" r=".8"><stop offset="0" stop-color="#2563eb" stop-opacity=".2"/><stop offset="1" stop-color="#2563eb" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#6e89a8" stroke-opacity=".08" stroke-width="1" d="M40 0H0V40"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="14" flood-color="#f4f8ff" flood-opacity=".14" stdDeviation="16"/></filter><marker id="arrow" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#8ba7c5" d="M0 0L10 5L0 10Z"/></marker><marker id="arrow-teal" markerHeight="9" markerWidth="9" orient="auto-start-reverse" refX="8" refY="5" viewBox="0 0 10 10"><path fill="#2dd4bf" d="M0 0L10 5L0 10Z"/></marker><style>.sans{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif}.mono{font-family:&quot;SFMono-Regular&quot;,Consolas,&quot;Liberation Mono&quot;,monospace}.eyebrow{font-size:15px;font-weight:700;letter-spacing:3px;fill:#65e6d2}.headline{font-size:48px;font-weight:730;letter-spacing:-1.5px;fill:#f5f9ff}.subtitle{font-size:20px;fill:#a9bad0}.stage{font-size:12px;font-weight:800;letter-spacing:2px;fill:#7e9cbb}.card-title{font-size:24px;font-weight:720;fill:#f6f9fd}.body{font-size:16px;fill:#bac8d9}.small{font-size:13px;fill:#8fa5be}.chip{font-size:12px;font-weight:700;fill:#dbe8f6;letter-spacing:.5px}.number{font-size:15px;font-weight:800;fill:#f4f8ff}</style><style>text{fill:#111827}.eyebrow,.stage{fill:#2448c2}.body,.small,.subtitle{fill:#52627a}.card-title,.headline{fill:#111827}.chip,.mono,.number{fill:#253651}</style></defs><rect width="1440" height="900" fill="url(#bg)"/><rect width="1440" height="900" fill="url(#glow)"/><rect width="1440" height="900" fill="url(#grid)"/><g class="sans"><text x="84" y="78" class="eyebrow">SYNTHFLAG · RELEASED INFERENCE PATH</text><text x="84" y="135" class="headline">From pixels to a traceable score</text><text x="84" y="174" class="subtitle">One deterministic pipeline · four independently restored experts · one continuous signal</text><g transform="translate(1190 68)"><rect width="166" height="62" fill="#edf3ff" stroke="#28415d" rx="16"/><circle cx="28" cy="31" r="8" fill="#a3e635"/><text x="48" y="27" fill="#d9e7f5" class="small">OUTPUT RANGE</text><text x="48" y="46" fill="#eafaad" class="mono" font-size="16" font-weight="700">0.00 — 1.00</text></g><path fill="none" stroke="#8ba7c5" stroke-width="3" marker-end="url(#arrow)" d="M448 340H492"/><path fill="none" stroke="#8ba7c5" stroke-width="3" marker-end="url(#arrow)" d="M880 340H924"/><path fill="none" stroke="#8ba7c5" stroke-width="3" marker-end="url(#arrow)" d="M1120 468V512"/><path fill="none" stroke="#8ba7c5" stroke-width="3" marker-end="url(#arrow)" d="M924 640H880"/><path fill="none" stroke="#8ba7c5" stroke-width="3" marker-end="url(#arrow)" d="M492 640H448"/><g filter="url(#shadow)" transform="translate(84 236)"><rect width="364" height="232" fill="#edf9f7" stroke="#277d79" stroke-width="2" rx="24"/><rect width="34" height="34" x="24" y="24" fill="#2dd4bf" rx="10"/><text x="41" y="47" class="number" text-anchor="middle">01</text><text x="74" y="45" class="stage">INPUT</text><text x="24" y="94" class="card-title">Choose pixels</text><text x="24" y="125" class="body">A single image in the web UI</text><text x="24" y="150" class="body">or a folder in the CLI workflow.</text><g transform="translate(24 178)"><rect width="86" height="30" fill="#edf9f7" rx="15"/><text x="43" y="20" class="chip" text-anchor="middle">JPEG</text><rect width="78" height="30" x="96" fill="#edf9f7" rx="15"/><text x="135" y="20" class="chip" text-anchor="middle">PNG</text><rect width="95" height="30" x="184" fill="#edf9f7" rx="15"/><text x="231" y="20" class="chip" text-anchor="middle">WEBP+</text></g></g><g filter="url(#shadow)" transform="translate(492 236)"><rect width="388" height="232" fill="#edf3ff" stroke="#35506f" stroke-width="2" rx="24"/><rect width="34" height="34" x="24" y="24" fill="#91a9c3" rx="10"/><text x="41" y="47" class="number" text-anchor="middle">02</text><text x="74" y="45" class="stage">INTEGRITY GATE</text><text x="24" y="94" class="card-title">Verify checkpoints</text><text x="24" y="125" class="body">Require all four model files.</text><text x="24" y="150" class="body">Compare manifest size + SHA-256</text><text x="24" y="175" class="body">before deserializing any weights.</text><g transform="translate(24 193)"><circle cx="8" cy="8" r="8" fill="#a3e635"/><path fill="none" stroke="#fff" stroke-width="2" d="M4 8l3 3 5-6"/><text x="24" y="12" class="small">manifest.json · schema v1</text></g></g><g filter="url(#shadow)" transform="translate(924 236)"><rect width="432" height="232" fill="#edf3ff" stroke="#35506f" stroke-width="2" rx="24"/><rect width="34" height="34" x="24" y="24" fill="#91a9c3" rx="10"/><text x="41" y="47" class="number" text-anchor="middle">03</text><text x="74" y="45" class="stage">DECODE</text><text x="24" y="94" class="card-title">Normalize the color space</text><text x="24" y="125" class="body">Decode with Pillow and convert</text><text x="24" y="150" class="body">every input to three-channel RGB.</text><g transform="translate(24 177)"><rect width="274" height="32" fill="#f4f8ff" stroke="#29425e" rx="10"/><text x="16" y="21" fill="#d7e5f4" class="mono" font-size="13">image.convert(&quot;RGB&quot;)</text></g></g><g filter="url(#shadow)" transform="translate(924 512)"><rect width="432" height="256" fill="#edf3ff" stroke="#35506f" stroke-width="2" rx="24"/><rect width="34" height="34" x="24" y="24" fill="#91a9c3" rx="10"/><text x="41" y="47" class="number" text-anchor="middle">04</text><text x="74" y="45" class="stage">DUAL PREPROCESSING</text><text x="24" y="94" class="card-title">Create two model views</text><g transform="translate(24 121)"><rect width="180" height="91" fill="#edf3ff" stroke="#3b82f6" rx="14"/><text x="16" y="27" fill="#9fc7ff" class="chip">CLIP LANE</text><text x="16" y="55" fill="#edf5ff" class="mono" font-size="18" font-weight="700">224 × 224</text><text x="16" y="77" class="small">bicubic · center crop</text><rect width="180" height="91" x="204" fill="#fff7e8" stroke="#f59e0b" rx="14"/><text x="220" y="27" fill="#ffd68a" class="chip">SIGLIP LANE</text><text x="220" y="55" fill="#fff4da" class="mono" font-size="18" font-weight="700">384 × 384</text><text x="220" y="77" class="small">bicubic · center crop</text></g><text x="24" y="235" class="small">Each lane applies its own channel normalization.</text></g><g filter="url(#shadow)" transform="translate(492 512)"><rect width="388" height="256" fill="#edf3ff" stroke="#35506f" stroke-width="2" rx="24"/><rect width="34" height="34" x="24" y="24" fill="#91a9c3" rx="10"/><text x="41" y="47" class="number" text-anchor="middle">05</text><text x="74" y="45" class="stage">FOUR EXPERTS</text><text x="24" y="94" class="card-title">Infer in parallel</text><g transform="translate(24 120)"><rect width="158" height="42" fill="#edf3ff" stroke="#3b82f6" rx="12"/><text x="79" y="27" fill="#bed9ff" class="chip" text-anchor="middle">CLIP · EXPERT 1</text><rect width="158" height="42" x="174" fill="#edf3ff" stroke="#3b82f6" rx="12"/><text x="253" y="27" fill="#bed9ff" class="chip" text-anchor="middle">CLIP · EXPERT 2</text><rect width="158" height="42" y="54" fill="#fff7e8" stroke="#f59e0b" rx="12"/><text x="79" y="81" fill="#ffdda0" class="chip" text-anchor="middle">SIGLIP · EXPERT 3</text><rect width="158" height="42" x="174" y="54" fill="#fff7e8" stroke="#f59e0b" rx="12"/><text x="253" y="81" fill="#ffdda0" class="chip" text-anchor="middle">SIGLIP · EXPERT 4</text></g><text x="24" y="235" class="small">Softmax class index 1 → each P(fake)</text></g><g filter="url(#shadow)" transform="translate(84 512)"><rect width="364" height="256" fill="#fff" stroke="#84cc16" stroke-width="2" rx="24"/><rect width="34" height="34" x="24" y="24" fill="#a3e635" rx="10"/><text x="41" y="47" class="number" text-anchor="middle">06</text><text x="74" y="45" fill="#b8dc75" class="stage">SCORE + RECORD</text><text x="24" y="94" class="card-title">Return one signal</text><text x="24" y="128" fill="#dffc9a" class="mono" font-size="24" font-weight="700">mean P(fake)</text><text x="24" y="156" class="body">Continuous score from 0 to 1</text><line x1="24" x2="340" y1="180" y2="180" stroke="#56712f"/><text x="24" y="208" class="body">Resumable predictions.csv</text><text x="24" y="233" class="body">+ predictions.meta.json</text></g><g transform="translate(84 812)"><line x1="0" x2="1272" y1="0" y2="0" stroke="#28415b"/><circle cx="8" cy="33" r="5" fill="#2dd4bf"/><text x="24" y="39" class="small">Released code path</text><text x="198" y="39" fill="#d6e3f1" class="mono" font-size="13">infer/cli.py → infer/model.py</text><text x="1272" y="39" class="small" text-anchor="end">A score is evidence, not conclusive proof of origin.</text></g></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>