<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">NTIRE 2026 robustness evidence and deployment boundaries</title><desc id="desc">The challenge dataset contains 108,750 real and 185,750 generated images from 42 generators, with 20 generators in the training split. Across challenge stages there are 36 transformation types; robust-track images receive one to five chained distortions. The corresponding detector submission reports average clean ROC AUC 0.9729 and average robust ROC AUC 0.8679. The score does not identify a generator or prove provenance, and a deployment threshold must be validated separately.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><linearGradient id="coral" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f5f0ff"/><stop offset="1" stop-color="#edf3ff"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="10" flood-color="#f4f8ff" flood-opacity=".48" stdDeviation="18"/></filter><marker id="arrow" markerHeight="11" markerWidth="11" orient="auto" refX="9" refY="5.5"><path fill="#ff7e79" d="M0 0L11 5.5L0 11Z"/></marker><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path fill="none" stroke="#87a0bf" stroke-opacity=".055" d="M36 0H0V36"/></pattern><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}.kicker{font-size:15px;font-weight:700;letter-spacing:2.6px;fill:#8fa4be}.title{font-size:38px;font-weight:730;fill:#f5f8fc;letter-spacing:-.6px}.sub{font-size:17px;fill:#a9bbcf}.label{font-size:13px;font-weight:750;letter-spacing:1.35px}.stat{font-size:34px;font-weight:760;fill:#f7faff}.head{font-size:20px;font-weight:720;fill:#f4f7fc}.body{font-size:14px;fill:#b4c4d6}.mini{font-size:12px;fill:#9aadc3}</style><style>text{fill:#111827}.kicker,.label{fill:#2448c2}.body,.mini,.sub{fill:#52627a}.head,.stat,.title{fill:#111827}</style></defs><rect width="1440" height="900" fill="url(#bg)" rx="32"/><rect width="1440" height="900" fill="url(#grid)" rx="32"/><rect width="1368" height="828" x="36" y="36" fill="none" stroke="#8ba2bd" stroke-opacity=".16" rx="26"/><text x="80" y="94" class="kicker">PAPER FACTS · CHALLENGE EVIDENCE</text><text x="80" y="143" class="title">Robustness is measured under real-world damage.</text><text x="80" y="178" class="sub">Strong benchmark ranking evidence—paired with clear limits on what one score can establish.</text><g filter="url(#shadow)" transform="translate(80 226)"><rect width="570" height="240" fill="#edf3ff" stroke="#334b65" rx="24"/><text x="28" y="43" fill="#8fa9c5" class="label">CHALLENGE DATASET</text><g transform="translate(28 74)"><rect width="240" height="108" fill="#edf3ff" stroke="#4d6987" rx="17"/><text x="20" y="43" class="stat">108,750</text><text x="20" y="76" class="body">real images</text></g><g transform="translate(286 74)"><rect width="256" height="108" fill="#fff" stroke="#ffbd5c" stroke-opacity=".7" rx="17"/><text x="20" y="43" class="stat">185,750</text><text x="20" y="76" class="body">generated images</text></g><text x="28" y="214" class="body">42 generators overall · 20 represented in the training split</text></g><g filter="url(#shadow)" transform="translate(676 226)"><rect width="680" height="240" fill="url(#coral)" stroke="#ff7e79" stroke-opacity=".8" rx="24"/><text x="28" y="43" fill="#ff9d98" class="label">ROBUST-TRACK DEGRADATION PIPELINE</text><g transform="translate(28 74)"><rect width="126" height="80" fill="#edf3ff" stroke="#667890" rx="16"/><text x="63" y="34" class="head" text-anchor="middle">Image</text><text x="63" y="59" class="mini" text-anchor="middle">real or generated</text></g><path stroke="#ff7e79" stroke-width="2.2" marker-end="url(#arrow)" d="M154 114H198"/><g transform="translate(204 74)"><rect width="264" height="80" fill="#f5f0ff" stroke="#ff7e79" rx="16"/><text x="132" y="33" class="head" text-anchor="middle">1–5 chained distortions</text><text x="132" y="59" class="mini" text-anchor="middle">type and magnitude sampled per use</text></g><path stroke="#ff7e79" stroke-width="2.2" marker-end="url(#arrow)" d="M468 114H512"/><g transform="translate(518 74)"><rect width="134" height="80" fill="#f5f0ff" stroke="#ff7e79" rx="16"/><text x="67" y="34" class="head" text-anchor="middle">Robust set</text><text x="67" y="59" class="mini" text-anchor="middle">distorted inputs</text></g><text x="28" y="192" class="body">36 transformation types across challenge stages</text><text x="28" y="216" class="mini">Examples include blur, noise, compression, crop, watermarking, and adversarial removal.</text></g><g filter="url(#shadow)" transform="translate(80 492)"><rect width="820" height="252" fill="#f4f8ff" stroke="#46617e" rx="24"/><text x="28" y="43" fill="#8fa9c5" class="label">DETECTOR · AVERAGE ACROSS OPEN + HIDDEN TEST SPLITS</text><g transform="translate(28 72)"><rect width="364" height="136" fill="#edf3ff" stroke="#56b9ff" rx="20"/><text x="24" y="33" fill="#70c7ff" class="label">CLEAN ROC-AUC</text><text x="24" y="84" fill="#f7fbff" font-size="46" font-weight="780">0.9729</text><rect width="316" height="8" x="24" y="103" fill="#263c55" rx="4"/><rect width="307" height="8" x="24" y="103" fill="#56b9ff" rx="4"/></g><g transform="translate(414 72)"><rect width="378" height="136" fill="#f5f0ff" stroke="#ff7e79" rx="20"/><text x="24" y="33" fill="#ff9d98" class="label">ROBUST ROC-AUC</text><text x="24" y="84" fill="#f7fbff" font-size="46" font-weight="780">0.8679</text><rect width="330" height="8" x="24" y="103" fill="#fff5f6" rx="4"/><rect width="286" height="8" x="24" y="103" fill="#ff7e79" rx="4"/></g><text x="28" y="232" class="mini">ROC-AUC measures ranking across thresholds; higher is better. It is not accuracy at a chosen cutoff.</text></g><g filter="url(#shadow)" transform="translate(926 492)"><rect width="430" height="252" fill="#edf3ff" stroke="#b7f66e" stroke-opacity=".65" rx="24"/><text x="28" y="43" fill="#b7f66e" class="label">DEPLOYMENT BOUNDARIES</text><g transform="translate(28 70)"><circle cx="7" cy="7" r="6" fill="#ff7e79"/><text x="26" y="12" class="body">A score does not identify the generator.</text><circle cx="7" cy="54" r="6" fill="#ff7e79"/><text x="26" y="59" class="body">A score does not establish provenance.</text><circle cx="7" cy="101" r="6" fill="#ffbd5c"/><text x="26" y="106" class="body">Performance can shift on new domains.</text><circle cx="7" cy="148" r="6" fill="#b7f66e"/><text x="26" y="145" class="body">Validate an operating threshold on the</text><text x="26" y="165" class="body">target population and failure costs.</text></g></g><g transform="translate(80 778)"><rect width="1276" height="58" fill="#edf3ff" stroke="#384a60" rx="18"/><text x="24" y="36" fill="#ff9d98" class="label">INTERPRETATION</text><text x="250" y="36" class="body">The clean-to-robust gap shows why post-processing must be part of evaluation—not why every transformed image will fail.</text></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>