<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="900" aria-labelledby="title desc" preserveAspectRatio="xMidYMid meet" role="img" viewBox="0 0 1440 900"><title id="title">SynthFlag four-expert probability ensemble</title><desc id="desc">Two CLIP experts and two SigLIP experts each output a class-1 softmax probability. The released inference code adds P3, P4, P1, and P2 in that order and divides by four to produce a continuous probability of fake between zero and one.</desc><defs><linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f4f8ff"/><stop offset="1" stop-color="#f4f8ff"/></linearGradient><linearGradient id="out" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#edf9f7"/><stop offset="1" stop-color="#edf9f7"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="10" flood-color="#f4f8ff" flood-opacity=".48" stdDeviation="18"/></filter><marker id="arrow" markerHeight="11" markerWidth="11" orient="auto" refX="9" refY="5.5"><path fill="#8ea2bd" d="M0 0L11 5.5L0 11Z"/></marker><pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse"><path fill="none" stroke="#87a0bf" stroke-opacity=".055" d="M36 0H0V36"/></pattern><style>text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,&quot;Segoe UI&quot;,sans-serif}.kicker{font-size:15px;font-weight:700;letter-spacing:2.6px;fill:#8fa4be}.title{font-size:38px;font-weight:730;fill:#f5f8fc;letter-spacing:-.6px}.sub{font-size:17px;fill:#a9bbcf}.card-title{font-size:19px;font-weight:700;fill:#f6f9fd}.small{font-size:14px;fill:#9eb1c8}.label{font-size:13px;font-weight:700;letter-spacing:1.35px}.formula,.prob{fill:#f7fbff}.prob{font-size:23px;font-weight:750}.formula{font-size:25px;font-weight:680}.note{font-size:14px;fill:#b6c7da}</style><style>text{fill:#111827}.kicker,.label{fill:#2448c2}.note,.small,.sub{fill:#52627a}.card-title,.formula,.prob,.title{fill:#111827}</style></defs><rect width="1440" height="900" fill="url(#bg)" rx="32"/><rect width="1440" height="900" fill="url(#grid)" rx="32"/><rect width="1368" height="828" x="36" y="36" fill="none" stroke="#8ba2bd" stroke-opacity=".16" rx="26"/><text x="80" y="94" class="kicker">RELEASED CODE · INFERENCE</text><text x="80" y="143" class="title">Four opinions. One continuous score.</text><text x="80" y="178" class="sub">Each expert votes in probability space; every vote has exactly the same weight.</text><g transform="translate(1190 78)"><rect width="166" height="48" fill="#edf3ff" stroke="#39506c" rx="24"/><circle cx="25" cy="24" r="6" fill="#b7f66e"/><text x="43" y="29" fill="#dce8f5" font-size="14" font-weight="700">4 EXPERTS · ¼ EACH</text></g><g filter="url(#shadow)"><rect width="350" height="126" x="80" y="244" fill="#edf3ff" stroke="#56b9ff" stroke-opacity=".75" rx="19"/><rect width="8" height="126" x="80" y="244" fill="#56b9ff" rx="4"/><text x="112" y="277" fill="#70c7ff" class="label">CLIP LANE</text><text x="112" y="310" class="card-title">Expert 1 · CLIP</text><text x="112" y="339" class="small">ViT-L/14 · softmax → class 1</text><rect width="62" height="62" x="340" y="275" fill="#edf3ff" stroke="#56b9ff" rx="16"/><text x="371" y="313" class="prob" text-anchor="middle">P1</text><rect width="350" height="126" x="80" y="390" fill="#edf3ff" stroke="#56b9ff" stroke-opacity=".75" rx="19"/><rect width="8" height="126" x="80" y="390" fill="#56b9ff" rx="4"/><text x="112" y="423" fill="#70c7ff" class="label">CLIP LANE</text><text x="112" y="456" class="card-title">Expert 2 · CLIP</text><text x="112" y="485" class="small">ViT-L/14 · softmax → class 1</text><rect width="62" height="62" x="340" y="421" fill="#edf3ff" stroke="#56b9ff" rx="16"/><text x="371" y="459" class="prob" text-anchor="middle">P2</text><rect width="350" height="126" x="80" y="536" fill="#fff" stroke="#ffbd5c" stroke-opacity=".8" rx="19"/><rect width="8" height="126" x="80" y="536" fill="#ffbd5c" rx="4"/><text x="112" y="569" fill="#ffd07f" class="label">SIGLIP LANE</text><text x="112" y="602" class="card-title">Expert 3 · SigLIP</text><text x="112" y="631" class="small">So400M Patch14-384 · class 1</text><rect width="62" height="62" x="340" y="567" fill="#fff7e8" stroke="#ffbd5c" rx="16"/><text x="371" y="605" class="prob" text-anchor="middle">P3</text><rect width="350" height="126" x="80" y="682" fill="#fff" stroke="#ffbd5c" stroke-opacity=".8" rx="19"/><rect width="8" height="126" x="80" y="682" fill="#ffbd5c" rx="4"/><text x="112" y="715" fill="#ffd07f" class="label">SIGLIP LANE</text><text x="112" y="748" class="card-title">Expert 4 · SigLIP</text><text x="112" y="777" class="small">So400M Patch14-384 · class 1</text><rect width="62" height="62" x="340" y="713" fill="#fff7e8" stroke="#ffbd5c" rx="16"/><text x="371" y="751" class="prob" text-anchor="middle">P4</text></g><g fill="none" stroke="#8ea2bd" stroke-width="2.2" marker-end="url(#arrow)"><path d="M430 307H575V422H697"/><path d="M430 453H610V455H697"/><path d="M430 599H610V488H697"/><path d="M430 745H575V520H697"/></g><g filter="url(#shadow)" transform="translate(700 350)"><rect width="358" height="252" fill="#edf3ff" stroke="#8c72ff" stroke-opacity=".86" rx="24"/><text x="28" y="43" fill="#ad9aff" class="label">UNWEIGHTED FUSION</text><text x="28" y="82" class="card-title">Arithmetic mean</text><rect width="302" height="70" x="28" y="108" fill="#f4f8ff" stroke="#3b4964" rx="14"/><text x="179" y="151" class="formula" text-anchor="middle">(P3 + P4 + P1 + P2) / 4</text><text x="28" y="208" class="small">Exact released-code order</text><text x="28" y="232" class="small">No expert weighting · no thresholding</text></g><path fill="none" stroke="#b7f66e" stroke-width="3" marker-end="url(#arrow)" d="M1058 476H1110"/><g filter="url(#shadow)" transform="translate(1112 364)"><rect width="244" height="224" fill="url(#out)" stroke="#b7f66e" stroke-width="1.5" rx="24"/><text x="24" y="40" fill="#b7f66e" class="label">FINAL OUTPUT</text><text x="24" y="80" fill="#f6fff0" font-size="27" font-weight="760">P(fake)</text><text x="24" y="116" class="small">Continuous score</text><line x1="24" x2="220" y1="150" y2="150" stroke="#526a61"/><circle cx="24" cy="150" r="5" fill="#b7f66e"/><circle cx="220" cy="150" r="5" fill="#b7f66e"/><text x="24" y="178" class="small">0</text><text x="220" y="178" class="small" text-anchor="end">1</text><text x="24" y="204" class="small">Higher = more fake-like</text></g><g transform="translate(700 642)"><rect width="656" height="166" fill="#f4f8ff" stroke="#334862" rx="20"/><text x="24" y="37" fill="#90a8c3" class="label">HOW TO READ THIS</text><circle cx="30" cy="72" r="4" fill="#b7f66e"/><text x="46" y="77" class="note">Class 1 is the fake-image class in the released implementation.</text><circle cx="30" cy="106" r="4" fill="#b7f66e"/><text x="46" y="111" class="note">The score preserves ranking information; it is not a provenance claim.</text><circle cx="30" cy="140" r="4" fill="#b7f66e"/><text x="46" y="145" class="note">A deployment threshold is a separate, application-specific decision.</text></g><g aria-label="Historical baseline notice" pointer-events="none"><rect width="30%" height="36" x="67%" y="16" fill="#8b1d2c" opacity=".96" rx="8"/><text x="82%" y="40" fill="#fff" font-family="Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">HISTORICAL BASELINE · NOT SELECTED TEST1</text></g></svg>