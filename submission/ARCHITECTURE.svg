<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="980" aria-labelledby="title desc" role="img" viewBox="0 0 1600 980"><title id="title">SynthFlag four-expert inference architecture</title><desc id="desc">An input image is converted to RGB and sent through separate 224-pixel CLIP and 384-pixel SigLIP preprocessing paths. Two CLIP experts and two SigLIP experts each emit a fake-class probability. The four probabilities are averaged into one fake-image score, which the command-line interface writes with provenance metadata. A checkpoint manifest verifies all four checkpoint files before model loading.</desc><defs><linearGradient id="background" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#f7f9ff"/><stop offset="1" stop-color="#eef3ff"/></linearGradient><linearGradient id="brand" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#2448ff"/><stop offset="1" stop-color="#7656ff"/></linearGradient><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="8" flood-color="#10205c" flood-opacity=".1" stdDeviation="12"/></filter><marker id="arrow" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#536178" d="M 0 0 L 10 5 L 0 10 z"/></marker><style>.title{font:700 40px Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.subtitle{font:400 18px Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#5d6a7e}.stage{font:700 14px Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;letter-spacing:1.4px;fill:#657189}.node-title{font:700 20px Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#172033}.node-copy{font:400 15px Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#536178}.node-copy-strong{font:600 15px Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#26334b}.inverse-title{font:700 22px Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#fff}.inverse-copy{font:400 15px Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#e8ebff}.small{font:400 13px Inter,-apple-system,BlinkMacSystemFont,&quot;Segoe UI&quot;,sans-serif;fill:#657189}.card{fill:#fff;stroke:#d9e1ef;stroke-width:1.5;filter:url(#shadow)}.path-card{fill:#f3f6ff;stroke:#b8c7ff;stroke-width:1.5}.expert-clip,.expert-siglip{fill:#edf2ff;stroke:#7190ff;stroke-width:1.5}.expert-siglip{fill:#f3efff;stroke:#a38bff}.connector,.connector-soft{fill:none;stroke:#536178;stroke-width:2.2;marker-end:url(#arrow)}.connector-soft{stroke:#8793a8;stroke-width:1.7}.divider{stroke:#d9e1ef;stroke-width:1}</style></defs><rect width="1600" height="980" fill="url(#background)"/><text x="70" y="72" class="title">SynthFlag inference architecture</text><text x="70" y="106" class="subtitle">Public product: SynthFlag · Underlying detector/package: FeatDistill · Inference only</text><text x="70" y="164" class="stage">1 INPUT</text><text x="340" y="164" class="stage">2 DETERMINISTIC PREPROCESSING</text><text x="675" y="164" class="stage">3 FOUR INDEPENDENT EXPERTS</text><text x="1090" y="164" class="stage">4 FUSION</text><text x="1350" y="164" class="stage">5 OUTPUT</text><rect width="220" height="190" x="70" y="200" class="card" rx="22"/><rect width="168" height="82" x="96" y="228" fill="#e8eeff" stroke="#9fb2f5" rx="14"/><path fill="none" stroke="#2448ff" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M117 286 L151 254 L180 277 L206 248 L244 288"/><circle cx="216" cy="252" r="9" fill="#7656ff"/><text x="180" y="339" class="node-title" text-anchor="middle">Input image</text><text x="180" y="365" class="node-copy" text-anchor="middle">Decode, then convert to RGB</text><rect width="270" height="190" x="340" y="200" class="path-card" rx="22"/><text x="370" y="235" class="node-title">CLIP path</text><line x1="370" x2="580" y1="252" y2="252" class="divider"/><text x="370" y="282" class="node-copy-strong">224 × 224</text><text x="370" y="309" class="node-copy">Bicubic resize</text><text x="370" y="333" class="node-copy">Center crop</text><text x="370" y="357" class="node-copy">Released CLIP normalization</text><rect width="270" height="190" x="340" y="490" class="path-card" rx="22"/><text x="370" y="525" class="node-title">SigLIP path</text><line x1="370" x2="580" y1="542" y2="542" class="divider"/><text x="370" y="572" class="node-copy-strong">384 × 384</text><text x="370" y="599" class="node-copy">Bicubic resize</text><text x="370" y="623" class="node-copy">Center crop</text><text x="370" y="647" class="node-copy">Normalize to the [-1, 1] range</text><path d="M290 295 C315 295 315 295 340 295" class="connector"/><path d="M290 320 C318 320 318 585 340 585" class="connector"/><rect width="335" height="150" x="675" y="190" class="expert-clip" rx="20"/><text x="703" y="225" class="node-title">Expert 1 · CLIP ViT-L/14</text><text x="703" y="255" class="node-copy">768-d projected feature</text><text x="703" y="280" class="node-copy">Head: 768 → 256 → 2 logits</text><rect width="107" height="26" x="877" y="295" fill="#2448ff" rx="13"/><text x="930.5" y="313" class="inverse-copy" text-anchor="middle">P1(fake)</text><rect width="335" height="150" x="675" y="365" class="expert-clip" rx="20"/><text x="703" y="400" class="node-title">Expert 2 · CLIP ViT-L/14</text><text x="703" y="430" class="node-copy">768-d projected feature</text><text x="703" y="455" class="node-copy">Head: 768 → 256 → 2 logits</text><rect width="107" height="26" x="877" y="470" fill="#2448ff" rx="13"/><text x="930.5" y="488" class="inverse-copy" text-anchor="middle">P2(fake)</text><rect width="335" height="150" x="675" y="540" class="expert-siglip" rx="20"/><text x="703" y="575" class="node-title">Expert 3 · SigLIP So400M</text><text x="703" y="605" class="node-copy">1,152-d pooled feature</text><text x="703" y="630" class="node-copy">Head: 1152 → 256 → 2 logits</text><rect width="107" height="26" x="877" y="645" fill="#7656ff" rx="13"/><text x="930.5" y="663" class="inverse-copy" text-anchor="middle">P3(fake)</text><rect width="335" height="150" x="675" y="715" class="expert-siglip" rx="20"/><text x="703" y="750" class="node-title">Expert 4 · SigLIP So400M</text><text x="703" y="780" class="node-copy">1,152-d pooled feature</text><text x="703" y="805" class="node-copy">Head: 1152 → 256 → 2 logits</text><rect width="107" height="26" x="877" y="820" fill="#7656ff" rx="13"/><text x="930.5" y="838" class="inverse-copy" text-anchor="middle">P4(fake)</text><path d="M610 267 C640 267 645 265 675 265" class="connector-soft"/><path d="M610 322 C650 322 640 440 675 440" class="connector-soft"/><path d="M610 570 C640 570 645 615 675 615" class="connector-soft"/><path d="M610 630 C650 630 640 790 675 790" class="connector-soft"/><rect width="210" height="255" x="1080" y="330" fill="url(#brand)" filter="url(#shadow)" rx="28"/><text x="1185" y="374" class="inverse-title" text-anchor="middle">Probability mean</text><text x="1185" y="408" class="inverse-copy" text-anchor="middle">Softmax each expert</text><text x="1185" y="434" class="inverse-copy" text-anchor="middle">Select class index 1</text><rect width="150" height="72" x="1110" y="466" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".28" rx="16"/><text x="1185" y="496" class="inverse-copy" text-anchor="middle">P3 + P4 + P1 + P2</text><line x1="1130" x2="1240" y1="510" y2="510" stroke="#fff" stroke-width="1.5"/><text x="1185" y="531" class="inverse-copy" text-anchor="middle">4</text><text x="1185" y="562" class="inverse-copy" text-anchor="middle">Unweighted, no TTA</text><path d="M1010 295 C1045 295 1040 390 1080 390" class="connector-soft"/><path d="M1010 470 C1040 470 1040 450 1080 450" class="connector-soft"/><path d="M1010 645 C1040 645 1040 510 1080 510" class="connector-soft"/><path d="M1010 820 C1050 820 1040 565 1080 565" class="connector-soft"/><rect width="190" height="180" x="1350" y="265" class="card" rx="22"/><text x="1445" y="310" class="node-title" text-anchor="middle">Fake score</text><text x="1445" y="350" class="title" text-anchor="middle" style="font-size:34px">0 … 1</text><text x="1445" y="383" class="node-copy" text-anchor="middle">Continuous output</text><text x="1445" y="408" class="small" text-anchor="middle">No hard-label default</text><path d="M1290 430 C1315 430 1320 355 1350 355" class="connector"/><rect width="190" height="170" x="1350" y="505" class="card" rx="22"/><text x="1377" y="545" class="node-title">CLI artifacts</text><line x1="1377" x2="1513" y1="562" y2="562" class="divider"/><text x="1377" y="593" class="node-copy-strong">predictions.csv</text><text x="1377" y="620" class="node-copy-strong">predictions.meta.json</text><text x="1377" y="648" class="small">Resumable + provenance-bound</text><path d="M1445 445 L1445 505" class="connector"/><rect width="540" height="105" x="70" y="785" fill="#fff8e8" stroke="#e8c86a" stroke-width="1.5" rx="20"/><text x="98" y="821" class="node-title">Checkpoint identity gate</text><text x="98" y="850" class="node-copy">manifest.json verifies expected byte size + SHA-256</text><text x="98" y="875" class="small">All four files pass before tensor-only state dictionaries are loaded.</text><path d="M610 838 C640 838 640 840 675 840" class="connector-soft"/><text x="70" y="943" class="small">Decision thresholds are downstream operating points: 0.5 (historical) or 0.2874746155139839 (calibration-fitted balanced profile). Threshold changes do not alter ROC-AUC.</text></svg>