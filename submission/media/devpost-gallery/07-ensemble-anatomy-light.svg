<text x="64" y="125" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" fill="#2970FF" text-anchor="start" letter-spacing="2.2">FOUR-EXPERT ENSEMBLE ANATOMY</text>
<text x="64" y="172" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="43" font-weight="800" fill="#111827" text-anchor="start">Diversity by backbone. Simplicity at fusion.</text>
<text x="64" y="210" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="20" font-weight="500" fill="#53627A" text-anchor="start">Four independent checkpoint-backed experts contribute one vote each—no expert gets a hidden weight.</text>
