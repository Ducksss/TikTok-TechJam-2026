<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" aria-labelledby="title desc" role="img" viewBox="0 0 1536 1024"><title id="title">SynthFlag short-video sampled-frame pipeline</title><desc id="desc">A one-to-ten-second MP4 or WebM is decoded in the browser into eight midpoint 384-pixel crops; ordered frames are scored in two-frame microbatches and returned as a timeline plus descriptive summary.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#DDE7FA" stroke-width="1" d="M 32 0 L 0 0 0 32" opacity=".55"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#000" flood-opacity=".1" stdDeviation="18"/></filter><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2970FF" d="M0,0 L12,6 L0,12 Z"/></marker></defs><rect width="1536" height="1024" fill="#F4F7FE"/><rect width="1536" height="1024" fill="url(#grid)"/><rect width="8" height="20" x="64" y="49" fill="#0040C1" rx="4"/><rect width="8" height="30" x="76" y="39" fill="#0040C1" rx="4"/><rect width="8" height="42" x="88" y="27" fill="#0040C1" rx="4"/><rect width="8" height="54" x="100" y="15" fill="#2970FF" rx="4"/><text x="124" y="66" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">SynthFlag</text><rect width="164" height="38" x="1308" y="38" fill="#DCE8FF" stroke="#C4D5F3" stroke-width="1.5" rx="19"/><text x="1390" y="62.1" fill="#0040C1" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".7" text-anchor="middle">TECHJAM 2026</text><text x="64" y="125" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.2" text-anchor="start">SHORT-VIDEO PIPELINE</text><text x="64" y="172" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="43" font-weight="800" text-anchor="start">Eight local samples. One inspectable timeline.</text><text x="64" y="210" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">The raw video stays in the browser; only ordered midpoint crops are sent for image-model scoring.</text><line x1="64" x2="1472" y1="226" y2="226" stroke="#C4D5F3" stroke-linecap="round" stroke-width="2"/><rect width="260" height="470" x="64" y="278" fill="#FFF" stroke="#C4D5F3" stroke-width="2" filter="url(#shadow)" rx="24"/><circle cx="105" cy="313" r="17" fill="#0040C1"/><text x="105" y="319" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">1</text><text x="134" y="320" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="start">LOCAL VIDEO</text><rect width="212" height="142" x="88" y="354" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="16"/><path fill="#2970FF" d="M118 386 L118 464 L184 425 Z"/><text x="210" y="408" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start">MP4 / WebM</text><text x="210" y="438" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">1–10 seconds</text><text x="210" y="466" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">≤ 50 MB</text><rect width="212" height="38" x="88" y="530" fill="#0040C1" rx="19"/><text x="194" y="553.42" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".7" text-anchor="middle">DECODE IN BROWSER</text><text x="88" y="604" fill="#087A55" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">Original video</text><text x="88" y="632.75" fill="#087A55" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">never uploaded</text><rect width="474" height="470" x="368" y="278" fill="#FFF" stroke="#0040C1" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="409" cy="313" r="17" fill="#0040C1"/><text x="409" y="319" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">2</text><text x="438" y="320" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="start">EIGHT MIDPOINT CROPS</text><rect width="88" height="88" x="392" y="368" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="12"/><text x="436" y="408" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle">F1</text><text x="436" y="434" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">384²</text><text x="436" y="478" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">0.5/8</text><rect width="88" height="88" x="496" y="368" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="12"/><text x="540" y="408" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="middle">F2</text><text x="540" y="434" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle">384²</text><text x="540" y="478" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="600" text-anchor="middle">1.5/8</text><rect width="88" height="88" x="600" y="368