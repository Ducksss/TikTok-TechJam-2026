<title id="title">SynthFlag short-video sampled-frame pipeline</title>
<desc id="desc">A one-to-ten-second MP4 or WebM is decoded in the browser into eight midpoint 384-pixel crops; ordered frames are scored in two-frame microbatches and returned as a timeline plus descriptive summary.</desc>
