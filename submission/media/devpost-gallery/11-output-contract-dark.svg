ight="92" x="88" y="616" fill="#132541" stroke="#F2C14E" stroke-width="2" rx="16"/><text x="108" y="650" fill="#F2C14E" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.1" text-anchor="start">EXCLUSIVE LOCK</text><text x="108" y="682" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="700" text-anchor="start">one writer per output dir</text><rect width="306" height="480" x="398" y="274" fill="#0E1B30" stroke="#45D39A" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="437" cy="309" r="17" fill="#2970FF"/><text x="437" y="315" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">2</text><text x="466" y="316" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="start">ARTIFACT</text><text x="420" y="390" fill="#45D39A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">predictions.csv</text><line x1="420" x2="682" y1="416" y2="416" stroke="#2A4672" stroke-linecap="round" stroke-width="1.5"/><rect width="262" height="50" x="420" y="454" fill="#132541" stroke="#2A4672" stroke-width="2" rx="12"/><text x="440" y="486" fill="#F8FAFF" font-family="SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" text-anchor="start">image_name</text><rect width="262" height="50" x="420" y="524" fill="#132541" stroke="#2A4672" stroke-width="2" rx="12"/><text x="440" y="556" fill="#F8FAFF" font-family="SFMono-Regular, Menlo, monospace" font-size="17" font-weight="700" text-anchor="start">score</text><rect width="262" height="38" x="420" y="626" fill="#123A82" stroke="#2A4672" stroke-width="1.5" rx="19"/><text x="551" y="649.08" fill="#45D39A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" letter-spac