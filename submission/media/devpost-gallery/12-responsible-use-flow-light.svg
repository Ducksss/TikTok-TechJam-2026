<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" aria-labelledby="title desc" role="img" viewBox="0 0 1536 1024"><title id="title">SynthFlag responsible-use decision flow</title><desc id="desc">A continuous score passes through explicit threshold policy, context review, and human judgment; it is not proof, generator attribution, or localization.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#DDE7FA" stroke-width="1" d="M 32 0 L 0 0 0 32" opacity=".55"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#000" flood-opacity=".1" stdDeviation="18"/></filter><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2970FF" d="M0,0 L12,6 L0,12 Z"/></marker></defs><rect width="1536" height="1024" fill="#F4F7FE"/><rect width="1536" height="1024" fill="url(#grid)"/><rect width="8" height="20" x="64" y="49" fill="#0040C1" rx="4"/><rect width="8" height="30" x="76" y="39" fill="#0040C1" rx="4"/><rect width="8" height="42" x="88" y="27" fill="#0040C1" rx="4"/><rect width="8" height="54" x="100" y="15" fill="#2970FF" rx="4"/><text x="124" y="66" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">SynthFlag</text><rect width="164" height="38" x="1308" y="38" fill="#DCE8FF" stroke="#C4D5F3" stroke-width="1.5" rx="19"/><text x="1390" y="62.1" fill="#0040C1" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".7" text-anchor="middle">TECHJAM 2026</text><text x="64" y="125" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.2" text-anchor="start">RESPONSIBLE-USE FLOW</text><text x="64" y="172" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="43" font-weight="800" text-anchor="start">Evidence supports a decision. It does not replace one.</text><text x="64" y="210" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">SynthFlag keeps model output, deployment policy, context, and human judgment visibly separate.</text><line x1="64" x2="1472" y1="226" y2="226" stroke="#C4D5F3" stroke-linecap="round" stroke-width="2"/><rect width="300" height="430" x="64" y="292" fill="#FFF" stroke="#2970FF" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="102" cy="330" r="22" fill="#2970FF"/><text x="102" y="337" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">1</text><text x="138" y="337" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2" text-anchor="start">MODEL SIGNAL</text><text x="88" y="410" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">Continuous 0 → 1</text><text x="88" y="437.6" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">score</text><line x1="88" x2="340" y1="478" y2="478" stroke="#C4D5F3" stroke-linecap="round" stroke-width="1.5"/><text x="88" y="520" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Routed three-head signal</text><text x="88" y="543.2" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">No hard label in the CLI</text><text x="214" y="638" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="middle">0 ━━━━━ 1</text><rect width="300" height="430" x="414" y="292" fill="#FFF" stroke="#0040C1" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="452" cy="330" r="22" fill="#0040C1"/><text x="452" y="337" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">2</text><text x="488" y="337" fill="#0040C1" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2" text-anchor="start">POLICY</text><text x="438" y="410" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">Choose an</text><text x="438" y="437.6" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">operating point</text><line x1="438" x2="690" y1="478" y2="478" stroke="#C4D5F3" stroke-linecap="round" stroke-width="1.5"/><text x="438" y="520" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">TEST1 reports fixed 0.5</text><text x="438" y="543.2" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Calibrate for deployment</text><rect width="196" height="38" x="466" y="608" fill="#DCE8FF" stroke="#C4D5F3" stroke-width="1.5" rx="19"/><text x="564" y="631.08" fill="#0040C1" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7" text-anchor="middle">THRESHOLD ≠ SCORE</text><rect width="300" height="430" x="764" y="292" fill="#FFF" stroke="#A06400" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="802" cy="330" r="22" fill="#A06400"/><text x="802" y="337" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">3</text><text x="838" y="337" fill="#A06400" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2" text-anchor="start">CONTEXT REVIEW</text><text x="788" y="410" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">Ask what changed</text><text x="788" y="437.6" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">the pixels</text><line x1="788" x2="1040" y1="478" y2="478" stroke="#C4D5F3" stroke-linecap="round" stroke-width="1.5"/><text x="788" y="520" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Compression • resize</text><text x="788" y="543.2" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">screenshots • new generators</text><text x="788" y="566.4" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">unfamiliar domains</text><rect width="196" height="38" x="816" y="608" fill="#EDF3FF" stroke="#A06400" stroke-width="1.5" rx="19"/><text x="914" y="631.08" fill="#A06400" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7" text-anchor="middle">DOMAIN MATTERS</text><rect width="300" height="430" x="1114" y="292" fill="#FFF" stroke="#087A55" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="1152" cy="330" r="22" fill="#087A55"/><text x="1152" y="337" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">4</text><text x="1188" y="337" fill="#087A55" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.2" text-anchor="start">HUMAN DECISION</text><text x="1138" y="410" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">Use judgment +</text><text x="1138" y="437.6" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">other evidence</text><line x1="1138" x2="1390" y1="478" y2="478" stroke="#C4D5F3" stroke-linecap="round" stroke-width="1.5"/><text x="1138" y="520" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Escalate consequential cases</text><text x="1138" y="543.2" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="start">Record uncertainty</text><circle cx="1264" cy="628" r="28" fill="#087A55"/><path fill="none" stroke="#FFF" stroke-linecap="round" stroke-linejoin="round" stroke-width="5" d="M1250 628 L1261 639 L1280 616"/><line x1="372" x2="402" y1="510" y2="510" stroke="#2970FF" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow)"/><line x1="722" x2="752" y1="510" y2="510" stroke="#2970FF" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow)"/><line x1="1072" x2="1102" y1="510" y2="510" stroke="#2970FF" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow)"/><rect width="1408" height="166" x="64" y="770" fill="#EDF3FF" stroke="#C83349" stroke-width="2.5" rx="22"/><rect width="170" height="38" x="90" y="798" fill="#C83349" rx="19"/><text x="175" y="821.76" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">NOT A CLAIM</text><rect width="260" height="50" x="292" y="798" fill="#FFF" stroke="#C4D5F3" stroke-width="2" rx="14"/><text x="422" y="830" fill="#C83349" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing=".5" text-anchor="middle">PROOF OF ORIGIN</text><rect width="260" height="50" x="578" y="798" fill="#FFF" stroke="#C4D5F3" stroke-width="2" rx="14"/><text x="708" y="830" fill="#C83349" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing=".5" text-anchor="middle">GENERATOR ATTRIBUTION</text><rect width="260" height="50" x="864" y="798" fill="#FFF" stroke="#C4D5F3" stroke-width="2" rx="14"/><text x="994" y="830" fill="#C83349" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing=".5" text-anchor="middle">LOCALIZATION</text><rect width="260" height="50" x="1150" y="798" fill="#FFF" stroke="#C4D5F3" stroke-width="2" rx="14"/><text x="1280" y="830" fill="#C83349" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="800" letter-spacing=".5" text-anchor="middle">UNIVERSAL CALIBRATION</text><text x="90" y="894" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">For consequential use, combine the signal with provenance, policy, and human review.</text><line x1="64" x2="1472" y1="970" y2="970" stroke="#C4D5F3" stroke-linecap="round" stroke-width="1.5"/><text x="64" y="998" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">Source: submission/MODEL_CARD.md • submission/README.md • released CLI contract</text><text x="1472" y="998" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">Evidence before certainty</text></svg>