<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc">
<title id="title">SynthFlag responsible-use decision flow</title>
<desc id="desc">A continuous score passes through explicit threshold policy, context review, and human judgment; it is not proof, generator attribution, or localization.</desc>
<defs>
<pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M 32 0 L 0 0 0 32" fill="none" stroke="#DDE7FA" stroke-width="1" opacity="0.55"/></pattern>
<filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#000000" flood-opacity="0.1"/></filter>
<marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L12,6 L0,12 Z" fill="#2970FF"/></marker>
</defs>
<rect width="1536" height="1024" fill="#F4F7FE"/>
<rect width="1536" height="1024" fill="url(#grid)"/>
<rect x="64" y="49" width="8" height="20" rx="4" fill="#0040C1"/>
<rect x="76" y="39" width="8" height="30" rx="4" fill="#0040C1"/>
<rect x="88" y="27" width="8" height="42" rx="4" fill="#0040C1"/>
<rect x="100" y="15" width="8" height="54" rx="4" fill="#2970FF"/>
<text x="124" y="66" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" fill="#111827" text-anchor="start">SynthFlag</text>
<rect x="1308" y="38" width="164" height="38" rx="19.0" fill="#DCE8FF" stroke="#C4D5F3" stroke-width="1.5"/>
<text x="1390.0" y="62.1" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#0040C1" text-anchor="middle" letter-spacing="0.7">TECHJAM 2026</text>
<text x="64" y="125" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" fill="#2970FF" text-anchor="start" letter-spacing="2.2">RESPONSIBLE-USE FLOW</text>
<text x="64" y="172" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="43" font-weight="800" fill="#111827" text-anchor="start">Evidence supports a decision. It does not replace one.</text>
<text x="64" y="210" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="20" font-weight="500" fill="#53627A" text-anchor="start">SynthFlag keeps model output, deployment policy, context, and human judgment visibly separate.</text>
<line x1="64" y1="226" x2="1472" y2="226" stroke="#C4D5F3" stroke-width="2" stroke-linecap="round"/>
<rect x="64" y="292" width="300" height="430" rx="24" fill="#FFFFFF" stroke="#2970FF" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="102" cy="330" r="22" fill="#2970FF"/>
<text x="102" y="337" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">1</text>
<text x="138" y="337" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#2970FF" text-anchor="start" letter-spacing="1.2">MODEL SIGNAL</text>
<text x="88" y="410.0" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="start">Continuous 0 → 1</text>
<text x="88" y="437.6" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="start">score</text>
<line x1="88" y1="478" x2="340" y2="478" stroke="#C4D5F3" stroke-width="1.5" stroke-linecap="round"/>
<text x="88" y="520.0" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#53627A" text-anchor="start">Routed three-head signal</text>
<text x="88" y="543.2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#53627A" text-anchor="start">No hard label in the CLI</text>
<text x="214" y="638" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="25" font-weight="800" fill="#2970FF" text-anchor="middle">0 ━━━━━ 1</text>
<rect x="414" y="292" width="300" height="430" rx="24" fill="#FFFFFF" stroke="#0040C1" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="452" cy="330" r="22" fill="#0040C1"/>
<text x="452" y="337" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">2</text>
<text x="488" y="337" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#0040C1" text-anchor="start" letter-spacing="1.2">POLICY</text>
<text x="438" y="410.0" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="start">Choose an</text>
<text x="438" y="437.6" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="start">operating point</text>
<line x1="438" y1="478" x2="690" y2="478" stroke="#C4D5F3" stroke-width="1.5" stroke-linecap="round"/>
<text x="438" y="520.0" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#53627A" text-anchor="start">TEST1 reports fixed 0.5</text>
<text x="438" y="543.2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#53627A" text-anchor="start">Calibrate for deployment</text>
<rect x="466" y="608" width="196" height="38" rx="19.0" fill="#DCE8FF" stroke="#C4D5F3" stroke-width="1.5"/>
<text x="564.0" y="631.08" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#0040C1" text-anchor="middle" letter-spacing="0.7">THRESHOLD ≠ SCORE</text>
<rect x="764" y="292" width="300" height="430" rx="24" fill="#FFFFFF" stroke="#A06400" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="802" cy="330" r="22" fill="#A06400"/>
<text x="802" y="337" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#111827" text-anchor="middle">3</text>
<text x="838" y="337" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#A06400" text-anchor="start" letter-spacing="1.2">CONTEXT REVIEW</text>
<text x="788" y="410.0" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="start">Ask what changed</text>
<text x="788" y="437.6" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="start">the pixels</text>
<line x1="788" y1="478" x2="1040" y2="478" stroke="#C4D5F3" stroke-width="1.5" stroke-linecap="round"/>
<text x="788" y="520.0" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#53627A" text-anchor="start">Compression • resize</text>
<text x="788" y="543.2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#53627A" text-anchor="start">screenshots • new generators</text>
<text x="788" y="566.4" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#53627A" text-anchor="start">unfamiliar domains</text>
<rect x="816" y="608" width="196" height="38" rx="19.0" fill="#EDF3FF" stroke="#A06400" stroke-width="1.5"/>
<text x="914.0" y="631.08" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" fill="#A06400" text-anchor="middle" letter-spacing="0.7">DOMAIN MATTERS</text>
<rect x="1114" y="292" width="300" height="430" rx="24" fill="#FFFFFF" stroke="#087A55" stroke-width="2.5" filter="url(#shadow)"/>
<circle cx="1152" cy="330" r="22" fill="#087A55"/>
<text x="1152" y="337" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#FFFFFF" text-anchor="middle">4</text>
<text x="1188" y="337" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" fill="#087A55" text-anchor="start" letter-spacing="1.2">HUMAN DECISION</text>
<text x="1138" y="410.0" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="start">Use judgment +</text>
<text x="1138" y="437.6" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" fill="#111827" text-anchor="start">other evidence</text>
<line x1="1138" y1="478" x2="1390" y2="478" stroke="#C4D5F3" stroke-width="1.5" stroke-linecap="round"/>
<text x="1138" y="520.0" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#53627A" text-anchor="start">Escalate consequential cases</text>
<text x="1138" y="543.2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" fill="#53627A" text-anchor="start">Record uncertainty</text>
<circle cx="1264" cy="628" r="28" fill="#087A55"/>
<path d="M1250 628 L1261 639 L1280 616" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
