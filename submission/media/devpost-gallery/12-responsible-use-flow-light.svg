<line x1="722" y1="510" x2="752" y2="510" stroke="#2970FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<line x1="1072" y1="510" x2="1102" y2="510" stroke="#2970FF" stroke-width="4" stroke-linecap="round" marker-end="url(#arrow)"/>
<rect x="64" y="770" width="1408" height="166" rx="22" fill="#EDF3FF" stroke="#C83349" stroke-width="2.5"/>
<rect x="90" y="798" width="170" height="38" rx="19.0" fill="#C83349"/>
<text x="175.0" y="821.76" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.7">NOT A CLAIM</text>
<rect x="292" y="798" width="260" height="50" rx="14" fill="#FFFFFF" stroke="#C4D5F3" stroke-width="2"/>
<text x="422" y="830" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="800" fill="#C83349" text-anchor="middle" letter-spacing="0.5">PROOF OF ORIGIN</text>
<rect x="578" y="798" width="260" height="50" rx="14" fill="#FFFFFF" stroke="#C4D5F3" stroke-width="2"/>
<text x="708" y="830" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="800" fill="#C83349" text-anchor="middle" letter-spacing="0.5">GENERATOR ATTRIBUTION</text>
<rect x="864" y="798" width="260" height="50" rx="14" fill="#FFFFFF" stroke="#C4D5F3" stroke-width="2"/>
<text x="994" y="830" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="800" fill="#C83349" text-anchor="middle" letter-spacing="0.5">LOCALIZATION</text>
<rect x="1150" y="798" width="260" height="50" rx="14" fill="#FFFFFF" stroke="#C4D5F3" stroke-width="2"/>
<text x="1280" y="830" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="800" fill="#C83349" text-anchor="middle" letter-spacing="0.5">UNIVERSAL CALIBRATION</text>
<text x="90" y="894" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="22" font-weight="800" fill="#111827" text-anchor="start">For consequential use, combine the signal with provenance, policy, and human review.</text>
<line x1="64" y1="970" x2="1472" y2="970" stroke="#C4D5F3" stroke-width="1.5" stroke-linecap="round"/>
<text x="64" y="998" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="500" fill="#53627A" text-anchor="start">Source: submission/MODEL_CARD.md • submission/README.md • released CLI contract</text>
<text x="1472" y="998" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#2970FF" text-anchor="end">Evidence before certainty</text>
</svg>
