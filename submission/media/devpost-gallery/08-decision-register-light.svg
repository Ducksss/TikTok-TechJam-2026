<title id="title">SynthFlag model decision register</title>
<desc id="desc">Four evidence-labeled decisions: keep equal-mean fusion, adopt an independently selected threshold, reject learned disagreement fusion after three leave-one-dataset-out failures, and block V3 without the exact organizer dataset.</desc>
<defs>
