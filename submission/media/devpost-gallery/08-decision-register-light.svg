<text x="1390.0" y="62.1" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" fill="#0040C1" text-anchor="middle" letter-spacing="0.7">TECHJAM 2026</text>
<text x="64" y="125" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" fill="#2970FF" text-anchor="start" letter-spacing="2.2">MODEL DECISION REGISTER</text>
<text x="64" y="172" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="43" font-weight="800" fill="#111827" text-anchor="start">What shipped—and what the evidence stopped.</text>
<text x="64" y="210" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="20" font-weight="500" fill="#53627A" text-anchor="start">Each decision carries its evidence boundary so a promising experiment cannot quietly become a production claim.</text>
