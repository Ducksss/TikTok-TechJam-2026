<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" aria-labelledby="title desc" role="img" viewBox="0 0 1536 1024"><title id="title">Historical SynthFlag four-expert ensemble anatomy</title><desc id="desc">Historical V1/V2 baseline: two CLIP and two SigLIP experts produced four probabilities averaged equally. This is not the selected TEST1 runtime.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#13213A" stroke-width="1" d="M 32 0 L 0 0 0 32" opacity=".55"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#000" flood-opacity=".28" stdDeviation="18"/></filter><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#79A8FF" d="M0,0 L12,6 L0,12 Z"/></marker></defs><rect width="1536" height="1024" fill="#07111F"/><rect width="1536" height="1024" fill="url(#grid)"/><rect width="8" height="20" x="64" y="49" fill="#2970FF" rx="4"/><rect width="8" height="30" x="76" y="39" fill="#2970FF" rx="4"/><rect width="8" height="42" x="88" y="27" fill="#2970FF" rx="4"/><rect width="8" height="54" x="100" y="15" fill="#79A8FF" rx="4"/><text x="124" y="66" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">SynthFlag</text><rect width="164" height="38" x="1308" y="38" fill="#123A82" stroke="#2A4672" stroke-width="1.5" rx="19"/><text x="1390" y="62.1" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".7" text-anchor="middle">TECHJAM 2026</text><text x="64" y="125" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.2" text-anchor="start">FOUR-EXPERT ENSEMBLE ANATOMY</text><text x="64" y="172" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="43" font-weight="800" text-anchor="start">Diversity by backbone. Simplicity at fusion.</text><text x="64" y="210" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Four independent checkpoint-backed experts contribute one vote each—no expert gets a hidden weight.</text><line x1="64" x2="1472" y1="226" y2="226" stroke="#2A4672" stroke-linecap="round" stroke-width="2"/><rect width="1408" height="26" x="64" y="232" fill="#FF7184" rx="8"/><text x="768" y="251" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.1" text-anchor="middle">HISTORICAL V1/V2 BASELINE · NOT THE SELECTED TEST1 RUNTIME</text><rect width="680" height="418" x="64" y="266" fill="#0E1B30" stroke="#2970FF" stroke-width="2.5" filter="url(#shadow)" rx="24"/><rect width="680" height="418" x="792" y="266" fill="#0E1B30" stroke="#79A8FF" stroke-width="2.5" filter="url(#shadow)" rx="24"/><rect width="192" height="40" x="88" y="292" fill="#2970FF" rx="20"/><text x="184" y="317.1" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".7" text-anchor="middle">CLIP FAMILY • 224 PX</text><text x="88" y="372" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="29" font-weight="800" text-anchor="start">ViT-L/14 vision encoder</text><text x="88" y="405" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">24 layers • 16 heads • 14 px patches</text><rect width="240" height="40" x="816" y="292" fill="#79A8FF" rx="20"/><text x="936" y="317.1" fill="#07111F" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".7" text-anchor="middle">SIGLIP FAMILY • 384 PX</text><text x="816" y="372" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="29" font-weight="800" text-anchor="start">So400M Patch14-384 encoder</text><text x="816" y="405" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">27 layers • 16 heads • 14 px patches</text><rect width="298" height="194" x="88" y="446" fill="#132541" stroke="#2A4672" stroke-width="2" rx="18"/><circle cx="126" cy="485" r="22" fill="#2970FF"/><text x="126" y="492" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">E1</text><text x="162" y="489" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start">independent expert</text><text x="112" y="536" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="start">768 → 256 → 2</text><text x="112" y="566" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Linear • ReLU • Dropout 0.3 • Linear</text><rect width="250" height="30" x="112" y="591" fill="#0E1B30" stroke="#2A4672" stroke-width="1.5" rx="15"/><text x="237" y="610.42" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".7" text-anchor="middle">softmax(logits)[:, 1] = P1</text><rect width="298" height="194" x="422" y="446" fill="#132541" stroke="#2A4672" stroke-width="2" rx="18"/><circle cx="460" cy="485" r="22" fill="#2970FF"/><text x="460" y="492" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">E2</text><text x="496" y="489" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start">independent expert</text><text x="446" y="536" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="start">768 → 256 → 2</text><text x="446" y="566" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Linear • ReLU • Dropout 0.3 • Linear</text><rect width="250" height="30" x="446" y="591" fill="#0E1B30" stroke="#2A4672" stroke-width="1.5" rx="15"/><text x="571" y="610.42" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".7" text-anchor="middle">softmax(logits)[:, 1] = P2</text><rect width="298" height="194" x="816" y="446" fill="#132541" stroke="#2A4672" stroke-width="2" rx="18"/><circle cx="854" cy="485" r="22" fill="#79A8FF"/><text x="854" y="492" fill="#07111F" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">E3</text><text x="890" y="489" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start">independent expert</text><text x="840" y="536" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="start">1152 → 256 → 2</text><text x="840" y="566" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Linear • ReLU • Dropout 0.3 • Linear</text><rect width="250" height="30" x="840" y="591" fill="#0E1B30" stroke="#2A4672" stroke-width="1.5" rx="15"/><text x="965" y="610.42" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".7" text-anchor="middle">softmax(logits)[:, 1] = P3</text><rect width="298" height="194" x="1150" y="446" fill="#132541" stroke="#2A4672" stroke-width="2" rx="18"/><circle cx="1188" cy="485" r="22" fill="#79A8FF"/><text x="1188" y="492" fill="#07111F" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">E4</text><text x="1224" y="489" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start">independent expert</text><text x="1174" y="536" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="30" font-weight="800" text-anchor="start">1152 → 256 → 2</text><text x="1174" y="566" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="600" text-anchor="start">Linear • ReLU • Dropout 0.3 • Linear</text><rect width="250" height="30" x="1174" y="591" fill="#0E1B30" stroke="#2A4672" stroke-width="1.5" rx="15"/><text x="1299" y="610.42" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".7" text-anchor="middle">softmax(logits)[:, 1] = P4</text><path fill="none" stroke="#79A8FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" marker-end="url(#arrow)" d="M237 640 L237 714 L278 714 L278 744"/><path fill="none" stroke="#79A8FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" marker-end="url(#arrow)" d="M571 640 L571 714 L532 714 L532 744"/><path fill="none" stroke="#79A8FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" marker-end="url(#arrow)" d="M965 640 L965 714 L1004 714 L1004 744"/><path fill="none" stroke="#79A8FF" stroke-linecap="round" stroke-linejoin="round" stroke-width="3" marker-end="url(#arrow)" d="M1299 640 L1299 714 L1258 714 L1258 744"/><rect width="1144" height="174" x="196" y="744" fill="#0E1B30" stroke="#2970FF" stroke-width="3" filter="url(#shadow)" rx="24"/><rect width="198" height="36" x="226" y="770" fill="#2970FF" rx="18"/><text x="325" y="792.76" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">EXACT FUSION</text><text x="460" y="804" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start">P(AI-generated) =</text><text x="735" y="804" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="35" font-weight="800" text-anchor="start">(P3 + P4 + P1 + P2) / 4</text><text x="226" y="858" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="start">The addition order is preserved for numerical parity.</text><rect width="126" height="34" x="896" y="840" fill="#132541" stroke="#2A4672" stroke-width="1.5" rx="17"/><text x="959" y="861.08" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7" text-anchor="middle">NO GATING</text><rect width="154" height="34" x="1034" y="840" fill="#132541" stroke="#2A4672" stroke-width="1.5" rx="17"/><text x="1111" y="861.08" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7" text-anchor="middle">NO LEARNED WEIGHTS</text><rect width="110" height="34" x="1200" y="840" fill="#132541" stroke="#2A4672" stroke-width="1.5" rx="17"/><text x="1255" y="861.08" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7" text-anchor="middle">NO TTA</text><line x1="64" x2="1472" y1="970" y2="970" stroke="#2A4672" stroke-linecap="round" stroke-width="1.5"/><text x="64" y="998" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">Historical source: retired V1/V2 release records • not current infer/</text><text x="1472" y="998" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">Evidence before certainty</text></svg>