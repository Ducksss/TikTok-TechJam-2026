<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" aria-labelledby="title desc" role="img" viewBox="0 0 1536 1024"><title id="title">SynthFlag model decision register</title><desc id="desc">Four evidence-labeled decisions: keep equal-mean fusion, adopt an independently selected threshold, reject learned disagreement fusion after three leave-one-dataset-out failures, and block V3 without the exact organizer dataset.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#13213A" stroke-width="1" d="M 32 0 L 0 0 0 32" opacity=".55"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#000" flood-opacity=".28" stdDeviation="18"/></filter><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#79A8FF" d="M0,0 L12,6 L0,12 Z"/></marker></defs><rect width="1536" height="1024" fill="#07111F"/><rect width="1536" height="1024" fill="url(#grid)"/><rect width="8" height="20" x="64" y="49" fill="#2970FF" rx="4"/><rect width="8" height="30" x="76" y="39" fill="#2970FF" rx="4"/><rect width="8" height="42" x="88" y="27" fill="#2970FF" rx="4"/><rect width="8" height="54" x="100" y="15" fill="#79A8FF" rx="4"/><text x="124" y="66" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">SynthFlag</text><rect width="164" height="38" x="1308" y="38" fill="#123A82" stroke="#2A4672" stroke-width="1.5" rx="19"/><text x="1390" y="62.1" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".7" text-anchor="middle">TECHJAM 2026</text><text x="64" y="125" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.2" text-anchor="start">MODEL DECISION REGISTER</text><text x="64" y="172" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="43" font-weight="800" text-anchor="start">What shipped—and what the evidence stopped.</text><text x="64" y="210" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Each decision carries its evidence boundary so a promising experiment cannot quietly become a production claim.</text><line x1="64" x2="1472" y1="226" y2="226" stroke="#2A4672" stroke-linecap="round" stroke-width="2"/><rect width="1408" height="26" x="64" y="232" fill="#FF7184" rx="8"/><text x="768" y="251" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.1" text-anchor="middle">HISTORICAL V1/V2 BASELINE · NOT THE SELECTED TEST1 RUNTIME</text><rect width="688" height="264" x="64" y="266" fill="#0E1B30" stroke="#45D39A" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="108" cy="312" r="24" fill="#45D39A"/><text x="108" y="319" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">01</text><rect width="136" height="38" x="148" y="293" fill="#45D39A" rx="19"/><text x="216" y="316.76" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">KEPT</text><text x="92" y="380" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="29" font-weight="800" text-anchor="start">Transparent equal mean</text><rect width="688" height="264" x="784" y="266" fill="#0E1B30" stroke="#2970FF" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="828" cy="312" r="24" fill="#2970FF"/><text x="828" y="319" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">02</text><rect width="136" height="38" x="868" y="293" fill="#2970FF" rx="19"/><text x="936" y="316.76" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">ADOPTED</text><text x="812" y="380" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="29" font-weight="800" text-anchor="start">Threshold as deployment policy</text><rect width="688" height="264" x="64" y="568" fill="#0E1B30" stroke="#FF7184" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="108" cy="614" r="24" fill="#FF7184"/><text x="108" y="621" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">03</text><rect width="136" height="38" x="148" y="595" fill="#FF7184" rx="19"/><text x="216" y="618.76" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">REJECTED</text><text x="92" y="682" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="29" font-weight="800" text-anchor="start">Learned disagreement fusion</text><rect width="688" height="264" x="784" y="568" fill="#0E1B30" stroke="#F2C14E" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="828" cy="614" r="24" fill="#F2C14E"/><text x="828" y="621" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">04</text><rect width="136" height="38" x="868" y="595" fill="#F2C14E" rx="19"/><text x="936" y="618.76" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">BLOCKED</text><text x="812" y="682" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="29" font-weight="800" text-anchor="start">V3 performance evidence</text><text x="92" y="424" fill="#45D39A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">(P3 + P4 + P1 + P2) / 4</text><text x="92" y="464" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">Auditable • stable across domains</text><text x="92" y="489.5" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="500" text-anchor="start">No learned gate or hidden expert weights</text><text x="812" y="416" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">Continuous model score</text><text x="812" y="441.08" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">↓</text><text x="812" y="466.16" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="19" font-weight="600" text-anchor="start">independently selected operating point</text><rect width="246" height="48" x="1176" y="404" fill="#123A82" stroke="#2A4672" stroke-width="1.5" rx="24"/><text x="1299" y="434.46" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="19" font-weight="700" letter-spacing=".7" text-anchor="middle">0.2874746155</text><text x="812" y="500" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">Same model; policy changes downstream decisions.</text><text x="92" y="718" fill="#FF7184" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">Pooled AUC: 0.8661 → 0.8752</text><text x="92" y="754" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start">But every held-out dataset lost:</text><rect width="178" height="48" x="92" y="780" fill="#132541" stroke="#2A4672" stroke-width="2" rx="12"/><text x="106" y="810" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">CIFAKE</text><text x="256" y="810" fill="#FF7184" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end">−0.0614</text><rect width="178" height="48" x="288" y="780" fill="#132541" stroke="#2A4672" stroke-width="2" rx="12"/><text x="302" y="810" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">SID_Set</text><text x="452" y="810" fill="#FF7184" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end">−0.2198</text><rect width="178" height="48" x="484" y="780" fill="#132541" stroke="#2A4672" stroke-width="2" rx="12"/><text x="498" y="810" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start">WildFake</text><text x="648" y="810" fill="#FF7184" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="end">−0.0842</text><text x="812" y="718" fill="#F2C14E" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">Exact organizer DALL-E Advanced set</text><text x="812" y="752" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="600" text-anchor="start">8,843 required fake images are absent.</text><rect width="612" height="48" x="812" y="780" fill="#132541" stroke="#F2C14E" stroke-width="2" rx="12"/><text x="836" y="810" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="start">V3 metric</text><text x="1398" y="810" fill="#F2C14E" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="end">— unavailable</text><rect width="1408" height="70" x="64" y="866" fill="#132541" stroke="#2A4672" stroke-width="2" rx="18"/><text x="92" y="909" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" text-anchor="start">Evidence rule</text><text x="226" y="909" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="21" font-weight="700" text-anchor="start">A pooled gain is not a production win when domain-transfer guardrails fail.</text><line x1="64" x2="1472" y1="970" y2="970" stroke="#2A4672" stroke-linecap="round" stroke-width="1.5"/><text x="64" y="998" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">Source: submission/BENCHMARKS.md • protected V1, retrospective V2, blocked V3</text><text x="1472" y="998" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">Evidence before certainty</text></svg>