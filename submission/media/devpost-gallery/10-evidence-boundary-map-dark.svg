dth="210" height="40" x="652" y="716" fill="#45D39A" rx="20"/><text x="757" y="740.42" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".7" text-anchor="middle">AVAILABLE</text><line x1="888" x2="904" y1="538" y2="538" stroke="#79A8FF" stroke-linecap="round" stroke-width="3" marker-end="url(#arrow)"/><rect width="258" height="520" x="910" y="278" fill="#0E1B30" stroke="#F2C14E" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="946" cy="316" r="21" fill="#F2C14E"/><text x="946" y="322" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">04</text><rect width="210" height="38" x="934" y="354" fill="#132541" stroke="#F2C14E" stroke-width="1.5" rx="19"/><text x="1039" y="377.08" fill="#F2C14E" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7" text-anchor="middle">V2 • RETROSPECTIVE DEV</text><text x="934" y="438" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">2,004 calibration</text><text x="934" y="464.84" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">rows</text><line x1="934" x2="1144" y1="492" y2="492" stroke="#2A4672" stroke-linecap="round" stroke-width="1.5"/><text x="934" y="532" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Cross-fitted robustness</text><text x="934" y="554.5" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">+ transfer study</text><text x="934" y="577" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Not protected final</text><rect width="210" height="40" x="934" y="716" fill="#F2C14E" rx="20"/><text x="1039" y="740.42" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".7" text-anchor="middle">AVAILABLE</text><line x1="1170" x2="1186" y1="538" y2="538" stroke="#79A8FF" stroke-linecap="round" stroke-width="3" marker-end="url(#arrow)"/><rect width="258" height="520" x="1192" y="278" fill="#0E1B30" stroke="#FF7184" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="1228" cy="316" r="21" fill="#FF7184"/><text x="1228" y="322" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">05</text><rect width="210" height="38" x="1216" y="354" fill="#132541" stroke="#FF7184" stroke-width="1.5" rx="19"/><text x="1321" y="377.08" fill="#FF7184" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7" text-anchor="middle">V3 • BLOCKED</text><text x="1216" y="438" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">Exact organizer</text><text x="1216" y="464.84" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">source absent</text><line x1="1216" x2="1426" y1="492" y2="492" stroke="#2A4672" stroke-linecap="round" stroke-width="1.5"/><text x="1216" y="532" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">No substitute dataset</text><text x="1216" y="554.5" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">No performance metric</text><rect width="210" height="40" x="1216" y="716" fill="#FF7184" rx="20"/><text x="1321" y="740.42" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".7" text-anchor="middle">UNAVAILABLE</text><rect width="1236" height="100" x="150" y="836" fill="#132541" stroke="#2A4672" stroke-width="2" rx="22"/><rect width="166" height="38" x="178" y="866" fill="#2970FF" rx="19"/><text x="261" y="889.76" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">CLAIM RULE</text><text x="378" y="895" fill="#F8FAFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start">Paper facts ≠ code behavior ≠ protected results ≠ planned work.</text><line x1="64" x2="1472" y1="970" y2="970" stroke="#2A4672" stroke-linecap="round" stroke-width="1.5"/><text x="64" y="998" fill="#AFC2E2" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">Source: AGENTS.md • submission/BENCHMARKS.md • submission/THIRD_PARTY_NOTICES.md</text><text x="1472" y="998" fill="#79A8FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">Evidence before certainty</text></svg>