<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" aria-labelledby="title desc" role="img" viewBox="0 0 1536 1024"><title id="title">Historical SynthFlag four-expert system architecture</title><desc id="desc">Historical V1/V2 baseline: a deterministic RGB image path through four experts and exact mean fusion. This is not the selected TEST1 runtime.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#DDE7FA" stroke-width="1" d="M 32 0 L 0 0 0 32" opacity=".55"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#000" flood-opacity=".1" stdDeviation="18"/></filter><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2970FF" d="M0,0 L12,6 L0,12 Z"/></marker></defs><rect width="1536" height="1024" fill="#F4F7FE"/><rect width="1536" height="1024" fill="url(#grid)"/><rect width="8" height="20" x="64" y="49" fill="#0040C1" rx="4"/><rect width="8" height="30" x="76" y="39" fill="#0040C1" rx="4"/><rect width="8" height="42" x="88" y="27" fill="#0040C1" rx="4"/><rect width="8" height="54" x="100" y="15" fill="#2970FF" rx="4"/><text x="124" y="66" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">SynthFlag</text><rect width="164" height="38" x="1308" y="38" fill="#DCE8FF" stroke="#C4D5F3" stroke-width="1.5" rx="19"/><text x="1390" y="62.1" fill="#0040C1" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".7" text-anchor="middle">TECHJAM 2026</text><text x="64" y="125" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.2" text-anchor="start">OVERALL SYSTEM ARCHITECTURE</text><text x="64" y="172" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="43" font-weight="800" text-anchor="start">One image. Four experts. One review signal.</text><text x="64" y="210" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Checkpoint identity and deterministic preprocessing stay visible from input to artifact.</text><line x1="64" x2="1472" y1="226" y2="226" stroke="#C4D5F3" stroke-linecap="round" stroke-width="2"/><rect width="1408" height="26" x="64" y="232" fill="#C83349" rx="8"/><text x="768" y="251" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" letter-spacing="1.1" text-anchor="middle">HISTORICAL V1/V2 BASELINE · NOT THE SELECTED TEST1 RUNTIME</text><rect width="210" height="500" x="64" y="266" fill="#FFF" stroke="#C4D5F3" stroke-width="2" filter="url(#shadow)" rx="24"/><rect width="290" height="500" x="326" y="266" fill="#FFF" stroke="#C4D5F3" stroke-width="2" filter="url(#shadow)" rx="24"/><rect width="300" height="500" x="668" y="266" fill="#FFF" stroke="#C4D5F3" stroke-width="2" filter="url(#shadow)" rx="24"/><rect width="210" height="500" x="1020" y="266" fill="#FFF" stroke="#C4D5F3" stroke-width="2" filter="url(#shadow)" rx="24"/><rect width="190" height="500" x="1282" y="266" fill="#FFF" stroke="#C4D5F3" stroke-width="2" filter="url(#shadow)" rx="24"/><circle cx="103" cy="303" r="17" fill="#0040C1"/><text x="103" y="309" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">1</text><text x="132" y="310" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="start">INPUT</text><rect width="166" height="136" x="86" y="344" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="16"/><rect width="134" height="104" x="102" y="360" fill="#DCE8FF" rx="12"/><circle cx="206" cy="382" r="13" fill="#A06400"/><path fill="#2970FF" d="M102 444 L141 404 L169 430 L194 401 L236 444 Z"/><text x="169" y="520" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">RGB image</text><text x="169" y="558" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="middle">Decode</text><text x="169" y="587.45" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="middle">Convert to RGB</text><text x="169" y="616.9" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="middle">Supported formats</text><rect width="154" height="34" x="92" y="690" fill="#DCE8FF" stroke="#C4D5F3" stroke-width="1.5" rx="17"/><text x="169" y="712.44" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing=".7" text-anchor="middle">ONE INPUT</text><circle cx="365" cy="303" r="17" fill="#0040C1"/><text x="365" y="309" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">2</text><text x="394" y="310" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="start">VERIFY + PREPARE</text><rect width="246" height="95" x="348" y="344" fill="#EDF3FF" stroke="#A06400" stroke-width="2.5" rx="16"/><text x="366" y="373" fill="#A06400" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.3" text-anchor="start">CHECKPOINT GATE</text><text x="366" y="405" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="23" font-weight="800" text-anchor="start">size + SHA-256 × 4</text><text x="366" y="428" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">before deserialization</text><rect width="246" height="112" x="348" y="466" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="16"/><rect width="92" height="30" x="366" y="482" fill="#0040C1" rx="15"/><text x="412" y="501.76" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">CLIP</text><text x="366" y="538" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">224 × 224</text><text x="366" y="563" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">bicubic • center crop</text><rect width="246" height="112" x="348" y="600" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="16"/><rect width="104" height="30" x="366" y="616" fill="#2970FF" rx="15"/><text x="418" y="635.76" fill="#07111F" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">SIGLIP</text><text x="366" y="672" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="24" font-weight="800" text-anchor="start">384 × 384</text><text x="366" y="697" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">bicubic • center crop</text><circle cx="707" cy="303" r="17" fill="#0040C1"/><text x="707" y="309" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">3</text><text x="736" y="310" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="start">FOUR EXPERTS</text><rect width="256" height="76" x="690" y="344" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="14"/><circle cx="720" cy="382" r="19" fill="#0040C1"/><text x="720" y="388" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">E1</text><text x="750" y="375" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start">CLIP ViT-L/14</text><text x="750" y="400" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">768 → 256 → 2</text><rect width="256" height="76" x="690" y="436" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="14"/><circle cx="720" cy="474" r="19" fill="#0040C1"/><text x="720" y="480" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">E2</text><text x="750" y="467" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start">CLIP ViT-L/14</text><text x="750" y="492" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">768 → 256 → 2</text><rect width="256" height="76" x="690" y="528" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="14"/><circle cx="720" cy="566" r="19" fill="#2970FF"/><text x="720" y="572" fill="#07111F" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">E3</text><text x="750" y="559" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start">SigLIP So400M</text><text x="750" y="584" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">1152 → 256 → 2</text><rect width="256" height="76" x="690" y="620" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="14"/><circle cx="720" cy="658" r="19" fill="#2970FF"/><text x="720" y="664" fill="#07111F" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">E4</text><text x="750" y="651" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="800" text-anchor="start">SigLIP So400M</text><text x="750" y="676" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">1152 → 256 → 2</text><rect width="224" height="30" x="706" y="724" fill="#DCE8FF" stroke="#C4D5F3" stroke-width="1.5" rx="15"/><text x="818" y="743.42" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing=".7" text-anchor="middle">SOFTMAX → CLASS 1</text><circle cx="1059" cy="303" r="17" fill="#0040C1"/><text x="1059" y="309" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">4</text><text x="1088" y="310" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="start">FUSE</text><text x="1125" y="382" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">P3 + P4</text><text x="1125" y="415.04" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="middle">+ P1 + P2</text><line x1="1058" x2="1192" y1="458" y2="458" stroke="#2970FF" stroke-linecap="round" stroke-width="3"/><text x="1125" y="502" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="34" font-weight="800" text-anchor="middle">4</text><rect width="162" height="38" x="1044" y="548" fill="#0040C1" rx="19"/><text x="1125" y="571.76" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">EQUAL MEAN</text><text x="1125" y="630" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle">No gating</text><text x="1125" y="657.9" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle">No learned weights</text><text x="1125" y="685.8" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="18" font-weight="500" text-anchor="middle">No TTA</text><circle cx="1321" cy="303" r="17" fill="#0040C1"/><text x="1321" y="309" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" text-anchor="middle">5</text><text x="1350" y="310" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="1.5" text-anchor="start">OUTPUT</text><text x="1377" y="388" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="40" font-weight="800" text-anchor="middle">0 → 1</text><text x="1377" y="423" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">continuous score</text><rect width="146" height="82" x="1304" y="464" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="14"/><text x="1377" y="495" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">API</text><text x="1377" y="525" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">single image</text><rect width="146" height="128" x="1304" y="566" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="14"/><text x="1377" y="596" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="800" text-anchor="middle">CLI</text><text x="1377" y="626" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">CSV</text><text x="1377" y="647.6" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">JSON</text><text x="1377" y="669.2" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="600" text-anchor="middle">metadata</text><rect width="140" height="30" x="1307" y="718" fill="#DCE8FF" stroke="#C4D5F3" stroke-width="1.5" rx="15"/><text x="1377" y="737.08" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7" text-anchor="middle">PROVENANCE</text><line x1="282" x2="314" y1="516" y2="516" stroke="#2970FF" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow)"/><line x1="624" x2="656" y1="516" y2="516" stroke="#2970FF" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow)"/><line x1="976" x2="1008" y1="516" y2="516" stroke="#2970FF" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow)"/><line x1="1238" x2="1270" y1="516" y2="516" stroke="#2970FF" stroke-linecap="round" stroke-width="4" marker-end="url(#arrow)"/><rect width="1408" height="122" x="64" y="808" fill="#EDF3FF" stroke="#A06400" stroke-width="2.5" rx="22"/><rect width="192" height="34" x="88" y="834" fill="#A06400" rx="17"/><text x="184" y="855.76" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">DOWNSTREAM POLICY</text><text x="308" y="860" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">Score first. Threshold second.</text><text x="308" y="896" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="19" font-weight="500" text-anchor="start">A threshold changes a decision boundary—not the model score or ranking.</text><rect width="120" height="42" x="1182" y="834" fill="#FFF" stroke="#C4D5F3" stroke-width="1.5" rx="21"/><text x="1242" y="860.44" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="16" font-weight="700" letter-spacing=".7" text-anchor="middle">0.50000</text><text x="1318" y="862" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start">or</text><rect width="94" height="42" x="1354" y="834" fill="#0040C1" rx="21"/><text x="1401" y="860.1" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".7" text-anchor="middle">0.28747</text><line x1="64" x2="1472" y1="970" y2="970" stroke="#C4D5F3" stroke-linecap="round" stroke-width="1.5"/><text x="64" y="998" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">Historical source: retired V1/V2 release records • not current infer/</text><text x="1472" y="998" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">Evidence before certainty</text></svg>