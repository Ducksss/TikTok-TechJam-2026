<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" aria-labelledby="title desc" role="img" viewBox="0 0 1536 1024"><title id="title">SynthFlag evidence boundary map</title><desc id="desc">A five-layer map separating research lineage, executed release behavior, protected V1 results, retrospective V2 development evidence, and blocked V3 evidence.</desc><defs><pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path fill="none" stroke="#DDE7FA" stroke-width="1" d="M 32 0 L 0 0 0 32" opacity=".55"/></pattern><filter id="shadow" width="140%" height="140%" x="-20%" y="-20%"><feDropShadow dx="0" dy="12" flood-color="#000" flood-opacity=".1" stdDeviation="18"/></filter><marker id="arrow" markerHeight="12" markerUnits="strokeWidth" markerWidth="12" orient="auto" refX="10" refY="6"><path fill="#2970FF" d="M0,0 L12,6 L0,12 Z"/></marker></defs><rect width="1536" height="1024" fill="#F4F7FE"/><rect width="1536" height="1024" fill="url(#grid)"/><rect width="8" height="20" x="64" y="49" fill="#0040C1" rx="4"/><rect width="8" height="30" x="76" y="39" fill="#0040C1" rx="4"/><rect width="8" height="42" x="88" y="27" fill="#0040C1" rx="4"/><rect width="8" height="54" x="100" y="15" fill="#2970FF" rx="4"/><text x="124" y="66" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="28" font-weight="800" text-anchor="start">SynthFlag</text><rect width="164" height="38" x="1308" y="38" fill="#DCE8FF" stroke="#C4D5F3" stroke-width="1.5" rx="19"/><text x="1390" y="62.1" fill="#0040C1" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" letter-spacing=".7" text-anchor="middle">TECHJAM 2026</text><text x="64" y="125" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="17" font-weight="800" letter-spacing="2.2" text-anchor="start">EVIDENCE BOUNDARY MAP</text><text x="64" y="172" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="43" font-weight="800" text-anchor="start">Five evidence classes. Zero silent promotion.</text><text x="64" y="210" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="20" font-weight="500" text-anchor="start">Every public claim stays attached to the source that can actually support it.</text><line x1="64" x2="1472" y1="226" y2="226" stroke="#C4D5F3" stroke-linecap="round" stroke-width="2"/><rect width="258" height="520" x="64" y="278" fill="#FFF" stroke="#2970FF" stroke-width="2.5" filter="url(#shadow)" rx="24"/><circle cx="100" cy="316" r="21" fill="#2970FF"/><text x="100" y="322" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="800" text-anchor="middle">01</text><rect width="210" height="38" x="88" y="354" fill="#EDF3FF" stroke="#2970FF" stroke-width="1.5" rx="19"/><text x="193" y="377.08" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing=".7" text-anchor="middle">RESEARCH LINEAGE</text><text x="88" y="438" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">Published method</text><text x="88" y="464.84" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="22" font-weight="800" text-anchor="start">+ checkpoints</text><line x1="88" x2="298" y1="492" y2="492" stroke="#C4D5F3" stroke-linecap="round" stroke-width="1.5"/><text x="88" y="532" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Credits Tu et al.</text><text x="88" y="554.5" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">architecture + weights</text><text x="88" y="577" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="start">Not run