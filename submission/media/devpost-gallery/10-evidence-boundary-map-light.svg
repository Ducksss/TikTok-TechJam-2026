=".7" text-anchor="middle">UNAVAILABLE</text><rect width="1236" height="100" x="150" y="836" fill="#EDF3FF" stroke="#C4D5F3" stroke-width="2" rx="22"/><rect width="166" height="38" x="178" y="866" fill="#0040C1" rx="19"/><text x="261" y="889.76" fill="#FFF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="14" font-weight="700" letter-spacing=".7" text-anchor="middle">CLAIM RULE</text><text x="378" y="895" fill="#111827" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="25" font-weight="800" text-anchor="start">Paper facts ≠ code behavior ≠ protected results ≠ planned work.</text><line x1="64" x2="1472" y1="970" y2="970" stroke="#C4D5F3" stroke-linecap="round" stroke-width="1.5"/><text x="64" y="998" fill="#53627A" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start">Source: AGENTS.md • submission/BENCHMARKS.md • submission/THIRD_PARTY_NOTICES.md</text><text x="1472" y="998" fill="#2970FF" font-family="Instrument Sans, Poppins, Arial, sans-serif" font-size="15" font-weight="700" text-anchor="end">Evidence before certainty</text></svg>